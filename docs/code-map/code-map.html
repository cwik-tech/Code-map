from './test-assertions.mjs';\nimport { summarizeTests } from './test-summary.mjs';\n\nconst declaredTypes = [['e2e', /^(e2e|end-to-end|playwright|cypress)$/], ['integration', /^(integration|integrations|int)$/], ['api', /^api$/],\n  ['contract', /^contracts?$/], ['smoke', /^smoke$/], ['live', /^live$/], ['performance', /^(perf|performance|load|bench|benchmarks?)$/], ['unit', /^unit$/]];\nconst testFolder = /^(__tests__|tests?|spec|specs|e2e|cypress|playwright)$/;\nconst effects = {\n  browser: ['@playwright/test', 'playwright', 'playwright-core', 'puppeteer', 'puppeteer-core', 'cypress', 'selenium-webdriver', 'webdriverio'],\n  process: ['node:child_process', 'child_process', 'execa', 'cross-spawn', 'zx'],\n  network: ['node:http', 'http', 'node:https', 'https', 'node:net', 'net', 'supertest', 'undici', 'axios', 'got', 'ws', 'node-fetch'],\n  database: ['pg', 'postgres', '@prisma/client', 'mysql2', 'better-sqlite3', 'sqlite3', 'node:sqlite', 'mongodb', 'mongoose', 'redis', 'ioredis',\n    '@neondatabase/serverless', 'drizzle-orm', 'kysely', '@upstash/redis', 'testcontainers'],\n  filesystem: ['node:fs', 'fs', 'fs-extra', 'tmp'],\n  dom: ['@testing-library/react', '@testing-library/dom', '@testing-library/vue', '@testing-library/svelte', '@testing-library/user-event', 'jsdom', 'happy-dom'],\n};\nconst heavy = ['browser', 'process', 'network', 'database'];\nconst callDepth = 3, viaShown = 5;\nconst exitKinds = new Set(['remove-throw', 'remove-error-return', 'rethrow-in-catch', 'status-to-200', 'remove-reject', 'remove-exit', 'remove-call']);\nconst runnable = /\\.(test|spec|e2e)\\.[cm]?[jt]sx?$/;\n// A name that describes a failure, unless it says the failure does not happen (\"does not throw\").\nconst failureName = /\\b(fail(s|ed|ure|ing)?|errors?|throws?|thrown|rejects?|rejected|rejection|invalid|malformed|unauthori[sz]ed|forbidden|denied|refuses?|timeouts?|times? out|timed out|not found|cannot|can't|unable|wrong|bad|corrupt(ed)?|conflicts?|abort(s|ed)?|exceed(s|ed)?|unsupported|disallow(s|ed)?|illegal|crash(es)?)\\b/i;\nconst notFailure = /\\b(does not|doesn't|never|without|no)\\s+(throw|fail|error|reject|crash)/i;\nconst regressionName = /\\b(regression|regressions|issue\\s*#?\\d+|bug\\s*#?\\d+|reproduc(es|tion))\\b|#\\d+\\b/i;\n\nexport const nameSuggestsFailure = (name) => failureName.test(name) && !notFailure.test(name);\n\nexport function analyzeTests(data, analysisFiles, extra = {}) {\n  const sources = new Map(data.files.map((file) => [file.path, file]));\n  const base = commonFolder(data.files.map((file) => file.path));\n  const moduleOf = (path) => { const rest = base ? path.slice(base.length + 1) : path; return rest.includes('/') ? rest.split('/')[0] : '(top)'; };\n  const declarations = topLevel(data.files);\n  const resolveExport = exportResolver(sources, declarations);\n  const resolveReference = (reference) => {\n    const cut = reference.lastIndexOf('#'), path = reference.slice(0, cut), name = reference.slice(cut + 1);\n    return declarations.has(reference) ? reference : name === '*' ? null : resolveExport(path, name);\n  };\n  const callers = new Map();\n  for (const [key, item] of declarations) for (const reference of item.references) {\n    const target = resolveReference(reference);\n    if (!target || target === key) continue;\n    if (!callers.has(target)) callers.set(target, new Set());\n    callers.get(target).add(key);\n  }\n  const labels = data.testLabels?.files ?? {};\n  const cases = [], testFiles = [], direct = new Map(), strengthFor = [];\n  const stronger = (a, b) => (b === null || strengthRank[a] > strengthRank[b] ? a : b);\n  for (const test of data.testFiles ?? []) {\n    const scan = test.scan;\n    if (!scan) continue;\n    const found = new Set(test.externals ?? []);\n    const used = Object.keys(effects).filter((kind) => effects[kind].some((name) => found.has(name)) || (kind === 'network' && scan.fetch));\n    const reached = test.imports.filter((path) => sources.has(path));\n    const (const reference of facts.references) result.references.add(reference); // a bare reference: possible reach, no check\n      }\n    }\n    ts.forEachChild(node, walk);\n  };\n  walk(body);\n  return result;\n}\n\nconst noFacts = { assertions: 0, failures: [], checks: [], references: new Set(), smells: new Set(), plan: false, subtests: 0 };\nfunction helperFacts(helper, ctx) {\n  if (ctx.memo.has(helper)) return ctx.memo.get(helper);\n  if (ctx.active.has(helper)) return noFacts; // recursive helpers\n  ctx.active.add(helper);\n  const facts = inspect(helper.body, ctx);\n  ctx.active.delete(helper);\n  ctx.memo.set(helper, facts);\n  return facts;\n}\n\n/** A helper's checks and calls count for the case; its smells do not, because cleanup helpers often catch on purpose. */\nfunction merge(result, facts, bind, conditional) {\n  result.assertions += facts.assertions;\n  const tie = (item) => {\n    const tied = item.targets.length || !bind.size ? item : { ...item, targets: [...bind].sort() };\n    return conditional && !tied.conditional ? { ...tied, conditional: true } : tied;\n  };\n  result.failures.push(...facts.failures.map(tie));\n  result.checks.push(...facts.checks.map(tie));\n  for (const reference of facts.references) result.references.add(reference);\n  result.plan ||= facts.plan;\n}\n\nfunction hasAssertion(node, ctx) {\n  let found = false;\n  const walk = (child) => { if (found) return; if (ts.isCallExpression(child) && assertionOf(child, ctx)) found = true; else ts.forEachChild(child, walk); };\n  walk(node);\n  return found;\n}\n\nconst callbackConsumers = new Set(['forEach', 'map', 'flatMap', 'filter', 'some', 'every', 'reduce', 'then', 'step']);\nconst calleeName = (call) => ts.isPropertyAccessExpression(call.expression) ? call.expression.name.text : ts.isIdentifier(call.expression) ? call.expression.text : '';\n\n/**\n * A fixed wait: `new Promise((resolve) => setTimeout(resolve, 100))`, `sleep(100)` or Playwright's `waitForTimeout`.\n * A timer that rejects is a time limit for another promise, not a wait.\n */\nfunction fixedWait(node, name) {\n  if (['sleep', 'delay', 'waitForTimeout'].includes(name)) return node.arguments.some(ts.isNumericLiteral);\n  if (name === 'wait') return ts.isIdentifier(node.expression) && node.arguments.length === 1 && ts.isNumericLiteral(node.arguments[0]); // not wait(condition, timeout)\n  if (name !== 'setTimeout' || !node.arguments.length) return false;\n  for (let parent = node.parent, depth = 0; parent && depth \u003c 4; parent = parent.parent, depth++) {\n    if (!ts.isNewExpression(parent) || parent.expression.getText() !== 'Promise') continue;\n    const executor = parent.arguments?.[0], first = executor && isFunction(executor) ? executor.parameters[0]?.name : null;\n    const resolve = first && ts.isIdentifier(first) ? first.text : null;\n    const callback = node.arguments[0];\n    if (!resolve) return false;\n    return ts.isIdentifier(callback) ? callback.text === resolve : isFunction(callback) && new RegExp(`\\\\b${resolve}\\\\s*\\\\(`).test(callback.body.getText());\n  }\n  return false;\n}\n\n/** An empty catch block, or one that only logs: a failure inside the try block can pass unnoticed. */\nfunction hidesFailure(block) {\n  return block.statements.every((statement) => ts.isExpressionStatement(statement) && ts.isCallExpression(statement.expression)\n    && ts.isPropertyAccessExpression(statement.expression.expression) && statement.expression.expression.expression.getText() === 'console');\n}\n\n/** Functions declared anywhere in the file, so a case that calls a local helper also gets the helper's assertions and calls. */\nfunction localHelpers(source, checker) {\n  const helpers = new Map();\n  const visit = (node) => {\n    if (ts.isFunctionDeclaration(node) && node.name && node.body) helpers.set(checker.getSymbolAtLocation(node.name), node);\n    if (ts.isVariableDeclaration(node) && ts.isIdentifier(node.name) && node.initializer && isFunction(node.initializer)) hChild(node, visit);\n  };\n  visit(source);\n  return found;\n}\n"},{"path":"lib/test-summary.mjs","lines":209,"header":"","summary":"Exports summarizeTests, a self-contained function that limits a test scan to an optional scope (the whole project, or one or more paths) and builds a test-quality summary: inventory counts; statistics that each name their evidence source (inventory, inferred, pattern, measured coverage, mutation, Git fix commits or model labels); observations sorted by severity, each with up to eight source locations, for problems such as .only focus, functions whose failure exits have no tied failure assertion, exits that never ran, surviving mutants, weak or missing result checks, test smells and fix commits with no test change; up to six prioritized next steps, some with shell-quoted code-map mutate and inspect commands for verification; and fixed text that states what the scan can and cannot show, how an agent should use the result, and the limits of the evidence.","status":"current","imports":[],"externals":[],"exports":["summarizeTests"],"edges":[],"exportDetails":[{"name":"summarizeTests","category":"value","localName":"summarizeTests","typeOnly":false,"line":5,"localReferences":0}],"declarations":[{"name":"summarizeTests","kind":"function","exported":true,"planned":false,"children":[],"note":"The test-quality summary: statistics, what the scan sees, next steps and the limits of the evidence.\nSelf-contained on purpose: the offline page embeds this same function to summarize a module, a folder or a file.\nEach statistic and observation names its evidence: inventory (counted in test files), inferred (links from references\nand pattern-matched checks), pattern (a source pattern), measured (coverage), git (history) or model (optional labels).","start":5,"end":209,"startOffset":464,"endOffset":29216,"metrics":{"lines":205,"internalDependencies":[],"hookCalls":[],"failureExits":[]}}],"uses":{},"valueUses":{},"tests":["test/test-quality.test.mjs"],"created":"2026-10-21T21:31:57-04:00","changed":"2026-10-21T22:42:29-04:00","source":"// The test-quality summary: statistics, what the scan sees, next steps and the limits of the evidence.\n// Self-contained on purpose: the offline page embeds this same function to summarize a module, a folder or a file.\n// Each statistic and observation names its evidence: inventory (counted in test files), inferred (links from references\n// and pattern-matched checks), pattern (a source pattern), measured (coverage), git (history) or model (optional labels).\nexport function summarizeTests(tests, scope = {}) {\n  const roots = scope.paths ?? (scope.path ? [scope.path] : null), scoped = !!roots;\n  const inScope = (path) => !roots || roots.some((root) => path === root || path.startsWith(root + '/'));\n  const fmt = (n) => n.toLocaleString('en-US');\n  const plural = (n, one, many = one + 's') => `${fmt(n)} ${n === 1 ? one : many}`;\n  const sum = (list, value) => list.reduce((total, item) => total + value(item), 0);\n  const at = (path, line, text, test = null) => ({ path, line, text, ...(test ? { test } : {}) });\n  // Paths come from the mapped repository, which is untrusted: a file name can hold shell syntax such as $(…).\n  const shellQuote = (value) => /^[\\w./@+-]+$/.test(value) ? value : `'${value.replaceAll(\"'\", \"'\\\\''\")}'`;\n  const units = tests.units.filter((unit) => inScope(unit.path)), withExits = units.filter((unit) => unit.exits.length);\n  // A scope's cases are the tests that call its functions directly or reach them through callers (first few per function).\n  const declaredPaths = new Set(units.flatMap(unit => unit.declaredTests ?? []));\n  const caseIds = scoped ? [...new Set([...units.flatMap((unit) => [...unit.direct, ...unit.viaCases.map((item) => item.id)]),\n    ...tests.cases.filter(item => declaredPaths.has(item.path)).map(item => item.id)])].sort((a, b) => a - b) : tests.cases.map((item) => item.id);\n  const cases = caseIds.map((id) => tests.cases[id]), casePaths = new Set(cases.map((item) => item.path));\n  const files = tests.testFiles.filter((file) => !scoped || casePaths.has(file.path));\n  const testFiles = files.filter((file) => file.kind === 'tests'), unrecognized = scoped ? [] : files.filter((file) => file.kind === 'unrecognized');\n  const runs = cases.filter((item) => item.status !== 'skipped' && item.status !== 'todo');\n  const withStatus = (status) => cases.filter((item) => item.status === status);\n  const focused = cases.filter((item) => item.focus); // a .only marker, also inside a skipped suite\n  const unitsWith = (status) => withExits.filter((unit) => unit.status === status);\n  const direct = unitsWith('direct'), indirect = unitsWith('indirect'), noAssertion = unitsWith('no-failure-assertion'), unreached = unitsWith('unreached');\n  const priority = (unit) => unit.exits.length * (1 + unit.affects) + (unit.exported ? 0.5 : 0);\n  const missing = [...noAssertion, ...unreached].sort((a, b) => priority(b) - priority(a) || a.path.localeCompare(b.path) || a.line - b.line);\n  const exits = withExits.flatMap((unit) => unit.exits.map((exit) => ({ ...exit, unit })));\n  const known = exits.filter((exit) => exit.hits !== null), notRan = known.filter((exit) => exit.hits === 0);\n  const fixes = (tests.fixCommits?.commits ?? []).filter((commit) => !scoped || commit.sources.some(inScope));\n  const fixNoTest = fixes.filter((commit) => commit.tests.length === 0);\n  const smelly = (smell) => runs.filter((item) => item.smells.includes(smell));\n  // How strictly tests check results (a static rating), and which mutants they detect (measured by a mutation run).\n  const called = units.filter((unit) => unit.resultCheck !== null), checkedAs = (list) => called.filter((unit) => list.includes(unit.resultCheck));\n  const exactly = checkedAs(['exact']), partly = checkedAs(['partial', 'unknown', 'snapshot']), weakly = checkedAs(['weak', 'call', 'tautology']), unchecked = checkedAs(['none']);\n  const mutated = e test for ${unit.name} (${unit.path}:${unit.line}). It has ${plural(unit.exits.length, 'failure exit')}, at line${unit.exits.length === 1 ? '' : 's'} ${lines}.${test ? ` Start from the test \"${test.name}\" (${test.path}:${test.line}), which already reaches it.` : ''} Assert on the error or the value that ${unit.name} throws or returns.`,\n      target: { key: unit.key, path: unit.path, line: unit.line, name: unit.name, exits: unit.exits }, startFrom: test,\n      verify: verifyFor(unit, `the selected tests detect the mutant of each failure exit of ${unit.name}`), evidence: [unitAt(unit)] });\n  }\n  for (const commit of fixNoTest.slice(0, 1)) nextSteps.push({ source: 'git', text: `Add a regression test for the fix in commit ${commit.sha.slice(0, 7)} (\"${commit.subject}\").`, evidence: [at(commit.sources[0], null, commit.subject)] });\n  for (const item of smelly('no-assertions').slice(0, 1)) nextSteps.push({ source: 'pattern', text: `Add an assertion to \"${item.name}\" (${item.path}:${item.line}).`, evidence: [caseAt(item)] });\n  if (tests.mutation.state !== 'measured' && missing.length) {\n    nextSteps.push({ source: 'measured', text: `Measure: run code-map mutate --worktree --file ${shellQuote(missing[0].path)} to see which changes the tests do not detect.`, evidence: [] });\n  }\n  if (tests.coverage.state === 'none') nextSteps.push({ source: 'measured', text: 'Run the tests with coverage (lcov), then map the working tree with --worktree to see which failure exits ran.', evidence: [] });\n  else if (tests.coverage.state === 'not-applicable') nextSteps.push({ source: 'measured', text: 'Map the working tree with --worktree to use the coverage report for the failure exits.', evidence: [] });\n  if (!scoped && !tests.labels.current && cases.length) nextSteps.push({ source: 'model', text: 'Optional: run code-map labels and let a model label the intent of each test case.', evidence: [] });\n  if (!observations.length) observations.push({ key: 'none', severity: 'l "target":"lib/test-summary.mjs","specifier":"../lib/test-summary.mjs","kind":"value","mode":"static","line":13,"typeNames":[],"valueNames":["summarizeTests"]}],"uses":{"lib/analyze.mjs":["analyzeFile","createResolver"],"lib/analysis.mjs":["analyzeProject","createReport"],"lib/build.mjs":["renderPage"],"lib/coverage.mjs":["readCoverage"],"lib/test-labels.mjs":["labelStatus","labelsTodo","loadTestLabels","stampTestLabels"],"lib/test-summary.mjs":["summarizeTests"]},"valueUses":{"lib/analyze.mjs":["analyzeFile","createResolver"],"lib/analysis.mjs":["analyzeProject","createReport"],"lib/build.mjs":["renderPage"],"lib/coverage.mjs":["readCoverage"],"lib/test-labels.mjs":["labelStatus","labelsTodo","loadTestLabels","stampTestLabels"],"lib/test-summary.mjs":["summarizeTests"]},"externals":["node:assert","node:child_process","node:fs","node:os","node:path","node:test","node:url"],"entrypoints":[]}],"unreadableTests":[],"fixCommits":{"window":100,"scanned":12,"commits":[]},"testLabels":{"file":"docs/code-map/test-labels.json","files":{"test/entrypoint-links.test.mjs":{"status":"current","cases":{"declared subprocess links select real CLI tests without granting direct assertion evidence":{"intent":"happy","note":"A configured testEntrypoints mapping links a CLI test to the source file. The test checks that the link is recorded as declared, that direct links stay empty and failureDirect is 0, that the scoped summary keeps both cases and says 'declared subprocess', and that mutate detects both mutants."},"historical snapshots ignore configured entrypoints that did not exist in that revision":{"intent":"edge","note":"The config points to bin/future.mjs, which does not exist at HEAD. inspect --ref HEAD still exits 0, and the source file has no declared tests."},"`rejects ${name} entrypoint mappings before executing tests`":{"intent":"unhappy","note":"This test runs once for each invalid mapping: a non-object, a non-array target, an escaping path and a missing entrypoint. Each run expects exit status 1 and a stderr message that names testEntrypoints."}}},"test/aliases.test.mjs":{"status":"current","cases":{"nested referenced app and tooling configs resolve their own aliases without leaking to the backend":{"intent":"happy","note":"The app config resolves '@/' and '@contracts/' imports for ui/src, and the type import shows up under uses. The node config maps '@/button' to ui/config for vite.config.ts. A server file that is outside both configs resolves '@/button' to null."},"aliases retain inherited target origins and use TypeScript pattern precedence and fallback targets":{"intent":"edge","note":"Uses an extended config that contains a comment. Inherited paths resolve relative to the base config. The more specific '@/special/*' pattern wins over '@/*'. When the first target is missing, the resolver uses the next target in the list."},"baseUrl is relative to its config and absent baseUrl does not invent repository-root imports":{"intent":"edge","note":"A baseUrl in ui/jsconfig resolves bare 'button' to ui/src/button.js. Without a baseUrl, a bare import from server/ resolves to null. A relative '../button.js' import still maps to button.ts."},"collection uses nested config from the requested Git snapshot for source and test imports":{"intent":"happy","note":"Collects from a real Git repository. With ref HEAD, the source and test imports use the committed alias config. With the working tree, the import follows the uncommitted config change to ui/config/button.ts."},"root aliases remain available to test files outside the compiler include list":{"intent":"edge","note":"A test file under tests/ is outside the root include list ['src']. It still resolves the root '@/button' alias to src/button.ts."}}},"test/analysis.test.mjs":{"status":"current","cases":{"all-dependency cycles retain type evidence while value cycles include side effects and dynamic edges":{"intent":"happy","note":"Both the type-only cycle and the side-effect/dynamic-import cycle appear in cycles.all. Only the side-effect/dynamic cycle appears in cycles.value. The test also checks the edge kinds and lines, including that an inline 'type' specifier import counts as a side-effect edge."},"shared-type candidates name the declaration and both sides of parent-child evidence":{"intent":"happy","note":"Checks the exact sharedTypes entry: the owner file, the type name and its line, and the consumer file with its import line, for a child that imports a type from its parent."},"export usage separates test-only, local references, aliases and primitive vendor candidates":{"intent":"happy","note":"Checks the category and usage of each export: a type used only by tests, an unreferenced value that is used locally (localReferences 1), a value used by source, and an unreferenced re-export alias. It also checks that a ui/components/ui file is flagged as a vendor candidate."},"compact reports retain selected evidence and distinguish direct tests from tests reaching through helpers":{"intent":"happy","note":"The report for src/a.ts splits direct tests from tests that reach it through a helper. It also lists importers, leaves out source bodies and uses schemaVersion 1. The test also expects a throw for an unknown file and for an invalid change value."},"wildcard reexports with unresolved symbol exposure are not classified as unused declarations":{"intent":"edge","note":"A barrel with 'export *' gets usage 'unknown', not 'unreferenced', although a consumer imports a symbol through it."}}},"test/enrich.test.mjs":{"status":"current","cases":{"enrichment refreshes changed source bodies and missing cases but reuses current file results":{"intent":"happy","note":"Checks that tasks are created for files with no result, that no tasks remain once hashes and labels match, that a task comes back after a source change, and that a label task comes back after a new test case is added."},"`rejects an ${name} model description`":{"intent":"unhappy","note":"An empty, whitespace-only, 1001-character or non-string summary makes validateEnrichment throw an error that matches /model output/i."},"`rejects ${name} model test cases`":{"intent":"unhappy","note":"An unknown case name, a duplicate case, a null entry or a note over 500 characters makes validateEnrichment throw a model output error."},"`rejects a provider response with ${name}`":{"intent":"unhappy","note":"Malformed JSON, null, is_error true, missing structured_output or an incomplete items list makes decodeEnrichment throw 'Claude enrichment failed'."},"decodes a complete provider response before returning validated descriptions":{"intent":"happy","note":"A valid structured_output response decodes, and the first result has the expected summary."},"model output must cover exactly the requested paths and cases with valid intents":{"intent":"unhappy","note":"A complete result is accepted with length 2. Most assertions are rejections: null output, an empty items list, duplicate items, an unexpected path, missing cases and an invalid intent."}}},"test/full-run.test.mjs":{"status":"current","cases":{"default run verifies tests and all eligible mutants, builds the map, and reuses unchanged results":{"intent":"happy","note":"The default run writes a complete mutation report with 2 passed tests and 2 detected mutants, plus lcov and an HTML page with the description and labels. A second run reuses the results and leaves the report unchanged. --force and missing coverage make it verify again, and a changed failing test makes the run fail."},"an explicit mutation budget never caches unchecked candidates as a complete run":{"intent":"edge","note":"With --max-mutants 1, the run exits 1 and reports 'incomplete'. workflow.complete is false, the unit status is partial, and no HTML page is written."},"committing unchanged code and editing documentation preserve verified execution results":{"intent":"edge","note":"After README and docs edits are committed, the next run reports that it reuses the results om files that cannot load, and outcomes keep timeouts and errors apart":{"intent":"edge","note":"parseResult must split TAP and Jest-style JSON output into failed tests and file load errors. outcome must return 'detected' with killedBy, 'survived' and 'timeout'. It must return 'error', not 'detected', for three borderline cases: a file load error, fewer discovered tests than the baseline, and a nonzero exit with no failing test."},"acceptance: mutate detects a checked exit, keeps an unchecked one as survived, proves the copy loads, and leaves the repository unchanged":{"intent":"happy","note":"End-to-end CLI run on a temporary git repository. Asserts that mutants in the tested function are 'detected' with the killing test names and that mutants in the untested function 'survived'. Also checks the canary 'error', baseline counts, baseline and canary reuse flags, and the stdout summary. The source file and git status must stay unchanged. 'inspect --mutation' must show the survived and detected exits and a 'measured' next step."},"HTTP mutations change the status argument without mistaking response bodies or text limits for statuses":{"intent":"edge","note":"Only real status arguments get 'status-to-200' mutants: Response.json options, new Response options, res.status, writeHead and Hono c.text. A text length of 500, a 500 inside a body object and a 'status' key inside a JSON payload must not be mutated."},"mutate runs no mutant when the selected tests fail without one":{"intent":"unhappy","note":"A test fails on the unmutated code. The CLI must still exit 0 but report the unit as 'baseline-failed' with zero mutants. It must also record the failing test file and the failing test name in 'excluded'."},"mutation test processes cannot accidentally fall back to the live Claude executable":{"intent":"edge","note":"Safety and isolation check. The fixture test asserts that CODE_MAP_CLAUDE is set in the mutation test process and points to a path that does not exist. The run in e group tile is null. Valid 50% and zero 0% values are kept. The checks and the priority chart report 'Coverage unknown · 1' and give no gap or tooltip for the unknown file."},"working-folder LCOV cannot measure a mapped commit or a historical slider snapshot":{"intent":"unhappy","note":"Coverage is refused (null) when the snapshot is an unbound revision or a historical slider position. The checks note that there is no revision or test-command binding."},"cycles, namespace imports and co-change show static limits without claiming runtime defects":{"intent":"edge","note":"Asserts caveat wording: cycles include type-only edges and do not establish a runtime defect, and co-change is a correlation. Asserts that the text 'cannot be understood' is absent. A namespace import counts as a user of 'run'."},"zero-hit gaps use measured evidence and historical navigation clears their cached status":{"intent":"regression","note":"In this repair suite, only the measured zero-hit file is a gap and the unknown-coverage file is not. After a move to a historical snapshot, the gaps are empty and the cached blast size shows 0 gaps, so the cached result is not stale."},"reexports are not local missing bodies and explicit type namespaces never imply value imports":{"intent":"edge","note":"Re-exports create no declarations. The exports are pending and wrapped. A type-only namespace import or default import adds no value uses."},"invalid and zero-instrumented viewer counts stay unknown without NaN colours or priorities":{"intent":"edge","note":"Counts of 0/0, negative or string type give null coverage and null tiles. The checks and priority report 3 unknown, the priority output has no NaN or undefined, and the legend shows unknown."},"class overload signatures share only implementations in the same static or instance scope":{"intent":"edge","note":"The constructor and the instance and static overloads with bodies are not planned. An abstract method is planned even when a static method with the same name exists. Members of an ambient class are all planned."},"class declaration rows and progress do not mark implemented overloads as missing":{"intent":"regression","note":"In this repair suite, progress counts only 1 planned item. The constructor panel has no 'declaration only' text, and the abstract 'pending' panel has it."},"offline dependency review switches graphs, opens shared-type evidence and copies or downloads the same JSON report":{"intent":"happy","note":"The root panel shows the shared type with its location and kind, and the value view shows 0 dependencies. The copied JSON and the downloaded JSON both equal inspectionReport(DATA), and the file name ends in .json."},"file inspection sorts declarations by size and shows bound dependency and hook metrics in its JSON report":{"intent":"happy","note":"After a sort by size, the first row is Panel with 1 dependency and 1 hook call. The report for the file lists src/b.ts as the internal dependency of Panel, and the panel shows the copy action."},"export usage groups types, values, reexports and test-only consumers and filters primitive paths":{"intent":"happy","note":"The export usage panel shows the Types, Values, Reexports and Test-only groups. When the vendor filter is on, the UI primitive export disappears and the 'No external importer found' text is shown."}}},"test/security.test.mjs":{"status":"current","cases":{"the chat server answers only requests addressed to its own host and origin":{"intent":"unhappy","note":"The token is 48 hex characters, and a localhost host is accepted. A foreign Host header gets 403 without the token, and foreign or HTTPS origins get 403. The server's own origin passes the checks and then gets 400 for an empty message."},"the chat starts Claude Code without the repository settings, MCP servers or other tools":{"intent":"happy","note":"Uses a fake claude binary and is POSIX only. Asserts that the launch arguments include --setting-sources user and --strict-mcp-config, and that the tools are limited to Read, Grep and Glob."},"chat snapshots live in a private folder that this user owns":{"intent":"unhappy","note":"The snapshot is created in a mode-700 folder with the correct file content, and an older world-writable folder is not touched. A world-writable root, a symlinked repository folder or a symlinked root is refused with a 'not a private folder' error, and the home files stay unchanged."}}},"test/source-analysis.test.mjs":{"status":"current","cases":{"dependency evidence distinguishes types, values, side effects and dynamic imports at their source lines":{"intent":"happy","note":"Asserts the edge target, kind, mode and line for type, value, side-effect, re-export, dynamic, require and unresolved dynamic imports. Also checks that the type names and value names of a mixed import are split."},"declaration metrics count bound import references and React hook call sites without shadowed names":{"intent":"happy","note":"Panel has 6 lines, src/b.ts as a dependency, and hooks useState (an aliased import) and useEffect on their lines. A function whose parameter shadows 'run' gets no dependency."},"export evidence distinguishes types, aliases, reexports and local references":{"intent":"happy","note":"Asserts the name, category and local name for type, value, alias, type re-export and default exports. Also checks that 'local' has 1 local reference."},"type queries stay type-only and dynamic imports retain evidence with options or unknown targets":{"intent":"edge","note":"import('./b').B in a type is a type-query edge. A dynamic import with options keeps its target, and a variable specifier gives a null target on its line."},"custom hook aliases and React namespace calls are counted as hook candidates but shadowed calls are not":{"intent":"edge","note":"An aliased custom hook and React.useEffect are counted as useThing and useEffect. A parameter that shadows the alias gives no hook calls."},"each declaration owns its metrics even when variables and methods share a source line":{"intent":"edge","note":"When declarations share a line, the second variable and the second class method get no dependency on 'run'."},"overloads have one export record and shorthand object properties count as local references":{"intent":"edge","note":"Three overload signatures give one export record on the implementation line (3). Shorthand {local} counts as 1 local reference."}}},"test/test-quality.test.mjs":{"status":"current","cases":{"the scanner finds cases and statuses, including framework aliases, parameterized definitions and functions passed by name":{"intent":"happy","note":"Scans a Vitest file with aliased imports, a namespace import of node:test, skip, only, todo, each, a skip option and a callback passed by name. It asserts the exact name, status, each flag and assertion count for every case, that the framework is 'vitest', and that only 'focused' is in the focused list."},"failure assertions cover thrown, rejected and returned errors, but checks that an error is absent are not failure assertions":{"intent":"edge","note":"Asserts the failure kinds for each case: throws, rejects, status, ok-false, error-value and error-message. It also checks near-miss inputs that must give no kind: toBeUndefined, toHaveCount(0), not.toThrow, status 200, the word 'error' in a fixture argument, and a weak regex match."},"a verify command quotes a repository path that holds shell syntax, and also gives the arguments without a shell":{"intent":"edge","note":"Uses an adversarial file path that contains a quote and $(touch pwned). It asserts the exact single-quoted scan and mutate commands and the argument array that needs no shell. It then runs the command through sh and checks that the shell gets the path as one literal argument and that no 'pwned' file is created."},"assertion strength: exact values, parts of values, snapshots, mock calls, weak checks and tautologies":{"intent":"happy","note":"Asserts the strength given to each check form. toBe, deepEqual, toThrow('bad') and ok(a === b) are exact. toMatchObject, expect.any and bare toThrow are partial. Snapshots are snapshot and toHaveBeenCalledWith is call. toBeDefined, a truthy ok and a negated toBe are weak. expect(1).toBe(1) is a tautology."},"each function gets the strictest check tied to it, and weak, snapshot-only, mock-only and tautology tests are reported":{"intent":"happy","note":"Asserts the result check for each unit: sum is exact, make is snapshot (it beats weak), notify is call and setup is none. It checks that each observation (weakChecks, noResultCheck, tautology, snapshotOnly, callOnly) has a count of 1, and it checks the exact detail text of the resultChecks statistic."},"a conditional assertion is reported, because a false condition skips the check":{"intent":"happy","note":"A case that runs expect inside an if statement gets the smell list ['conditional-assertion']. The conditionalAssertion observation has a count of 1."},"smells: fixed waits, but not time limits, and swallowed errors only around assertions in the case itself":{"intent":"edge","note":"Checks how smell detection handles near-misses. A setTimeout sleep is a fixed-wait, but a setTimeout inside a Promise.race time limit is not. A try/catch around an expect is a swallowed-error, but a catch inside a cleanup helper is not. A case with no assertions has no smells and an assertion count of 0."},"failure exits record throws, catches, error values, error statuses and the line or branch that coverage can measure":{"intent":"happy","note":"Asserts the exact failureExits for two functions. A throw on the same line as its if gets branch 0. A throw on its own line has only the line. A catch has probe 8. The route function records only a 'status' exit at line 11 with branch 0."},"parked tests stay inventory and conditional tests stay candidates; neither satisfies failure evidence (TQ-01)":{"intent":"edge","note":"Checks status boundaries. A test.skip case leaves parse 'unreached' with 0 running and 1 skipped. A test.skipIf case gives 'no-failure-assertion' with 1 candidate. A test.only case still counts as 'direct', and the first observation is 'focused'. The source tags this TQ-01 but does not say that it was a bug."},"a failure assertion counts only for the function it names, its variable, its caught error or its helper arguments (TQ-02)":{"intent":"edge","note":"Checks which function gets credit for a failure assertion. A throw on other() does not credit parse, and a helper that is never called gives no credit. A result variable, a caught error and an argument passed to a helper do credit parse. Error text on the screen that is not tied to a call credits nothing. The source tags this TQ-02 but does not say that it was a bug."},"follow-up review: bare helper references, untied failures, unreachable checks and skipped suites never close a gap (TQ-R2-01 to 04)":{"intent":"edge","note":"A bare reference to a helper gives no credit and 0 candidates, but a helper passed to forEach is 'direct'. A JSON.parse throw is not tied to parse and stays a candidate. A check under if (false) is not counted. A check under if (CI) stays a candidate. A .only case inside describe.skip is 'unreached', but it is still marked as focused and still gets the focus warning."},"follow-up review: the real Node fixture that passes without reaching the failure path gets no direct failure assertion":{"intent":"unhappy","note":"Runs a real node --test fixture and asserts exit status 0 and 'pass 3'. This shows that the tests pass without reaching the failure path. It then asserts that the analysis gives parse a failureDirect count of 0 and a status that is not 'direct', so the analysis gives no false credit."},"a test name alone never closes a gap (TQ-03)":{"intent":"unhappy","note":"A case named 'handles invalid input' that checks only the success path leaves parse as 'no-failure-assertion' with 1 candidate. The case evidence is 'name', and a nameOnly observation     <li><b>Fan-in</b> (↙ on a box, "used by") counts the files that import this one. High fan-in means many files depend on it, so a change here can break them.</li>
    <li><b>Fan-out</b> (↗ on a box, "uses") counts the files it imports. High fan-out means it depends on many things, so changes elsewhere can break it.</li>
    <li><b>Four roles</b> come from the two counts. A <b>hub</b> is high on both: central, worth understanding first and risky to change; hubs have an orange-red border on the map. A <b>foundation</b> is used a lot but uses little: a stable building block. A <b>top-level</b> file uses a lot but little uses it: it assembles things. A <b>leaf</b> has few connections.</li>
    <li><b>The chart</b> (project overview, Coupling tab) places every file: across is how many files use it, up is how many it uses. The coloured corners are the roles. Dots far to the right are the most depended on; dots high up depend on the most. Click a dot to open the file.</li>
    <li><b>"High"</b> means the top 15% of this project, and at least 4. A file nothing imports sits at the far left; that can mean it is an entry point, or that it is not connected yet.</li>
    <li><b>On the map</b>, every file that is not a leaf has a thick coloured border: orange-red = hub, green = foundation, violet = top level. No border means a leaf. Wide boxes also show the role as a tag and <code>↙ used by ↗ uses</code>.</li>
    <li>Choose <b>Colour → by coupling role</b> to colour the whole map by these roles.</li>
  </ul>
  <h3>Backbone graph</h3>
  <ul class="help">
    <li>The default view of the project overview. It shows only the files that are not leaves, in three layers: <b>top level</b> files at the top (they assemble things), <b>hubs</b> in the middle, <b>foundations</b> at the bottom (relied on by many). Bigger dots have more connections.</li>
    <li>Lines are imports. Hover a dot, or any box on the map, to light up its links: <b>orange</b> lines go to what it uses, <b>violet</b> lines come from what uses it. Hovering a dot also outlines that file on the map.</li>
    <li>Hovering a module or folder on the map lights up all of its backbone files at once. A module's own panel shows the same graph with its files highlighted.</li>

  <h3>Blast radius</h3>
  <ul class="help">
    <li>The <b>Blast radius</b> tab answers "if I change this, what can break, and which tests would tell me?" It follows imports backwards: files that import the changed file are <b>1 step</b> away (direct), files that import those are 2 steps away, and so on.</li>
    <li><b>Selected file</b> shows the blast radius of the selected file, or of the box under the pointer while you hover the map (a folder or module counts all its files as changed); move off the map to go back. With a module or the whole project selected, it ranks the files whose changes affect the most others.</li>
    <li><b>A change</b> shows it for recent work: the last commit, the last few commits, everything since the main branch, or uncommitted changes (with <code>--worktree</code>).</li>
    <li>On the map, changed files are hatched dark brown and affected boxes are tinted orange: the darker, the closer. Each square in the panel is one file; click it to open the file.</li>
    <li><b>Tests to run</b> are the test files that import a changed file, directly or through other files. <b>Copy paths</b> copies them for your test command.</li>
    <li>A <b>gap</b> (red outline) is a changed or affected file that no test reaches at all, so it could break unnoticed. "Reaches" means importing it through some chain of files; it does not prove a test runs that code.</li>

  <h3>Blast radius of the whole project</h3>
  <ul class="help">
    <li><b>Colour → by blast radius</b> colours every file by how many files a change to it can affect (darker = more). A dashed red frame means no test reaches the file; a dashed amber frame means no test imports it directly, so it is only tested through other files.</li>
    <li><b>Test priority</b> (project overview) answers "should this file have its own test?". Across is blast radius, up is lines of code. Files in the shaded corner have real impact and real logic but no test of their own: those are worth a direct test. Constants affect many files but hold little logic, so indirect tests are usually enough.</li>
    <li><b>Ripple</b> (project overview) shows, for a change to a whole module (row), the share of each other module's files (column) that can be affected. It shows which parts of the code are contained and which ripple everywhere.</li>
  </ul>
  <h3>Tests: test quality</h3>
  <ul class="help">
    <li>The <b>Tests</b> tab answers "which failures do our tests not check?" For the whole project, a module, a folder or a file it shows <b>statistics</b>, <b>what we see</b> with evidence, <b>next steps</b> and the <b>limits</b> of the scan. A file or a function shows each function's failure exits and the tests that reach it.</li>
    <li>It finds functions whose failure exits have no failure test. It cannot judge whether an existing test checks the correct behavior.</li>
    <li>Each line names its evidence: <b>inventory</b> (counted in the test files), <b>inferred link</b> (from references and pattern-matched assertions), <b>pattern</b> (a source pattern), <b>measured</b> (coverage), <b>Git</b> or <b>model</b> (optional labels). Only inventory and measured lines are counts; check the others in the code.</li>
    <li><b>Copy summary</b> copies the summary as Markdown for a ticket or an agent. <b>Download JSON</b> saves the same report as <code>code-map inspect</code>, scoped to the selection.</li>
    <li><b>The test lens</b> turns on with the Tests tab, unless you chose another colour; leaving the tab restores yours. Each box shows the evidence category of its weakest function: solid colours are measured by a mutation run, hatched colours are inferred by the scan. Badges count gaps and changes that no test detected, a function shows one dot for each failure exit, and an open function marks each failure exit line in its code.</li>
    <li><b>Result check</b> rates the strictest assertion tied to a function: exact, partial, snapshot, mock call, weak (exists, a type) or none. It is a static rating; a strict assertion can still check the wrong value.</li>
    <li><b>Mutation check</b>: run <code>code-map mutate --file &lt;source file&gt;</code>. It removes each failure exit and replaces return values in a private copy, runs the tests that reach the function, and records which changes no test detected. The tab shows "removal detected" or "removal not detected" next to each exit. A surviving change can be equivalent. Stryker reports are read too.</li>
    <li>Optional model labels: run <code>code-map labels</code> for a work list, let a model write each case's intent into the labels file, then run <code>code-map labels stamp</code>.</li>
  </ul>
  <h3>Checks: code health</h3>
  <ul class="help">
    <li>The project overview ends with <b>Checks</b>: static signals and report evidence in one list. Each line opens the file.</li>
    <li><b>Rule breaks</b>: imports in a direction your project forbids. Add rules to <code>.code-map.json</code>, for example <code>"rules": ["verify -> engine", "core -> *"]</code> (a module or folder name on each side; <code>*</code> means any other module). Breaks also get a red frame in the Ripple table and a red note in the file's Details.</li>
    <li><b>Import cycles</b>: switch between all dependencies and value dependencies (including side effects and literal dynamic imports). Each cycle lists its source-line evidence. Neither graph proves runtime execution or initialization failure.</li>
    <li><b>Shared types</b>: a file imports a child as a value, while the child imports a type from that file. The declaration and both imports are linked. This is a candidate for extraction, not a verdict.</li>
    <li><b>Analysis JSON</b>: copy or download the shared report from the project or file Details. Reports omit source bodies and full history, retain evidence lines, and match the CLI inspect output. Historical slider positions cannot export current-source analysis.</li>
    <li><b>Declarations with possible value importers</b>: declarations with no matching body here and possible value importers. Explicit type-only names are excluded. An external runtime provider may exist; imports are not proven calls.</li>
    <li><b>Export usage</b>: values, types, reexports and test-only consumers with no source importer. Local reference counts and entry-point candidates remain visible. Hide primitive/vendor paths to reduce noise; the filter uses folder names, not package provenance.</li>
    <li><b>Hotspots</b>: files that change often (from Git) and are large: where defects tend to appear. <b>Colour → by hotspot</b> shows them on the map.</li>
    <li><b>Changes together with</b> (in a file's Details): files changed in the same commits. "No import link" marks a correlation to investigate; it does not prove a hidden dependency. In the Blast radius tab they get a dashed outline on the map.</li>
    <li><b>Used by</b> (in an exported function's or type's Details): every file that imports that name (including types; namespaces are possible references), outlined violet on the map. A quick way to see who relies on a concept.</li>
    <li><b>Coverage</b>: when your tests wrote an lcov report (for example <code>coverage/lcov.info</code>, or set <code>"coverage"</code> in <code>.code-map.json</code>), the map shows recorded instrumented line hits for the working-tree view: <b>Colour → by test coverage</b>, a card in Details, zero-hit gaps in Blast radius, and "instrumented lines without hits" in Test priority.</li>
  </ul>
  <h3>What the words mean</h3>
  <p class="kind">Plain definitions of every term on this map. Each says how it is worked out and why it matters.</p>
  <dl class="gloss">
    <dt>Import</dt><dd>One file using code from another file (<code>import … from './other'</code>). Almost everything on this map is worked out from imports.</dd>
    <dt>Fan-in (↙, "used by")</dt><dd>How many files import this one. High fan-in: many files depend on it, so changing it is risky.</dd>
    <dt>Fan-out (↗, "uses")</dt><dd>How many files this one imports. High fan-out: it depends on many things, so changes elsewhere can break it.</dd>
    <dt>Hub · foundation · top level · leaf</dt><dd>Roles from fan-in and fan-out. <b>Hub</b>: high on both, central. <b>Foundation</b>: used a lot, uses little, a building block. <b>Top level</b>: uses a lot, used little, it assembles things. <b>Leaf</b>: few connections. "High" means the top 15% of this project, and at least 4.</dd>
    <dt>Backbone</dt><dd>The graph of only the files that are not leaves: the skeleton of the code.</dd>
    <dt>Blast radius</dt><dd>Every file that could break if a file changes: the files that import it, the files that import those, and so on. Each hop is one <b>step</b>; files 1 step away import it <b>directly</b>.</dd>
    <dt>Tests to run</dt><dd>Test files that import a changed file, directly or through other files. Candidate tests to run; imports alone do not prove assertions cover the change.</dd>
    <dt>A test reaches a file</dt><dd>A test imports it through some chain of files. A good guide, but not proof that the test runs its code. LCOV records instrumented line hits; it does not prove assertions or behaviour.</dd>
    <dt>Direct test</dt><dd>A test file that imports this file itself, rather than reaching it through other files.</dd>
    <dt>Gap</dt><dd>A changed or affected file that no test reaches (or, with a coverage report, whose valid report entry has zero hits). This is a signal to investigate, not proof about assertions.</dd>
    <dt>Test priority</dt><dd>Where a direct test pays off: files that affect many others and hold real logic (many lines, or many lines that never ran) but have no test of their own.</dd>
    <dt>Failure exit</dt><dd>A place where a function reports a failure: <code>throw</code>, a rejected promise, a <code>catch</code> block, a returned error such as <code>{ error }</code> or <code>{ ok: false }</code>, a 4xx or 5xx response, or a nonzero exit. Found by pattern.</dd>
    <dt>Failure assertion</dt><dd>An assertion that checks a failure: <code>toThrow</code>, <code>rejects</code>, <code>assert.throws</code>, an error value that exists, a failed status or <code>ok: false</code>. It counts for a function only when it names that function, or a variable or caught error that comes from it. A test name or a model label never counts as one.</dd>
    <dt>No failure assertion found</dt><dd>Tests reach the function, but none has a failure assertion that the scan can tie to it. A custom assertion helper can hide one, so this means unknown, not proof that the tests check only success.</dd>
    <dt>Through callers</dt><dd>A test has a failure assertion for a function that calls this one, up to 3 calls away. The route shows the calls. Weaker evidence than a direct failure assertion.</dd>
    <dt>Test layer</dt><dd>Unit, integration, e2e, API, live and similar, from folder and file names first, then estimated from imports and side effects such as processes, the network, a database or a browser.</dd>
    <dt>Ripple</dt><dd>For a change to a whole module, the share of each other module's files that could be affected. Shows which parts are self-contained and which touch everything.</dd>
    <dt>Coverage</dt><dd>The share of instrumented lines with hits in working-folder LCOV. Missing, invalid or zero-instrumented entries are unknown. No revision or test-command binding is available; hits do not prove assertions or behaviour. Coverage is unknown for commit maps and historical snapshots.</dd>
    <dt>Hotspot</dt><dd>A file that is both <b>changed often</b> and <b>large</b>. Worked out as: number of commits that changed the file × its lines of code, compared with the rest of the project. Why it matters: code that keeps changing and has a lot in it is where mistakes most often slip in, and where a clean-up or extra tests pay back most. A large file that never changes is not a hotspot; neither is a tiny file that changes all the time.</dd>
    <dt>Changes together (change coupling)</dt><dd>Files that were changed in the same commits again and again (at least 3 times, in at least 30% of one file's commits). Commits touching more than 25 files are ignored. <b>No import link</b> means neither file imports the other, a correlation that does not prove a hidden dependency.</dd>
    <dt>Import cycle</dt><dd>Files that import each other round in a loop (A imports B, B imports C, C imports A). Includes type-only edges and does not establish a runtime initialization cycle.</dd>
    <dt>Rule break</dt><dd>An import in a direction your project forbids, from the <code>"rules"</code> in <code>.code-map.json</code> (for example <code>"verify -> engine"</code>: files in verify must not import files in engine).</dd>
    <dt>Export</dt><dd>A function, type or value a file offers to other files. <b>Export usage</b> separates values, types, reexports and test-only consumers. No external importer found is not proof of dead code.</dd>
    <dt>Declaration only (provider unverified)</dt><dd>A declaration with no matching implementation in this file. Overload signatures with a body are implemented. Ambient declarations may have an external provider; the parser cannot verify it. <b>Declarations with possible value importers</b> are the ones already imported.</dd>
    <dt>Used by (concept trace)</dt><dd>For one exported function or type: every file that imports that name, including type-only references; namespace imports are possible use of every name, not proven calls.</dd>
  </dl>
  <h3>Keeping it current</h3>
  <p><code>code-map</code> (or <code>npm run map</code>) regenerates this page from Git. The structure, sizes, links and history are always computed; only the plain-English descriptions are written by hand in the project's descriptions file. The map marks files with no description and descriptions whose file’s exports changed since.</p>

  const file = nodes.get(path); if (!file) return;
  let target = file;
  if (line) for (let search = true; search;) {
    search = false;
    for (const c of target.children) if (c.decl && c.decl.start <= line && line <= c.decl.end) { target = c; search = true; break; }
  }
  travel(target);
}

/* ---------- code rendering ---------- */
const KEYWORDS = new Set('import export from const let var function return if else for while of in new class extends implements interface type async await try catch finally throw typeof instanceof void null undefined true false this super readonly declare as satisfies default switch case break continue keyof static private public protected'.split(' '));
function code(source, from, focus, to) {
  const all = source.split('\n');
  const last = to ? Math.min(all.length, to) : all.length;
  let inBlock = false, out = '';
  for (let i = 0; i < last; i++) {
    const res = highlight(all[i], inBlock); inBlock = res.inBlock;
    if (i + 1 < from) continue;
    const isFocus = focus && i + 1 >= focus[0] && i + 1 <= focus[1];
    out += `<span class="line${isFocus ? ' focus' : ''}"><span class="ln">${i + 1}</span>${res.html}</span>`;
  }
  return `<pre class="code">${out}</pre>`;
}
function highlight(line, inBlock) {
  let html = '', i = 0;
  const push = (cls, text) => { html += cls ? `<span class="${cls}">${esc(text)}</span>` : esc(text); };
  if (inBlock) { const end = line.indexOf('*/'); if (end < 0) { push('t-c', line); return { html, inBlock: true }; } push('t-c', line.slice(0, end + 2)); i = end + 2; }
  while (i < line.length) {
    const rest = line.slice(i);
    if (rest.startsWith('//')) { push('t-c', rest); break; }
    if (rest.startsWith('/*')) { const end = rest.indexOf('*/', 2); if (end < 0) { push('t-c', rest); return { html, inBlock: true }; } push('t-c', rest.slice(0, end + 2)); i += end + 2; continue; }
    const q = rest[0];
    if (q === '"' || q === "'" || q === '`') { let j = 1; while (j < rest.length && rest[j] !== q) j += rest[j] === '\\' ? 2 : 1; push('t-s', rest.slice(0, j + 1)); i += j + 1; continue; }
    const word = /^[A-Za-z_$][\w$]*/.exec(rest);
    if (word) { push(KEYWORDS.has(word[0]) ? 't-k' : '', word[0]); i += word[0].length; continue; }
    const num = /^\d[\d_.]*/.exec(rest);
    if (num) { push('t-n', num[0]); i += num[0].length; continue; }
    push('', rest[0]); i += 1;
  }
  return { html, inBlock: false };
}

/* ---------- search ---------- */
const searchEl = document.getElementById('search'), resultsEl = document.getElementById('results');
const index = [...nodes.values()].filter((n) => n.kind === 'file' && n.file || n.kind === 'decl');
let hits = [], active = 0;
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  hits = q ? index.filter((n) => n.name.toLowerCase().includes(q) || (n.kind === 'file' && n.file.summary.toLowerCase().includes(q)))
    .sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) || (a.kind === 'file' ? 0 : 1) - (b.kind === 'file' ? 0 : 1)).slice(0, 14) : [];
  active = 0; drawHits();
});
function drawHits() {
  resultsEl.style.display = hits.length ? 'block' : 'none';
  resultsEl.innerHTML = hits.map((n, i) => `<button data-i="${i}" class="${i === active ? 'active' : ''}"><b class="mono">${esc(n.name)}</b> <span class="chip">${n.kind === 'file' ? 'file' : n.decl.kind}</span><small>${esc(n.kind === 'file' ? n.id : fileNodeOf(n).id)}</small></button>`).join('');
}
function pick(n) { hits = []; drawHits(); searchEl.value = ''; searchEl.blur(); setTab('details'); state.highlight = null; travel(n); }
resultsEl.addEventListener('mousedown', (e) => { const b = e.target.closest('button'); if (b) { e.preventDefault(); pick(hits[Number(b.dataset.i)]); } });
searchEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { active = Math.min(hits.length - 1, active + 1); drawHits(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { active = Math.max(0, active - 1); drawHits(); e.preventDefault(); }
  if (e.key === 'Enter' && hits[active]) pick(hits[active]);
});
searchEl.addEventListener('blur', () => setTimeout(() => { resultsEl.style.display = 'none'; }, 120));

/* ---------- helpers & start ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n) { return Number(n).toLocaleString('en-US'); }
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function day(iso) { return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' }); }
// The map measures its own height, so the rows around it (crumbs, legend, timeline) must be filled in first.
function renderAll() { renderCrumbs(); renderLegend(); renderTimeline(); renderMap(); renderPanel(); }

document.getElementById('title').textContent = `${DATA.project} code map`;
document.title = `${DATA.project} · code map`;
document.getElementById('meta').textContent = `${DATA.ref} · ${DATA.sha.slice(0, 7)} · ${fmt(DATA.files.reduce((s, f) => s + f.lines, 0))} lines`;
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('code-map-theme', document.documentElement.dataset.theme); } catch { /* storage unavailable */ }
});
try { const t = localStorage.getItem('code-map-theme'); if (t) document.documentElement.dataset.theme = t; } catch { /* storage unavailable */ }
const start = nodes.get(decodeURIComponent(location.hash.slice(1)));
if (start) { state.selected = start; state.focus = start.kind === 'decl' || visibleChildren(start).length ? start : start.parent; }
/* ---------- resizable side panel ---------- */
const PANEL_DEFAULT = 400;
function setPanelWidth(width) {
  const clamped = Math.round(Math.max(280, Math.min(width, innerWidth * 0.7)));
  document.documentElement.style.setProperty('--panel-width', clamped + 'px');
  return clamped;
}
try { const saved = Number(localStorage.getItem('code-map-panel-width')); if (saved) setPanelWidth(saved); } catch { /* storage unavailable */ }
(() => {
  const handle = document.getElementById('resizer');
  let frame = 0, width = 0;
  handle.addEventListener('pointerdown', (e) => {
    handle.setPointerCapture(e.pointerId); handle.classList.add('dragging'); document.body.classList.add('resizing');
    tileEls.forEach((el) => { el.style.transitionDuration = '0s'; });
  });
  handle.addEventListener('pointermove', (e) => {
    if (!handle.classList.contains('dragging')) return;
    width = setPanelWidth(innerWidth - e.clientX);
    cancelAnimationFrame(frame); frame = requestAnimationFrame(renderMap);
  });
  const finish = () => {
    if (!handle.classList.contains('dragging')) return;
    handle.classList.remove('dragging'); document.body.classList.remove('resizing');
    tileEls.forEach((el) => { el.style.transitionDuration = ''; });
    try { if (width) localStorage.setItem('code-map-panel-width', String(width)); } catch { /* storage unavailable */ }
    renderMap();
  };
  handle.addEventListener('pointerup', finish); handle.addEventListener('pointercancel', finish);
  handle.addEventListener('dblclick', () => {
    setPanelWidth(PANEL_DEFAULT);
    try { localStorage.removeItem('code-map-panel-width'); } catch { /* storage unavailable */ }
    renderMap();
  });
})();
/* Instant tooltips for dots and connection boxes in the panel (the browser's own title tooltip waits seconds). */
panel.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) return;
  tip.innerHTML = `<b>${esc(t.dataset.tip)}</b><div class="muted">${esc(t.dataset.tip2 || '')}</div>`;
  tip.style.display = 'block';
});
panel.addEventListener('mousemove', (e) => {
  if (tip.style.display !== 'block' || !e.target.closest('[data-tip]')) return;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
});
panel.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) hideTip(); });
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderMap, 120); });
renderAll();
</script>
</body>
</html>
