21T23:48:56-04:00","source":"// The default complete workflow: verify, enrich, mutate, then let the caller build the final map.\nimport { createHash } from 'node:crypto';\nimport { existsSync, readFileSync, readdirSync } from 'node:fs';\nimport { relative, resolve } from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport { collect, mapData, writePage } from './build.mjs';\nimport { enrich } from './enrich.mjs';\nimport { mutate, verifyTests } from './mutation-run.mjs';\nimport { fileHash } from './mutation.mjs';\n\nconst record = (value) => typeof value === 'object' && value !== null && !Array.isArray(value);\n\nfunction fingerprint(repository, facts, config, options) {\n  const artifacts = new Set([options.out ?? config.out, options.descriptions ?? config.descriptions,\n    options.labels ?? config.testLabels, options.mutation ?? config.mutation, config.coverage ?? 'coverage/lcov.info'].map(path => relative(repository, resolve(repository, path))));\n  const hash = createHash('sha256');\n  const add = (path, value) => hash.update(JSON.stringify([path, value]));\n  add('runtime', [process.version, process.platform, process.arch]);\n  add('selection', [options.worktree, config, options.file, options.function, options['max-mutants'], options.timeout, options['test-command']]);\n  // Include fixtures, manifests, lockfiles and configuration, not just the files drawn on the map.\n  const explicit = new Set(config.executionInputs ?? []);\n  const documentation = /^(?:[^/]+\\.md|docs\\/.*\\.md)$/i;\n  const paths = [...new Set(facts.reader.list())].filter(path => !artifacts.has(path) && (!documentation.test(path) || explicit.has(path))).sort();\n  for (const [path, text] of facts.reader.read(paths)) add(path, text);\n  const tool = fileURLToPath(new URL('../', import.meta.url));\n  for (const directory of ['bin', 'lib']) for (const name of readdirSync(resolve(tool, directory)).sort()) {\n    if (/\\.(mjs|html)$/.test(name)) add(`tool:${directory}/${name}`, readFileSync(resolve(tool, directory, name), 'utf8'));\n  }\n  add('tool:package-lock.json', readFileSync(resolve(tool, 'package-lock.json'), 'utf8'));\n  return hash.digest('hex');\n}\n\nfunction cachedReport(path, key, coveragePath) {\n  if (!existsSync(path)) return null;\n  let report;\n  try { report = JSON.parse(readFileSync(path, 'utf8')); } catch { return null; }\n  if (!record(report) || report.tool !== 'code-map mutate' || !record(report.files) || !Array.isArray(report.units)\n    || !record(report.workflow) || report.workflow.fingerprint !== key || report.workflow.complete !== true\n    || !Array.isArray(report.workflow.tests) || !Array.isArray(report.workflow.skippedTests)) return null;\n  if (typeof report.workflow.coverageHash === 'string' && (!existsSync(coveragePath) || fileHash(readFileSync(coveragePath, 'utf8')) !== report.workflow.coverageHash)) return null;\n  return report;\n}\n\n/** No mutation budget by default: every supported mutation candidate is attempted on the first complete run. */\nexport async function fullRun(repository, config, options, { signal, log = () => {} } = {}) {\n  const facts = collect(repository, config, options);\n  const key = fingerprint(repository, facts, config, options);\n  const out = resolve(repository, options.mutation ?? config.mutation);\n  const coveragePath = resolve(repository, config.coverage ?? 'coverage/lcov.info');\n  const cached = !options.force && cachedReport(out, key, coveragePath);\n  let report;\n  if (cached) { log('Code, tests and settings unchanged; reusing test and mutation results.'); report = cached; }\n  else {\n    const data = mapData(repository, config, facts, 2, options.worktree);\n    const execution = { repository, data, testCommand: options['test-command'] ?? config.mutationTestCommand,\n      timeoutMs: options.timeout ? Number(options.timeout) * 1000 : undefined, log };\n    const verification = verifyTests(execution);\n    if (verification.coverage !== null) writePage(coveragePath, verification.coverage);\n    await enrich(facts, { signal, log });\n    signal?.throwIfAborted();\n    const files = options.file ?? facts.files.map(file => file.path);\n    if (options.file?.some(path => !facts.files.some(file => file.path === path))) throw new Error('A selected mutation file is not a mapped source.');\n    const eligible = data.analysis.tests.units.some(unit => files.includes(unit.path)\n      && (!options.function?.length || options.function.includes(unit.name)) && (unit.exits.length || unit.direct.length));\n    report = eligible ? mutate({ ...execution, files, functionNames: options.function ?? [],\n      maxMutants: options['max-mutants'] === undefined ? Number.MAX_SAFE_INTEGER : Number(options['max-mutants']) })\n      : { schemaVersion: 1, tool: 'code-map mutate', sha: data.sha, ref: data.ref, files: {}, units: [], limits: ['No eligible functions were discovered.'] };\n    if (fingerprint(repository, facts, config, options) !== key) throw new Error('Repository changed during the full run; run again to verify the new snapshot.');\n    const complete = !report.units.some(unit => ['partial', 'baseline-failed'].includes(unit.status) || unit.excluded?.length)\n      && !Object.values(report.files).some(file => file.mutants.some(item => item.status === 'error'));\n    report.workflow = { fingerprint: key, complete, tests: verification.receipts, skippedTests: verification.skipped,\n      coverageHash: verification.coverage === null ? null : fileHash(verification.coverage) };\n    writePage(out, JSON.stringify(report, null, 2) + '\\n');\n    if (!complete) throw new Error('Full run incomplete: see mutation report for partial checks, baseline failures or runner errors.');\n  }\n  if (cached) await enrich(facts, { signal, log });\n  const counts = Object.values(report.files).flatMap(file => file.mutants).reduce((counts, item) => {\n    counts[item.status] = (counts[item.status] ?? 0) + 1; return counts;\n  }, {});\n  const unsupported = report.units.filter(unit => ['no-runner', 'no-tests', 'not-loaded'].includes(unit.status));\n  log(`Mutation results: ${JSON.stringify(counts)}; ${unsupported.length} functions without executable evidence; ${report.workflow.skippedTests.length} unsupported test files.`);\n}\n"},{"path":"lib/git.mjs","lines":71,"header":"Read-only Git access. Nothing here writes to the repository.","summary":"Contains read-only Git helpers: they run git commands, find the repository root, and list and read files from a commit or from the working tree, with one batch cat-file process for all committed files; they also choose the local branch whose source changed most recently, list the branches at a commit, and count the lines in a text.","status":"current","imports":[],"externals":["node:child_process","node:fs","node:path"],"exports":["branchesAt","git","growingBranch","lineCount","repositoryRoot","sourceReader"],"edges":[{"target":null,"specifier":"node:child_process","kind":"value","mode":"static","line":2,"typeNames":[],"valueNames":["execFileSync"]},{"target":null,"specifier":"node:fs","kind":"value","mode":"static","line":3,"typeNames":[],"valueNames":["existsSync","readFileSync"]},{"target":null,"specifier":"node:path","kind":"value","mode":"static","line":4,"typeNames":[],"valueNames":["join"]}],"exportDetails":[{"name":"git","category":"value","localName":"git","typeOnly":false,"line":8,"localReferences":8},{"name":"repositoryRoot","category":"value","localName":"repositoryRoot","typeOnly":false,"line":12,"localReferences":0},{"name":"sourceReader","category":"value","localName":"sourceReader","typeOnly":false,"line":17,"localReferences":0},{"name":"growingBranch","category":"value","localName":"growingBranch","typeOnly":false,"line":54,"localReferences":0},{"name":"branchesAt","category":"value","localName":"branchesAt","typeOnly":false,"line":64,"localReferences":0},{"name":"lineCount","category":"value","localName":"lineCount","typeOnly":false,"line":68,"localReferences":0}],"declarations":[{"name":"maxBuffer","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":6,"end":6,"startOffset":202,"endOffset":239,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"git","kind":"function","exported":true,"planned":false,"children":[],"note":"","start":8,"end":10,"startOffset":241,"endOffset":419,"metrics":{"lines":3,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"repositoryRoot","kind":"function","exported":true,"planned":false,"children":[],"note":"","start":12,"end":14,"startOffset":421,"endOffset":532,"metrics":{"lines":3,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"sourceReader","kind":"function","exported":true,"planned":false,"children":[],"note":"Files of a committed ref, or of the working tree when `ref` is null.","start":17,"end":33,"startOffset":610,"endOffset":1363,"metrics":{"lines":17,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"readBlobs","kind":"function","exported":false,"planned":false,"children":[],"note":"One `git cat-file --batch` process reads every blob; the output is size-prefixed, so bytes are sliced exactly.","start":36,"end":51,"startOffset":1483,"endOffset":2234,"metrics":{"lines":16,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"growingBranch","kind":"function","exported":true,"planned":false,"children":[],"note":"Without --ref: the local branch whose source changed most recently. Commits touching only documents do not count.","start":54,"end":61,"startOffset":2357,"endOffset":2870,"metrics":{"lines":8,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"branchesAt","kind":"function","exported":true,"planned":false,"children":[],"note":"Every local branch at the mapped commit, so a task branch and its parent branch both show.","start":64,"end":66,"startOffset":2970,"endOffset":3141,"metrics":{"lines":3,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"lineCount","kind":"function","exported":true,"planned":false,"children":[],"note":"","start":68,"end":71,"startOffset":3143,"endOffset":3277,"metrics":{"lines":4,"internalDependencies":[],"hookCalls":[],"failureExits":[]}}],"uses":{},"valueUses":{},"tests":[],"created":"2026-10-16T15:07:09-04:00","changed":"2026-10-16T15:07:09-04:00","source":"// Read-only Git access. Nothing here writes to the repository.\nimport { execFileSync } from 'node:child_process';\nimport { existsSync, readFileSync } from 'node:fs';\nimport { join } from 'node:path';\n\nconst maxBuffer = 1024 * 1024 * 1024;\n\nexport function git(directory, args, input) {\n  return execFileSync('git', ['-C', directory, ...args], { encoding: 'utf8', maxBuffer, input, stdio: ['pipe', 'pipe', 'pipe'] });\n}\n\nexport function repositoryRoot(directory) {\n  return git(directory, ['rev-parse', '--show-toplevel']).trim();\n}\n\n/** Files of a committed ref, or of the working tree when `ref` is null. */\nexport function sourceReader(directory, ref) {\n  if (ref === null) {\n    const sha = git(directory, ['rev-parse', 'HEAD']).trim();\n    return {\n      label: 'working tree', sha,\n      list: () => git(directory, ['ls-files', '--cached', '--others', '--exclude-standard']).split('\\n').filter(Boolean)\n        .filter((path) => existsSync(join(directory, path))),\n      read: (paths) => new Map(paths.map((path) => [path, readFileSync(join(directory, path), 'utf8')])),\n    };\n  }\n  const sha = git(directory, ['rev-parse', '--verify', `${ref}^{commit}`]).trim();\n  return {\n    label: ref, sha,\n    list: () => git(directory, ['ls-tree', '-r', '--name-only', sha]).split('\\n').filter(Boolean),\n    read: (paths) => readBlobs(directory, sha, paths),\n  };\n}\n\n/** One `git cat-file --batch` process reads every blob; the output is size-prefixed, so bytes are sliced exactly. */\nfunction readBlobs(directory, sha, paths) {\n  const result = new Map();\n  if (paths.length === 0) return result;\n  const output = execFileSync('git', ['-C', directory, 'cat-file', '--batch'],\n    { input: paths.map((path) => `${sha}:${path}`).join('\\n') + '\\n', maxBuffer });\n  let offset = 0;\n  for (const path of paths) {\n    const headerEnd = output.indexOf(0x0a, offset);\n    const header = output.subarray(offset, headerEnd).toString('utf8').split(' ');\n    if (header[1] !== 'blob') { offset = headerEnd + 1; continue; } // \"missing\" or a submodule entry\n    const size = Number(header[2]);\n    result.set(path, output.subarray(headerEnd + 1, headerEnd + 1 + size).toString('utf8'));\n    offset = headerEnd + 1 + size + 1;\n  }\n  return result;\n}\n\n/** Without --ref: the local branch whose source changed most recently. Commits touching only documents do not count. */\nexport function growingBranch(directory, roots) {\n  const time = (args) => Number(git(directory, ['log', '-1', '--format=%ct', ...args]).trim() || 0);\n  const branches = git(directory, ['for-each-ref', '--format=%(refname:short)', 'refs/heads']).split('\\n').filter(Boolean);\n  if (branches.length === 0) return 'HEAD';\n  const ranked = branches.map((name) => ({ name, source: time([name, '--', ...roots]), any: time([name]) }))\n    .sort((a, b) => b.source - a.source || b.any - a.any);\n  return ranked[0].name;\n}\n\n/** Every local branch at the mapped commit, so a task branch and its parent branch both show. */\nexport function branchesAt(directory, sha) {\n  return git(directory, ['branch', '--format=%(refname:short)', '--points-at', sha]).split('\\n').filter(Boolean).join(', ');\n}\n\nexport function lineCount(text) {\n  if (text.length === 0) return 0;\n  return text.split('\\n').length - Number(text.endsWith('\\n'));\n}\n"},{"path":"lib/history.mjs","lines":49,"header":"Line counts of every source file at each commit of the mapped branch, oldest first.","summary":"Reads the first-parent history of the mapped branch, oldest first, and selects up to a maximum number of commits at equal intervals; it uses git grep to record the line count of each kept source file at each selected commit, and finds when each file first appeared and when its size last changed.","status":"current","imports":["lib/git.mjs"],"externals":[],"exports":["fileTimes","readHistory"],"edges":[{"target":"lib/git.mjs","specifier":"./git.mjs","kind":"value","mode":"static","line":2,"typeNames":[],"valueNames":["git"]}],"exportDetails":[{"name":"readHistory","category":"value","localName":"readHistory","typeOnly":false,"line":5,"localReferences":0},{"name":"fileTimes","category":"value","localName":"fileTimes","typeOnly":false,"line":37,"localReferences":0}],"declarations":[{"name":"readHistory","kind":"function","exported":true,"planned":false,"children":[],"note":"First-parent history keeps the branch's own story; merged side branches appear at their merge.","start":5,"end":12,"startOffset":223,"endOffset":658,"metrics":{"lines":8,"internalDependencies":["lib/git.mjs"],"hookCalls":[],"failureExits":[]}},{"name":"sample","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":14,"end":18,"startOffset":660,"endOffset":869,"metrics":{"lines":5,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"sizesAt","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":20,"end":34,"startOffset":871,"endOffset":1412,"metrics":{"lines":15,"internalDependencies":["lib/git.mjs"],"hookCalls":[],"failureExits":[{"line":26,"kind":"catch","probe":27}]}},{"name":"fileTimes","kind":"function","exported":true,"planned":false,"children":[],"note":"When each file first appeared and when its size last changed.","start":37,"end":49,"startOffset":1483,"endOffset":1934,"metrics":{"lines":13,"internalDependencies":[],"hookCalls":[],"failureExits":[]}}],"uses":{"lib/git.mjs":["git"]},"valueUses":{"lib/git.mjs":["git"]},"tests":[],"created":"2026-10-16T15:07:09-04:00","changed":"2026-10-16T15:07:09-04:00","source":"// Line counts of every source file at each commit of the mapped branch, oldest first.\nimport { git } from './git.mjs';\n\n/** First-parent history keeps the branch's own story; merged side branches appear at their merge. */\nexport function readHistory(directory, sha, roots, keep, maxSnapshots) {\n  const log = git(directory, ['log', '--first-parent', '--reverse', '--format=%H%x09%cI%x09%s', sha])\n    .split('\\n').filter(Boolean);\n  return sample(log, maxSnapshots).map((line) => {\n    const [commit, date, ...subject] = line.split('\\t');\n    return { sha: commit, date, subject: subject.join('\\t'), sizes: sizesAt(directory, commit, roots, keep) };\n  });\n}\n\nfunction sample(items, max) {\n  if (items.length \u003c= max) return [...items];\n  const step = (items.length - 1) / (max - 1);\n  return Array.from({ length: max }, (_, index) => items[Math.round(index * step)]);\n}\n\nfunction sizesAt(directory, commit, roots, keep) {\n  const sizes = new Map();\n  let output;\n  try {\n    const pathspec = roots.includes('.') ? [] : ['--', ...roots];\n    output = git(directory, ['grep', '--count', '-I', '-e', '', commit, ...pathspec]);\n  } catch {\n    return sizes; // git grep exits 1 when the commit has no matching files yet.\n  }\n  for (const line of output.split('\\n')) {\n    const match = /^[0-9a-f]+:(.+):(\\d+)$/.exec(line);\n    if (match && keep(match[1])) sizes.set(match[1], Number(match[2]));\n  }\n  return sizes;\n}\n\n/** When each file first appeared and when its size last changed. */\nexport function fileTimes(snapshots) {\n  const times = new Map();\n  let previous = new Map();\n  for (const snapshot of snapshots) {\n    for (const [path, size] of snapshot.sizes) {\n      const known = times.get(path);\n      if (known === undefined) times.set(path, { created: snapshot.date, changed: snapshot.date });\n      else if (previous.get(path) !== size) known.changed = snapshot.date;\n    }\n    previous = snapshot.sizes;\n  }\n  return times;\n}\n"},{"path":"lib/mutation-report.mjs","lines":38,"header":"Reads a mutation report into the map: one written by `code-map mutate`, or a Stryker report (mutation-testing-report-schema).\nA file's mutants are evidence only while the file is unchanged: the report records its hash, or Stryker its source text.","summary":"Reads a mutation test report from a configured or default path, either one written by `code-map mutate` or a Stryker report: it keeps mutants only for files whose content hash still matches the mapped file and lists the other files as stale; because a person can craft the report file, it limits every value to the expected type and length, and it changes Stryker statuses to the tool's own outcome names; it returns an error entry for invalid JSON and null when there is no report.","status":"current","imports":["lib/mutation.mjs"],"externals":["node:fs","node:path"],"exports":["readMutation"],"edges":[{"target":null,"specifier":"node:fs","kind":"value","mode":"static","line":3,"typeNames":[],"valueNames":["existsSync","readFileSync","statSync"]},{"target":null,"specifier":"node:path","kind":"value","mode":"static","line":4,"typeNames":[],"valueNames":["isAbsolute","relative","resolve"]},{"target":"lib/mutation.mjs","specifier":"./mutation.mjs","kind":"value","mode":"static","line":5,"typeNames":[],"valueNames":["fileHash"]}],"exportDetails":[{"name":"readMutation","category":"value","localName":"readMutation","typeOnly":false,"line":17,"localReferences":0}],"declarations":[{"name":"defaults","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":7,"end":7,"startOffset":418,"endOffset":501,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"outcomes","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":8,"end":8,"startOffset":538,"endOffset":646,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"runStatuses","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":9,"end":9,"startOffset":647,"endOffset":757,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"lineOf","kind":"function","exported":false,"planned":false,"children":[],"note":"The report is a file in the mapped repository, which can be crafted: keep only plain values of the expected shape.","start":11,"end":11,"startOffset":876,"endOffset":956,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"text","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":12,"end":12,"startOffset":957,"endOffset":1125,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"strings","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":13,"end":13,"startOffset":1126,"endOffset":1228,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"strykerStatus","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":14,"end":15,"startOffset":1229,"endOffset":1433,"metrics":{"lines":2,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"readMutation","kind":"function","exported":true,"planned":false,"children":[],"note":"","start":17,"end":38,"startOffset":1435,"endOffset":3686,"metrics":{"lines":22,"internalDependencies":["lib/mutation.mjs"],"hookCalls":[],"failureExits":[{"line":22,"kind":"catch","probe":22}]}}],"uses":{"lib/mutation.mjs":["fileHash"]},"valueUses":{"lib/mutation.mjs":["fileHash"]},"tests":["test/mutation.test.mjs"],"created":"2026-10-21T22:42:29-04:00","changed":"2026-10-21T22:45:55-04:00","source":"// Reads a mutation report into the map: one written by `code-map mutate`, or a Stryker report (mutation-testing-report-schema).\n// A file's mutants are evidence only while the file is unchanged: the report records its hash, or Stryker its source text.\nimport { existsSync, readFileSync, statSync } from 'node:fs';\nimport { isAbsolute, relative, resolve } from 'node:path';\nimport { fileHash } from './mutation.mjs';\n\nconst defaults = ['docs/code-map/mutation.json', 'reports/mutation/mutation.json']; // ours, then Stryker's own default\nconst outcomes = new Set(['detected', 'survived', 'timeout', 'error', 'invalid', 'no-coverage', 'ignored']);\nconst runStatuses = new Set(['checked', 'partial', 'no-tests', 'no-runner', 'baseline-failed', 'not-loaded']);\n// The report is a file in the mapped repository, which can be crafted: keep only plain values of the expected shape.\nconst lineOf = (value) => (Number.isInteger(value) && value > 0 ? value : null);\nconst text = (value, limit = 200) => (typeof value === 'string' ? value.slice(0, limit) : typeof value === 'number' || typeof value === 'boolean' ? String(value) : '');\nconst strings = (value) => (Array.isArray(value) ? value.slice(0, 20).map((item) => text(item)) : []);\nconst strykerStatus = { Killed: 'detected', Timeout: 'timeout', Survived: 'survived', NoCoverage: 'no-coverage', CompileError: 'invalid',\n  RuntimeError: 'error', Ignored: 'ignored', Pending: 'ignored' };\n\nexport function readMutation(repository, config, options, texts) {\n  const chosen = [options.mutation, config.mutation, ...defaults].find((path) => typeof path === 'string' && existsSync(resolve(repository, path)));\n  if (!chosen) return null;\n  const path = resolve(repository, chosen);\n  let parsed;\n  try { parsed = JSON.parse(readFileSync(path, 'utf8')); } catch { return { file: chosen, tool: null, date: null, files: {}, stale: [], units: [], error: 'The report is not valid JSON.' }; }\n  const ours = parsed?.tool === 'code-map mutate', files = {}, stale = [];\n  for (const [name, entry] of Object.entries(parsed?.files ?? {})) {\n    const file = (isAbsolute(name) ? relative(repository, name) : name).replace(/\\\\/g, '/');\n    const hash = ours ? entry.hash : typeof entry.source === 'string' ? fileHash(entry.source) : null;\n    if (!texts.has(file) || !hash || hash !== fileHash(texts.get(file))) { stale.push(file); continue; }\n    files[file] = (Array.isArray(entry.mutants) ? entry.mutants : []).map((mutant) => ours\n      ? { unit: text(mutant.unit, 500), line: lineOf(mutant.line), kind: text(mutant.kind, 40), original: text(mutant.original), replacement: text(mutant.replacement),\n        status: outcomes.has(mutant.status) ? mutant.status : 'ignored', killedBy: strings(mutant.killedBy) }\n      : { unit: null, line: lineOf(mutant.location?.start?.line), kind: text(mutant.mutatorName ?? 'mutant', 40), original: '', replacement: text(mutant.replacement),\n        status: strykerStatus[mutant.status] ?? 'ignored', killedBy: strings(mutant.killedBy) });\n  }\n  const units = !ours || !Array.isArray(parsed.units) ? [] : parsed.units.filter((unit) => typeof unit?.key === 'string' && files[unit.key.slice(0, unit.key.lastIndexOf('#'))])\n    .map((unit) => ({ key: unit.key, status: runStatuses.has(unit.status) ? unit.status : 'checked', tests: strings(unit.tests), canary: outcomes.has(unit.canary) ? unit.canary : null,\n      excluded: Array.isArray(unit.excluded) ? unit.excluded.slice(0, 20).map((item) => ({ path: text(item?.path, 500), failed: strings(item?.failed) })) : [] }));\n  return { file: chosen, tool: ours ? 'code-map mutate' : 'stryker', date: statSync(path).mtime.toISOString(), files, stale: stale.sort(), units };\n}\n"},{"path":"lib/mutation-run.mjs","lines":211,"header":"Runs a targeted mutation check in a private copy of the repository; the repository itself is never changed.\nIt runs the project's own tests, so use it only on code that you trust. Each run keeps its receipt: the command, the\ntests discovered, passed and failed, and the outcome.","summary":"Runs a targeted mutation check in a temporary private copy of the repository, made from a git archive or from the working tree and linked to the project's node_modules: it builds test commands for node:test, Vitest, Jest or a custom command, reads TAP or JSON results, verifies all supported test files (with optional node:test coverage), and for each selected function runs a passing baseline for each test file, a canary that checks the tests load the copied file, and then each mutant within a budget, classifying it as detected, survived, timeout, error or invalid, and returns a report with the commands and results.","status":"current","imports":["lib/git.mjs","lib/mutation.mjs"],"externals":["node:child_process","node:fs","node:os","node:path"],"exports":["commandFor","mutate","outcome","parseResult","testsFor","verifyTests","workspaceFor"],"edges":[{"target":null,"specifier":"node:child_process","kind":"value","mode":"static","line":4,"typeNames":[],"valueNames":["execFileSync","spawnSync"]},{"target":null,"specifier":"node:fs","kind":"value","mode":"static","line":5,"typeNames":[],"valueNames":["copyFileSync","existsSync","mkdirSync","mkdtempSync","readFileSync","readdirSync","rmSync","statSync","symlinkSync","writeFileSync"]},{"target":null,"specifier":"node:os","kind":"value","mode":"static","line":6,"typeNames":[],"valueNames":["tmpdir"]},{"target":null,"specifier":"node:path","kind":"value","mode":"static","line":7,"typeNames":[],"valueNames":["dirname","join"]},{"target":"lib/git.mjs","specifier":"./git.mjs","kind":"value","mode":"static","line":8,"typeNames":[],"valueNames":["git"]},{"target":"lib/mutation.mjs","specifier":"./mutation.mjs","kind":"value","mode":"static","line":9,"typeNames":[],"valueNames":["applyMutant","canary","fileHash","mutantsFor"]}],"exportDetails":[{"name":"workspaceFor","category":"value","localName":"workspaceFor","typeOnly":false,"line":15,"localReferences":2},{"name":"commandFor","category":"value","localName":"commandFor","typeOnly":false,"line":39,"localReferences":5},{"name":"parseResult","category":"value","localName":"parseResult","typeOnly":false,"line":56,"localReferences":1},{"name":"verifyTests","category":"value","localName":"verifyTests","typeOnly":false,"line":88,"localReferences":0},{"name":"outcome","category":"value","localName":"outcome","typeOnly":false,"line":122,"localReferences":1},{"name":"testsFor","category":"value","localName":"testsFor","typeOnly":false,"line":136,"localReferences":1},{"name":"mutate","category":"value","localName":"mutate","typeOnly":false,"line":145,"localReferences":0}],"declarations":[{"name":"skippedLayers","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":11,"end":11,"startOffset":686,"endOffset":757,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"skippedFrameworks","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":12,"end":12,"startOffset":758,"endOffset":819,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"workspaceFor","kind":"function","exported":true,"planned":false,"children":[],"note":"A private copy of the mapped snapshot that shares the project's node_modules folders (read-only use).","start":15,"end":36,"startOffset":930,"endOffset":2139,"metrics":{"lines":22,"internalDependencies":["lib/git.mjs"],"hookCalls":[],"failureExits":[]}},{"name":"commandFor","kind":"function","exported":true,"planned":false,"children":[],"note":"The project's own runner for these test files, with a machine-readable result: TAP for node:test, JSON for Vitest and Jest.","start":39,"end":53,"startOffset":2272,"endOffset":3310,"metrics":{"lines":15,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"parseResult","kind":"function","exported":true,"planned":false,"children":[],"note":"Tests discovered, passed and failed, and files that could not load (an import, compile or discovery failure).","start":56,"end":73,"startOffset":3429,"endOffset":4727,"metrics":{"lines":18,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"run","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":75,"end":85,"startOffset":4729,"endOffset":5651,"metrics":{"lines":11,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"verifyTests","kind":"function","exported":true,"planned":false,"children":[],"note":"Verify every supported discovered test file in a private snapshot before the full workflow mutates anything.","start":88,"end":116,"startOffset":5769,"endOffset":7673,"metrics":{"lines":29,"internalDependencies":[],"hookCalls":[],"failureExits":[{"line":109,"kind":"throw"}]}},{"name":"outcome","kind":"function","exported":true,"planned":false,"children":[],"note":"The outcome of one mutant against the baseline: detected (a discovered test failed), survived (the same tests ran and\npassed), timeout, or error (a file failed to load, fewer tests ran, or the runner failed without a failing test).","start":122,"end":133,"startOffset":7921,"endOffset":8789,"metrics":{"lines":12,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"testsFor","kind":"function","exported":true,"planned":false,"children":[],"note":"Test files that reach a function and that the check can run: not e2e, live or browser tests.","start":136,"end":142,"startOffset":8891,"endOffset":9526,"metrics":{"lines":7,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"mutate","kind":"function","exported":true,"planned":false,"children":[],"note":"Runs the check for the selected functions and returns the report. `log` receives one line per step.","start":145,"end":211,"startOffset":9635,"endOffset":15141,"metrics":{"lines":67,"internalDependencies":["lib/mutation.mjs"],"hookCalls":[],"failureExits":[{"line":147,"kind":"throw","branch":0}]}}],"uses":{"lib/git.mjs":["git"],"lib/mutation.mjs":["applyMutant","canary","fileHash","mutantsFor"]},"valueUses":{"lib/git.mjs":["git"],"lib/mutation.mjs":["applyMutant","canary","fileHash","mutantsFor"]},"tests":["test/mutation.test.mjs"],"created":"2026-10-21T22:42:29-04:00","changed":"2026-10-21T23:46:31-04:00","source":"// Runs a targeted mutation check in a private copy of the repository; the repository itself is never changed.\n// It runs the project's own tests, so use it only on code that you trust. Each run keeps its receipt: the command, the\n// tests discovered, passed and failed, and the outcome.\nimport { execFileSync, spawnSync } from 'node:child_process';\nimport { copyFileSync, existsSync, mkdirSync, mkdtempSync, readFileSync, readdirSync, rmSync, statSync, symlinkSync, writeFileSync } from 'node:fs';\nimport { tmpdir } from 'node:os';\nimport { dirname, join } from 'node:path';\nimport { git } from './git.mjs';\nimport { applyMutant, canary, fileHash, mutantsFor } from './mutation.mjs';\n\nconst skippedLayers = new Set(['e2e', 'live', 'smoke', 'performance']);\nconst skippedFrameworks = new Set(['playwright', 'cypress']);\n\n/** A private copy of the mapped snapshot that shares the project's node_modules folders (read-only use). */\nexport function workspaceFor(repository, sha, worktree) {\n  const folder = mkdtempSync(join(tmpdir(), 'code-map-mutate-'));\n  if (worktree) {\n    for (const path of git(repository, ['ls-files', '--cached', '--others', '--exclude-standard']).split('\\n').filter(Boolean)) {\n      const from = join(repository, path);\n      if (!existsSync(from) || !statSync(from).isFile()) continue;\n      mkdirSync(dirname(join(folder, path)), { recursive: true });\n      copyFileSync(from, join(folder, path));\n    }\n  } else {\n    const archive = join(folder, '.code-map-snapshot.tar');\n    git(repository, ['archive', '--format=tar', `--output=${archive}`, sha]);\n    execFileSync('tar', ['-xf', archive, '-C', folder]);\n    rmSync(archive, { force: true });\n  }\n  // The copy has no node_modules; link the project's own, at the top and one folder down (for example ui/node_modules).\n  for (const name of ['.', ...readdirSync(repository)]) {\n    const modules = join(repository, name, 'node_modules');\n    if (name !== 'node_modules' && existsSync(modules) && !existsSync(join(folder, name, 'node_modules')) && existsSync(join(folder, name))) symlinkSync(modules, join(folder, name, 'node_modules'));\n  }\n  return folder;\n}\n\n/** The project's own runner for these test files, with a machine-readable result: TAP for node:test, JSON for Vitest and Jest. */\nexport function commandFor(framework, files, folder, custom) {\n  const report = join(folder, '.code-map-test-result.json');\n  if (custom) {\n    const argv = custom.trim().split(/\\s+/).flatMap((part) => (part === '{files}' ? files : [part]));\n    return { argv, parse: argv.includes('--test-reporter=tap') ? 'tap' : 'exit', report };\n  }\n  const bin = (name) => join(folder, 'node_modules', '.bin', name);\n  if (framework === 'vitest') return { argv: [bin('vitest'), 'run', '--reporter=json', `--outputFile=${report}`, ...files], parse: 'json', report };\n  if (framework === 'jest') return { argv: [bin('jest'), '--json', `--outputFile=${report}`, ...files], parse: 'json', report };\n  if (framework === 'node:test' || framework === 'unknown') {\n    const typescript = files.some((path) => /\\.[cm]?tsx?$/.test(path)) && existsSync(join(folder, 'node_modules', 'tsx'));\n    return { argv: [process.execPath, ...(typescript ? ['--import', 'tsx'] : []), '--test', '--test-reporter=tap', ...files], parse: 'tap', report };\n  }\n  return null;\n}\n\n/** Tests discovered, passed and failed, and files that could not load (an import, compile or discovery failure). */\nexport function parseResult(kind, stdout, report) {\n  if (kind === 'tap') {\n    const count = (name) => Number((stdout.match(new RegExp(`^# ${name} (\\\\d+)$`, 'm')) ?? [])[1] ?? NaN);\n    const failed = [], fileErrors = [];\n    // node --test reports a test file that cannot load as a failing entry named after the file, with ERR_TEST_FAILURE.\n    for (const match of stdout.matchAll(/^(\\s*)not ok \\d+ - (.*)\\n((?:\\1  .*\\n)*)/gm)) (/ERR_TEST_FAILURE/.test(match[3]) && /exitCode:/.test(match[3]) ? fileErrors : failed).push(match[2]);\n    const tests = count('tests');\n    return Number.isNaN(tests) ? null : { discovered: tests - fileErrors.length, passed: count('pass'), failed, fileErrors };\n  }\n  if (kind === 'json') {\n    if (!existsSync(report)) return null;\n    const result = JSON.parse(readFileSync(report, 'utf8'));\n    const fileErrors = (result.testResults ?? []).filter((file) => file.status === 'failed' && !(file.assertionResults ?? []).length).map((file) => file.name);\n    const failed = (result.testResults ?? []).flatMap((file) => (file.assertionResults ?? []).filter((test) => test.status === 'failed').map((test) => test.fullName ?? test.title));\n    return { discovered: result.numTotalTests ?? 0, passed: result.numPassedTests ?? 0, failed, fileErrors };\n  }\n  return null;\n}\n\nfunction run(command, folder, timeoutMs) {\n  rmSync(command.report, { force: true });\n  const env = { ...process.env, CI: '1', NO_COLOR: '1', FORCE_COLOR: '0' };\n  // Claude calls are paid/non-deterministic. A mutant must not activate the live fallback in an otherwise offline test.\n  env.CODE_MAP_CLAUDE ||= join(folder, '.code-map-live-model-disabled');\n  delete env.NODE_TEST_CONTEXT; // inside another node --test run, a child run reports to the parent instead of printing TAP\n  const started = Date.now();\n  const child = spawnSync(command.argv[0], command.argv.slice(1), { cwd: folder, env, encoding: 'utf8', timeout: timeoutMs, maxBuffer: 256 * 1024 * 1024 });\n  const timedOut = child.error?.code === 'ETIMEDOUT' || child.signal === 'SIGTERM';\n  return { status: child.status, timedOut, durationMs: Date.now() - started, result: timedOut ? null : parseResult(command.parse, child.stdout ?? '', command.report) };\n}\n\n/** Verify every supported discovered test file in a private snapshot before the full workflow mutates anything. */\nexport function verifyTests({ repository, data, testCommand, timeoutMs = 300000, log = () => {} }) {\n  const folder = workspaceFor(repository, data.sha, data.coverageSnapshot === 'working-tree');\n  try {\n    const groups = new Map(), skipped = [];\n    for (const file of data.analysis.tests.testFiles) {\n      if (file.kind !== 'tests') continue;\n      if (skippedLayers.has(file.type) || skippedFrameworks.has(file.framework) || !commandFor(file.framework, [file.path], folder, testCommand)) {\n        skipped.push(file.path); continue;\n      }\n      groups.set(file.framework, [...(groups.get(file.framework) ?? []), file.path]);\n    }\n    const receipts = [];\n    let coverage = null;\n    for (const [framework, paths] of groups) {\n      log(`Verifying ${paths.length} ${framework} test files.`);\n      const command = commandFor(framework, paths, folder, testCommand);\n      const lcov = join(folder, '.code-map-full-coverage.info');\n      if (framework === 'node:test' && !testCommand) command.argv.splice(1, 0, '--experimental-test-coverage',\n        '--test-reporter=lcov', `--test-reporter-destination=${lcov}`, '--test-reporter-destination=stdout');\n      const result = run(command, folder, timeoutMs);\n      if (result.timedOut || result.status !== 0 || !result.result || result.result.failed.length || result.result.fileErrors.length || !result.result.discovered) {\n        throw new Error(`Tests failed (${framework}): ${result.timedOut ? 'timeout' : result.result?.failed.join(', ') || result.result?.fileErrors.join(', ') || 'no readable passing test result'}`);\n      }\n      receipts.push({ framework, files: paths, durationMs: result.durationMs, ...result.result });\n      if (existsSync(lcov)) coverage = readFileSync(lcov, 'utf8').replaceAll(`SF:${folder}/`, 'SF:');\n    }\n    return { receipts, skipped, coverage };\n  } finally { rmSync(folder, { recursive: true, force: true }); }\n}\n\n/**\n * The outcome of one mutant against the baseline: detected (a discovered test failed), survived (the same tests ran and\n * passed), timeout, or error (a file failed to load, fewer tests ran, or the runner failed without a failing test).\n */\nexport function outcome(runs, baselines) {\n  if (runs.some((item) => item.timedOut)) return { status: 'timeout' };\n  const killedBy = [];\n  for (const [index, item] of runs.entries()) {\n    const base = baselines[index].result;\n    if (!item.result) { if (item.status !== 0) return { status: 'error', detail: 'no readable test result' }; continue; }\n    if (item.result.fileErrors.length || item.result.discovered \u003c base.discovered) return { status: 'error', detail: `test files failed to load: ${item.result.fileErrors.slice(0, 3).join(', ') || 'fewer tests discovered'}` };\n    killedBy.push(...item.result.failed);\n    if (!item.result.failed.length && item.status !== 0) return { status: 'error', detail: 'the runner failed without a failing test' };\n  }\n  return killedBy.length ? { status: 'detected', killedBy: killedBy.slice(0, 5) } : { status: 'survived' };\n}\n\n/** Test files that reach a function and that the check can run: not e2e, live or browser tests. */\nexport function testsFor(unit, analysis) {\n  const tests = analysis.tests, byPath = new Map(tests.testFiles.map((file) => [file.path, file]));\n  const fileTests = analysis.files.find((file) => file.path === unit.path)?.tests.direct ?? [];\n  const references = [...unit.direct, ...unit.viaCases.map((item) => item.id)].map((id) => tests.cases[id].path);\n  const paths = new Set(references.length ? references : [...fileTests, ...(unit.declaredTests ?? [])]);\n  return [...paths].map((path) => byPath.get(path)).filter((file) => file && file.kind === 'tests' && !skippedLayers.has(file.type) && !skippedFrameworks.has(file.framework));\n}\n\n/** Runs the check for the selected functions and returns the report. `log` receives one line per step. */\nexport function mutate({ repository, data, files, functionNames = [], testCommand, maxMutants = 25, timeoutMs, log = () => {} }) {\n  const units = data.analysis.tests.units.filter((unit) => files.includes(unit.path) && (!functionNames.length || functionNames.includes(unit.name)) && (unit.exits.length || unit.direct.length));\n  if (!units.length) throw new Error(`No function with failure exits or tests in ${files.join(', ')}${functionNames.length ? ` named ${functionNames.join(', ')}` : ''}`);\n  const folder = workspaceFor(repository, data.sha, data.coverageSnapshot === 'working-tree');\n  const report = { schemaVersion: 1, tool: 'code-map mutate', generatedAt: new Date().toISOString(), project: data.project, ref: data.ref, sha: data.sha,\n    workingTree: data.coverageSnapshot === 'working-tree', files: {}, units: [],\n    limits: ['A surviving mutant means that the selected tests did not detect this change. It does not prove that the code never ran: the change can be equivalent, or the assertions too weak.',\n      'Only failure exits and return values of the selected functions are mutated, and only tests that reach them through imports run.',\n      'The tests run in a private copy with the project\\'s own node_modules. A test can still write outside the copy.'] };\n  let budget = maxMutants;\n  const baselinesByCommand = new Map(), canariesByFile = new Map();\n  const baseline = (command) => {\n    const key = JSON.stringify([command.argv, command.parse, timeoutMs]);\n    const cached = baselinesByCommand.get(key);\n    if (cached) return { ...cached, reused: true };\n    const result = run(command, folder, timeoutMs ?? 300000);\n    baselinesByCommand.set(key, result);\n    return { ...result, reused: false };\n  };\n  try {\n    for (const unit of units) {\n      const text = readFileSync(join(folder, unit.path), 'utf8');\n      report.files[unit.path] ??= { hash: fileHash(text), mutants: [] };\n      const entry = { key: unit.key, tests: [], commands: [], baseline: null, canary: null, status: 'checked' };\n      report.units.push(entry);\n      const reached = testsFor(unit, data.analysis);\n      if (reached.some((file) => !commandFor(file.framework, [file.path], folder, testCommand))) { entry.status = 'no-runner'; log(`${unit.key}: no runner`); continue; }\n      // Each test file needs its own passing baseline. A file that fails without a mutant is excluded and recorded, so a\n      // failure during a mutant run can only come from the mutant.\n      entry.excluded = [];\n      const selected = reached.filter((file) => {\n        const alone = baseline(commandFor(file.framework, [file.path], folder, testCommand));\n        const passed = alone.status === 0 && alone.result && !alone.result.failed.length && !alone.result.fileErrors.length && alone.result.discovered > 0;\n        if (!passed) entry.excluded.push({ path: file.path, failed: alone.result?.failed.slice(0, 3) ?? [], fileErrors: alone.result?.fileErrors ?? [], timedOut: alone.timedOut });\n        return passed;\n      });\n      const byFramework = new Map();\n      for (const file of selected) byFramework.set(file.framework, [...(byFramework.get(file.framework) ?? []), file.path]);\n      const groups = [...byFramework].map(([framework, paths]) => commandFor(framework, paths, folder, testCommand));\n      entry.tests = selected.map((file) => file.path);\n      entry.commands = groups.map((command) => command.argv.map((part) => part.replace(folder + '/', '')).join(' '));\n      if (!selected.length) { entry.status = reached.length ? 'baseline-failed' : 'no-tests'; log(`${unit.key}: ${entry.status}`); continue; }\n      const baselines = groups.map(baseline);\n      entry.baselineReused = baselines.every(item => item.reused);\n      entry.baseline = baselines.map((item) => ({ status: item.status, durationMs: item.durationMs, ...item.result }));\n      if (baselines.some((item) => item.status !== 0 || !item.result || item.result.failed.length || item.result.fileErrors.length || !item.result.discovered)) {\n        entry.status = 'baseline-failed'; log(`${unit.key}: the selected tests do not pass without a mutant`); continue;\n      }\n      const limit = timeoutMs ?? Math.max(10000, 3 * Math.max(...baselines.map((item) => item.durationMs)) + 5000);\n      const check = (mutatedText) => { writeFileSync(join(folder, unit.path), mutatedText); try { return outcome(groups.map((command) => run(command, folder, limit)), baselines); } finally { writeFileSync(join(folder, unit.path), text); } };\n      const canaryKey = JSON.stringify([unit.path, fileHash(text), groups.map(command => command.argv), limit]);\n      entry.canaryReused = canariesByFile.has(canaryKey);\n      entry.canary = canariesByFile.get(canaryKey) ?? check(canary(unit.path, text)).status;\n      canariesByFile.set(canaryKey, entry.canary);\n      if (entry.canary === 'survived') { entry.status = 'not-loaded'; log(`${unit.key}: the selected tests do not load the copied file`); continue; }\n      for (const mutant of mutantsFor(unit.path, text, [unit.name])) {\n        if (budget \u003c= 0) { entry.status = 'partial'; break; }\n        const { start, end, valid, ...kept } = mutant;\n        const result = valid ? check(applyMutant(text, mutant)) : { status: 'invalid' };\n        if (valid) budget--;\n        report.files[unit.path].mutants.push({ ...kept, ...result });\n        log(`${unit.path}:${mutant.line} ${mutant.kind}: ${result.status}`);\n      }\n    }\n  } finally { rmSync(folder, { recursive: true, force: true }); }\n  return report;\n}\n"},{"path":"lib/mutation.mjs","lines":88,"header":"Mutants for a targeted mutation check: small changes to the failure exits and return values of selected functions.\nA test suite that still passes with a mutant did not detect that change. Text positions come from the TypeScript parser.","summary":"Uses the TypeScript parser to make mutants for named top-level functions in one file: it removes throws, error returns, rejections and exit calls, makes catch blocks rethrow, changes HTTP error statuses to 200, and replaces up to three normal return values with undefined, marks a mutant as invalid if the result does not parse, and also give urce.getLineAndCharacterOfPosition(position).line + 1;\n\n/** The top-level statements that declare these names: functions, classes and variables holding them. */\nfunction declarationNodes(source, names) {\n  const found = [];\n  for (const statement of source.statements) {\n    if ((ts.isFunctionDeclaration(statement) || ts.isClassDeclaration(statement)) && names.has(statement.name?.text ?? 'default')) found.push([statement.name?.text ?? 'default', statement]);\n    if (ts.isVariableStatement(statement)) for (const item of statement.declarationList.declarations) if (ts.isIdentifier(item.name) && names.has(item.name.text)) found.push([item.name.text, item]);\n    if (ts.isExportAssignment(statement) && names.has('default')) found.push(['default', statement]);\n  }\n  return found;\n}\n\n/** The change that removes a failure exit: drop a throw or an error return, rethrow in a catch, or turn an error status into 200. */\nfunction exitMutant(source, node, kind) {\n  if (ts.isThrowStatement(node)) return { kind: 'remove-throw', node, replacement: ';' };\n  if (ts.isReturnStatement(node)) return { kind: 'remove-error-return', node, replacement: ';' };\n  if (ts.isCatchClause(node)) {\n    const name = node.variableDeclaration && ts.isIdentifier(node.variableDeclaration.name) ? node.variableDeclaration.name.text : null;\n    return { kind: 'rethrow-in-catch', node: node.block, replacement: `{ throw ${name ?? \"new Error('code-map mutant')\"}; }` };\n  }\n  if (!ts.isCallExpression(node) && !ts.isNewExpression(node)) return null;\n  if (kind === 'catch' && node.arguments?.[0]) return { kind: 'rethrow-in-catch', node: node.arguments[0], replacement: '(error) => { throw error; }' };\n  if (kind === 'status') {\n    const status = httpStatusArgument(node);\n    if (status) return { kind: 'status-to-200', node: status, replacement: '200' };\n  }\n  return { kind: kind === 'reject' ? 'remove-reject' : kind === 'exit' ? 'remove-exit' : 'remove-call', node, replacement: 'undefined' };\n}\n\nconst empty = (node) => !node || node.kind === ts.SyntaxKind.VoidExpression || (ts.isIdentifier(unwrap(node)) && unwrap(node).text === 'undefined');\n\n/**\n * Mutants for the named top-level functions of one file, failure exits first. Each mutant replaces the text between\n * `start` and `end`; a mutant whose result does not parse is marked invalid and never run.\n */\nexport function mutantsFor(path, text, names) {\n  const source = parse(path, text), mutants = [];\n  for (const [unit, root] of declarationNodes(source, new Set(names))) {\n    const exits = [], returns = [];\n    const visit = (node, nested) => {\n      const kind = failureExit(node);\n      if (kind && !insideCatch(node)) { const mutant = exitMutant(source, node, kind); if (mutant) exits.push(mutant); }\n      else if (!nested && ts.isReturnStatement(node) && !empty(node.expression) && !insideCatch(node)) returns.push({ kind: 'return-undefined', node: node.expression, replacement: 'undefined' });\n      // Returns inside nested callbacks belong to those callbacks, not to the function's own result.\n      ts.forEachChild(node, (child) => visit(child, nested || (node !== root && ts.isFunctionLike(node))));\n    };\n    visit(root, false);\n    // A return whose value is a failure response (`return Response.json(…, { status: 400 })`) belongs to that failure path.\n    // A returned promise chain with a .catch handler still returns the normal result, so it keeps its own mutant.\n    const response = new Set(['status-to-200', 'remove-call', 'remove-reject']);\n    const holdsExit = (mutant) => exits.some((exit) => response.has(exit.kind) && exit.node.getStart(source) >= mutant.node.getStart(source) && exit.node.getEnd() \u003c= mutant.node.getEnd());\n    const results = returns.filter((mutant) => !holdsExit(mutant)).slice(0, returnsPerFunction);\n    for (const mutant of [...exits, ...results]) {\n      const start = mutant.node.getStart(source), end = mutant.node.getEnd();\n      const mutated = text.slice(0, start) + mutant.replacement + text.slice(end);\n      mutants.push({ id: `${path}#${unit}:${mutants.length + 1}`, unit: `${path}#${unit}`, line: lineOf(source, start), kind: mutant.kind,\n        original: clip(text.slice(start, end)), replacement: mutant.replacement, start, end, valid: parse(path, mutated).parseDiagnostics.length === 0 });\n    }\n  }\n  return mutants;\n}\n\n/** Ties a report entry to the file content it was made from: a later edit makes that entry stale. */\nexport const fileHash = (text) => createHash('sha256').update(text).digest('hex').slice(0, 12);\n\nexport const applyMutant = (text, mutant) => text.slice(0, mutant.start) + mutant.replacement + text.slice(mutant.end);\n\n/** A module that fails as soon as it loads: when the tests still pass with it, they do not load this copy of the file. */\nexport function canary(path, text) {\n  const cut = text.startsWith('#!') ? text.indexOf('\\n') + 1 : 0; // a #! line must stay first\n  return `${text.slice(0, cut)}throw new Error(${JSON.stringify(`code-map canary: ${path}`)});\\n${text.slice(cut)}`;\n}\n"},{"path":"lib/project.mjs","lines":155,"header":"Works out what to map in an unknown codebase: source folders, tests, import aliases, name and optional limits.\nEverything can be overridden in an optional `.code-map.json` at the repository root.","summary":"Decides what to map in an unknown repository: it loads an optional `.code-map.json`, checks it, and merges it over default output paths and a history depth of 400; it checks that test-entrypoint links and execution inputs are repository-relative paths; it sorts files into code, tests and non-JavaScript test scripts, and skips hidden, build, vendor and similar folders; it picks source roots (`src/` if it exists, otherwise every top-level code folder except scripts and config folders) and selects source and test files; it takes the project name from package.json or from the folder name; it reads tsconfig and jsconfig files an e overridden in an optional `.code-map.json` at the repository root.\nimport { existsSync, readFileSync } from 'node:fs';\nimport { basename, join, posix } from 'node:path';\nimport ts from 'typescript';\n\nexport const codeExtensions = ['.ts', '.tsx', '.mts', '.cts', '.js', '.jsx', '.mjs', '.cjs'];\nconst testPattern = /(^|\\/)(__tests__|__mocks__|tests?|e2e|spec|specs|cypress|playwright)\\/|\\.(test|spec|e2e)\\.[cm]?[jt]sx?$/;\nconst ignoredDirectories = new Set(['node_modules', 'dist', 'build', 'out', 'coverage', 'public', 'docs', 'vendor', 'tmp',\n  'temp', 'storybook-static', 'generated', '__generated__']);\n\nexport const defaults = {\n  descriptions: 'docs/code-map/descriptions.json',\n  testLabels: 'docs/code-map/test-labels.json',\n  mutation: 'docs/code-map/mutation.json',\n  out: 'docs/code-map/code-map.html',\n  history: 400,\n};\n\nexport function loadConfig(repository) {\n  const path = join(repository, '.code-map.json');\n  if (!existsSync(path)) return { ...defaults };\n  const parsed = JSON.parse(readFileSync(path, 'utf8'));\n  if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) throw new Error('.code-map.json must be an object');\n  const testEntrypoints = readTestEntrypoints(parsed.testEntrypoints);\n  const executionInputs = parsed.executionInputs ?? [];\n  if (!Array.isArray(executionInputs) || !executionInputs.every(repositoryPath)) throw new Error('executionInputs must contain repository-relative file paths');\n  return { ...defaults, ...parsed, testEntrypoints, executionInputs };\n}\n\nconst repositoryPath = (value) => typeof value === 'string' && value.length > 0 && !/^[\\\\/]|[:\\\\]/.test(value)\n  && value.split('/').every(part => part !== '..' && part !== '.' && part !== '');\n\n/** Explicit subprocess links are configuration evidence, not inferred imports or proof of function assertions. */\nexport function readTestEntrypoints(value, sources = null, tests = null) {\n  if (value === undefined) return {};\n  if (typeof value !== 'object' || value === null || Array.isArray(value)) throw new Error('testEntrypoints must be an object');\n  const entries = [];\n  for (const [path, targets] of Object.entries(value)) {\n    if (!repositoryPath(path) || !Array.isArray(targets) || !targets.length || !targets.every(repositoryPath)) throw new Error('testEntrypoints must map test files to repository-relative source paths');\n    if (tests && !tests.has(path) || sources && targets.some(target => !sources.has(target))) throw new Error(`testEntrypoints names an unmapped test or entrypoint: ${path}`);\n    entries.push([path, [...new Set(targets)]]);\n  }\n  return Object.fromEntries(entries);\n}\n\nexport function isCode(path) {\n  return codeExtensions.some((extension) => path.endsWith(extension)) && !/\\.d\\.[cm]?ts$/.test(path);\n}\n\nfunction ignored(path) {\n  return path.split('/').slice(0, -1).some((part) => part.startsWith('.') || ignoredDirectories.has(part));\n}\n\nexport function isTest(path) { return isCode(path) && !ignored(path) && testPattern.test(path); }\n\n/** Test scripts in other languages (for example `tests/e2e/run-smoke.sh`): listed as tests that the scan cannot read. */\nexport function isTestScript(path) {\n  return !isCode(path) && !ignored(path) && /(^|\\/)(__tests__|tests?|e2e|spec|specs|smoke)\\//.test(path) && !/(^|\\/)(__)?fixtures?(__)?\\//.test(path)\n    && /\\.(sh|bash|zsh|py|rb|ps1)$/.test(path);\n}\n\n/** `src/` when it exists; otherwise every top-level folder holding code (Next.js apps: app, components, lib…). */\nexport function detectRoots(paths, config) {\n  if (Array.isArray(config.roots) && config.roots.length > 0) return config.roots.map((root) => root.replace(/\\/+$/, ''));\n  const candidates = paths.filter((path) => isCode(path) && !isTest(path) && !ignored(path));\n  if (candidates.some((path) => path.startsWith('src/'))) return ['src'];\n  const folders = [...new Set(candidates.filter((path) => path.includes('/')).map((path) => path.split('/')[0]))]\n    .filter((folder) => !['scripts', 'config', 'configs'].includes(folder));\n  return folders.length > 0 ? folders.sort() : ['.'];\n}\n\nexport function underRoots(path, roots) {\n  return roots.some((root) => root === '.' ? !path.includes('/') || !ignored(path) : path.startsWith(root + '/'));\n}\n\nexport function selectSources(paths, roots) {\n  return paths.filter((path) => isCode(path) && !isTest(path) && !ignored(path) && underRoots(path, roots));\n}\n\nexport function selectTests(paths) { return paths.filter(isTest); }\n\nexport function projectName(texts, repository) {\n  try {\n    const name = JSON.parse(texts.get('package.json') ?? '{}').name;\n    if (typeof name === 'string' && name.length > 0) return name;\n  } catch { /* not a Node project, or invalid package.json */ }\n  return basename(repository);\n}\n\n/** Read configs against the mapped files, never the checked-out filesystem. */\nexport function readAliases(texts) {\n  const { absolute, host } = snapshotConfigHost(texts);\n  const configPaths = [...absolute.keys()].filter((path) => /\\/(?:tsconfig|jsconfig)(?:\\.[^/]*)?\\.json$/.test(path));\n  const projects = [], seen = new Set();\n  const read = (path) => {\n    if (seen.has(path)) return;\n    seen.add(path);\n    const parsed = ts.getParsedCommandLineOfConfigFile(path, undefined, host);\n    if (!parsed) return;\n    projects.push({ path, directory: posix.dirname(path), files: new Set(parsed.fileNames), options: parsed.options });\n    for (const reference of parsed.projectReferences ?? []) {\n      const target = reference.path.endsWith('.json') ? reference.path : posix.join(reference.path, 'tsconfig.json');\n      if (absolute.has(target)) read(target);\n    }\n  };\n  for (const path of configPaths.sort()) read(path);\n  projects.sort((a, b) => b.directory.length - a.directory.length\n    || Number(!a.path.endsWith('/tsconfig.json')) - Number(!b.path.endsWith('/tsconfig.json'))\n    || a.path.localeCompare(b.path));\n  return { baseUrl: null, aliases: [], projects };\n}\n\nfunction snapshotConfigHost(texts) {\n  const absolute = new Map([...texts].map(([path, text]) => [posix.resolve('/', path), text]));\n  const directories = new Map();\n  for (const path of absolute.keys()) {\n    let child = path, directory = posix.dirname(child);\n    while (child !== directory) {\n      if (!directories.has(directory)) directories.set(directory, { files: new Set(), directories: new Set() });\n      const entries = directories.get(directory);\n      (child === path ? entries.files : entries.directories).add(posix.basename(child));\n      child = directory; directory = posix.dirname(child);\n    }\n  }\n  const host = {\n    useCaseSensitiveFileNames: true,\n    getCurrentDirectory: () => '/',\n    fileExists: (path) => absolute.has(posix.normalize(path)),\n    readFile: (path) => absolute.get(posix.normalize(path)),\n    // TypeScript 6.0.3 uses this same matcher in sys.readDirectory. Supply snapshot\n    // directory entries so include/exclude and inherited paths stay compiler-defined.\n    readDirectory: (path, extensions, excludes, includes, depth) => ts.matchFiles(path, extensions, excludes, includes,\n      true, '/', depth, (directory) => {\n        const entries = directories.get(posix.resolve('/', directory));\n        return { files: [...(entries?.files ?? [])], directories: [...(entries?.directories ?? [])] };\n      }, (path) => path),\n    // Malformed configs have no usable project; mapping other files can continue.\n    onUnRecoverableConfigFileDiagnostic: () => undefined,\n  };\n  return { absolute, host };\n}\n\n/** Optional line budgets per top-level folder: given in the config, or read from a size-check script. */\nexport function readBudgets(config, texts) {\n  if (config.budgets && typeof config.budgets === 'object') return config.budgets;\n  const source = typeof config.budgetsFrom === 'string' ? texts.get(config.budgetsFrom) : undefined;\n  if (source === undefined) return {};\n  const budgets = {};\n  const block = /limits[^{]*\\{([^}]*)\\}/.exec(source)?.[1] ?? '';\n  for (const match of block.matchAll(/(\\w+):\\s*([\\d_]+)/g)) budgets[match[1]] = Number(match[2].replace(/_/g, ''));\n  const total = /total > ([\\d_]+)/.exec(source)?.[1];\n  if (total !== undefined) budgets.total = Number(total.replace(/_/g, ''));\n  return budgets;\n}\n"},{"path":"lib/server.mjs","lines":142,"header":"Local server for `code-map serve`: serves the map and answers chat questions with Claude Code.\nIt listens on 127.0.0.1 only, answers only requests addressed to that address, and every chat request must carry\na token that only the served page knows, so other websites open in the browser cannot use it.\nClaude Code gets read-only tools and none of the mapped repository's own settings, hooks or MCP servers.","summary":"Starts the local web server for `code-map serve`: it listens only on 127.0.0.1 and tries up to 20 higher ports if the first one is busy, rejects any request whose Host or Origin header is not its own address (this blocks DNS rebinding), serves the map page with a random per-run token, and on POST /api/chat checks that token, validates the JSON message, builds a prompt from the item selected in the map, and runs `claude -p` in the chat folder with only the Read, Grep and Glob tools, the user's own settings and no MCP servers, then streams text, tool activity, the session id and errors back as newline-delimited JSON and stops Claude Code when the browser disconnects.","status":"current","imports":[],"externals":["node:child_process","node:crypto","node:http"],"exports":["startServer"],"edges":[{"target":null,"specifier":"node:child_process","kind":"value","mode":"static","line":5,"typeNames":[],"valueNames":["spawn"]},{"target":null,"specifier":"node:crypto","kind":"value","mode":"static","line":6,"typeNames":[],"valueNames":["randomBytes"]},{"target":null,"specifier":"node:http","kind":"value","mode":"static","line":7,"typeNames":[],"valueNames": ureExits":[]}},{"name":"toolLabel","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":137,"end":142,"startOffset":8018,"endOffset":8350,"metrics":{"lines":6,"internalDependencies":[],"hookCalls":[],"failureExits":[]}}],"uses":{},"valueUses":{},"tests":["test/security.test.mjs"],"created":"2026-10-16T15:07:09-04:00","changed":"2026-10-16T15:07:09-04:00","source":"// Local server for `code-map serve`: serves the map and answers chat questions with Claude Code.\n// It listens on 127.0.0.1 only, answers only requests addressed to that address, and every chat request must carry\n// a token that only the served page knows, so other websites open in the browser cannot use it.\n// Claude Code gets read-only tools and none of the mapped repository's own settings, hooks or MCP servers.\nimport { spawn } from 'node:child_process';\nimport { randomBytes } from 'node:crypto';\nimport http from 'node:http';\n\nconst systemPrompt = [\n  'You are helping the owner of this repository understand its code. They are looking at a visual code map',\n  'and asking about the part they selected. Answer in plain English and keep it short; use a few bullets when it helps.',\n  'Define each abbreviation the first time you use it. When you refer to code, give its location as path:line,',\n  'for example src/cli/server.ts:19, so the map can link to it. Read and search files as needed.',\n  'Never try to change files or run commands.',\n].join(' ');\n\nexport function startServer({ workspace, port, page }) {\n  const token = randomBytes(24).toString('hex');\n  const server = http.createServer((request, response) => {\n    // DNS rebinding: a website can point its own name at 127.0.0.1, but the browser still sends that name.\n    const own = (address) => address === `127.0.0.1:${server.address().port}` || address === `localhost:${server.address().port}`;\n    if (!own(request.headers.host)) return response.writeHead(403).end();\n    const origin = request.headers.origin;\n    if (origin !== undefined && !(origin.startsWith('http://') && own(origin.slice('http://'.length)))) return response.writeHead(403).end();\n    const url = new URL(request.url ?? '/', 'http://127.0.0.1');\n    if (request.method === 'GET' && url.pathname === '/') {\n      try {\n        response.writeHead(200, { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' });\n        response.end(page({ token }));\n      } catch (error) {\n        response.writeHead(500, { 'content-type': 'text/plain' }).end(String(error?.stack ?? error));\n      }\n      return;\n    }\n    if (request.method === 'POST' && url.pathname === '/api/chat') return chat(request, response, token, workspace());\n    response.writeHead(404).end();\n  });\n  // A port already in use (often an older code-map left running) moves on to the next free one.\n  return new Promise((resolve, reject) => {\n    let candidate = port;\n    server.on('error', (error) => {\n      if (error.code === 'EADDRINUSE' && candidate \u003c port + 20) server.listen(++candidate, '127.0.0.1');\n      else reject(error);\n    });\n    server.once('listening', () => resolve({ server, port: server.address().port }));\n    server.listen(candidate, '127.0.0.1');\n  });\n}\n\nasync function chat(request, response, token, place) {\n  if (request.headers['x-code-map-token'] !== token) return response.writeHead(403).end();\n  let body = '';\n  for await (const chunk of request) { body += chunk; if (body.length > 400_000) return response.writeHead(413).end(); }\n  let input;\n  try { input = JSON.parse(body); } catch { return response.writeHead(400).end(); }\n  if (typeof input.message !== 'string' || input.message.trim() === '') return response.writeHead(400).end();\n  response.writeHead(200, { 'content-type': 'application/x-ndjson; charset=utf-8', 'cache-control': 'no-store' });\n  const send = (event) => { if (!response.writableEnded) response.write(JSON.stringify(event) + '\\n'); };\n  const child = runClaude(place, prompt(input), typeof input.session === 'string' ? input.session : null, send);\n  response.on('close', () => { if (child.exitCode === null) child.kill('SIGTERM'); });\n  child.on('close', () => { send({ type: 'done' }); response.end(); });\n}\n\nfunction prompt(input) {\n  const context = input.context && typeof input.context === 'object' ? input.context : null;\n  if (!context?.path) return input.message;\n  const where = context.kind === 'decl' ? `${context.declKind ?? 'declaration'} ${context.name} in ${context.path}`\n    + (context.start ? ` (lines ${context.start}–${context.end})` : '') : `${context.kind ?? 'item'} ${context.path}`;\n  const about = context.summary ? `\\nIts description in the map: ${context.summary}` : '';\n  const code = typeof context.code === 'string' && context.code\n    ? `\\n\\nThe selected code (${context.path}${context.codeStart ? `, from line ${context.codeStart}` : ''}):\\n\\`\\`\\`\\n${context.code}\\n\\`\\`\\``\n    : '';\n  const contents = typeof context.contents === 'string' && context.contents ? `\\n\\nWhat it contains:\\n${context.contents}` : '';\n  return `Selected in the code map: ${where}.${about}${code}${contents}\\n\\nQuestion: ${input.message}`;\n}\n\n/** Runs `claude -p` with streamed JSON output and forwards text, tool activity and the session id. */\nfunction runClaude(place, text, session, send) {\n  const repository = place.directory;\n  const command = process.env.CODE_MAP_CLAUDE || 'claude';\n  // The mapped repository is untrusted: its .claude settings could add hooks that run commands, and its .mcp.json\n  // could add tools. Only the user's own settings load, no MCP servers start, and only the three read tools exist.\n  const args = ['-p', '--output-format', 'stream-json', '--verbose', '--include-partial-messages',\n    '--setting-sources', 'user', '--strict-mcp-config', '--tools', 'Read,Grep,Glob',\n    '--allowedTools', 'Read,Grep,Glob', '--disallowedTools', 'Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch',\n    '--append-system-prompt', `${systemPrompt} ${place.note}`, ...(session ? ['--resume', session] : [])];\n  const child = spawn(command, args, { cwd: repository, stdio: ['pipe', 'pipe', 'pipe'] });\n  child.stdin.end(text);\n  let buffer = '', errors = '', streamed = false, wrote = false;\n  child.stdout.setEncoding('utf8');\n  child.stdout.on('data', (chunk) => {\n    buffer += chunk;\n    let newline;\n    while ((newline = buffer.indexOf('\\n')) >= 0) {\n      const line = buffer.slice(0, newline).trim();\n      buffer = buffer.slice(newline + 1);\n      if (!line) continue;\n      let event;\n      try { event = JSON.parse(line); } catch { continue; }\n      const result = forward(event, send, streamed, wrote, repository);\n      streamed ||= result.streamed; wrote ||= result.wrote;\n    }\n  });\n  child.stderr.setEncoding('utf8');\n  child.stderr.on('data', (chunk) => { errors = (errors + chunk).slice(-4000); });\n  child.on('error', (error) => {\n    send({ type: 'error', message: error.code === 'ENOENT'\n      ? 'The Claude Code command (`claude`) was not found. Install Claude Code and log in, or set CODE_MAP_CLAUDE to its path.'\n      : String(error.message) });\n  });\n  child.on('close', (code) => {\n    if (code !== 0 && code !== null && !wrote) send({ type: 'error', message: errors.trim() || `Claude Code exited with code ${code}` });\n  });\n  return child;\n}\n\nfunction forward(event, send, streamed, wrote, repository) {\n  const out = { streamed: false, wrote: false };\n  if (event.session_id && ((event.type === 'system' && event.subtype === 'init') || event.type === 'result')) send({ type: 'session', id: event.session_id });\n  if (event.type === 'stream_event' && event.event?.type === 'content_block_delta' && event.event.delta?.type === 'text_delta') {\n    send({ type: 'text', text: event.event.delta.text });\n    return { streamed: true, wrote: true };\n  }\n  if (event.type === 'assistant') {\n    for (const block of event.message?.content ?? []) {\n      if (block.type === 'tool_use') send({ type: 'tool', text: toolLabel(block, repository) });\n      if (block.type === 'text' && !streamed && block.text) { send({ type: 'text', text: block.text }); out.wrote = true; }\n    }\n  }\n  if (event.type === 'result') {\n    if (event.is_error) send({ type: 'error', message: String(event.result ?? 'Claude Code reported an error') });\n    else if (!wrote && !out.wrote && typeof event.result === 'string') { send({ type: 'text', text: event.result }); out.wrote = true; }\n  }\n  return out;\n}\n\nfunction toolLabel(block, repository) {\n  const input = block.input ?? {};\n  const target = String(input.file_path ?? input.pattern ?? input.path ?? '').replace(repository + '/', '');\n  const verb = { Read: 'Reading', Grep: 'Searching for', Glob: 'Listing' }[block.name] ?? block.name;\n  return `${verb} ${String(target)}`.trim();\n}\n"},{"path":"lib/snapshot.mjs","lines":52,"header":"The chat must read the same version of the code that the map shows. When the mapped commit is not the\nchecked-out one, this exports that commit into a private, temporary folder (the repository is not touched)\nand Claude Code runs there.","summary":"Chooses the folder where the chat's Claude Code runs, so that it reads the same version of the code that the map shows: the repository itself for a working-tree map or when the mapped commit is checked out, and otherwise a temporary copy of that commit exported with `git archive` into a per-repository folder under the system temp directory (it reuses the copy when a marker file exists and deletes older copies), with a check that refuses temp folders that are not real directories owned by the current user and closed to others (skipped on Windows), and a note for the model that says which copy it is in.","status":"current","imports":["lib/git.mjs"],"externals":["node:child_process","node:crypto","node:fs","node:os","node:path"],"exports":["chatWorkspace","privateRoot"],"edges on labelsTodo(labels, testFacts, texts, labelsPath, only = []) {\n  const lines = ['# Code map: test intents to label', '',\n    `For each case below, read the test and write its intent in \\`${labelsPath}\\` under \"files\" → test path → \"cases\" → case name.`,\n    `Use one of: ${intents.map((intent) => `\"${intent}\"`).join(', ')}. \"unhappy\" means that the case checks a failure, an error or a rejected input.`,\n    '\"regression\" means that the case guards against a bug that was fixed; label it \"regression\" only when that is its main purpose.',\n    'Add a short \"note\" when the intent is not obvious from the name.',\n    'Then run `code-map labels stamp` for new files, or `code-map labels stamp --file \u003ctest>` for each file whose labels you refreshed.',\n    'Example: {\"files\": {\"test/a.test.ts\": {\"cases\": {\"parse > rejects empty input\": {\"intent\": \"unhappy\"}}}}}', ''];\n  for (const facts of testFacts) {\n    if (only.length && !only.includes(facts.path)) continue;\n    const entry = labels.files[facts.path], status = labelStatus(entry, testHash(texts.get(facts.path) ?? ''));\n    // A current file lists only the cases that still have no label; any other state lists every case.\n    const cases = (facts.testScan?.cases ?? []).filter((item) => status !== 'current' || !entry.cases[caseKey(item)]);\n    if (cases.length === 0) continue;\n    lines.push(`## ${facts.path} (${status === 'current' ? 'labels missing for some cases' : status}, ${cases.length} cases)`);\n    for (const item of cases) {\n      const kinds = [...new Set(item.failures.map((failure) => failure.kind))];\n      lines.push(`- line ${item.line}: ${caseKey(item)} · ${item.assertions} assertions${kinds.length ? ` · failure checks found: ${kinds.join(', ')}` : ''}`);\n    }\n    lines.push('');\n  }\n  if (!lines.some((line) => line.startsWith('## '))) lines.push('Nothing to label: every case in the selected test files has a current label.');\n  return lines.join('\\n');\n}\n\n/**\n * Records the version of each labelled test file, so a later edit to the test marks its labels stale. Without `only`,\n * it stamps files that have no version yet (`all`: every labelled file). With `only`, it refreshes exactly those files,\n * after their labels were reviewed. Other content stays as written.\n */\nexport function stampTestLabels(path, testFacts, texts, all, only = []) {\n  if (!existsSync(path)) return 0;\n  const raw = JSON.parse(readFileSync(path, 'utf8'));\n  let stamped = 0;\n  const known = new Set(testFacts.map((facts) => facts.path));\n  for (const [file, entry] of Object.entries(isRecord(raw?.files) ? raw.files : {})) {\n    if (!known.has(file) || !isRecord(entry)) continue;\n    if (only.length ? !only.includes(file) : typeof entry.hash === 'string' && !all) continue;\n    entry.hash = testHash(texts.get(file) ?? '');\n    stamped += 1;\n  }\n  mkdirSync(dirname(path), { recursive: true });\n  writeFileSync(path, JSON.stringify(raw, null, 2) + '\\n');\n  return stamped;\n}\n"},{"path":"lib/test-quality.mjs","lines":269,"header":"Test quality: links test cases to the source functions they reference, then compares failure exits with failure checks.\nNo I/O or execution. A reference is a possible call, and a pattern-matched failure check is evidence, not proof.","summary":"Without file access or code execution, links each test case to the source functions it references, following re-exports and callers up to three calls away; it classifies test files as unit, integration, e2e and similar types from their paths and imported libraries; it flags test smells such as no assertions, only weak checks, snapshot-only, call-only and tautologies; and for each function that has failure exits or direct tests, it reports whether an unconditional failure check reaches it directly, indirectly or not at all, how strictly its result is checked, coverage hits on its exits from working-tree reports, mutation results, how many files import it directly or
