ct\n  code-map todo            list files whose description is missing or stale\n  code-map stamp           record the current exports of newly described files (stamp-all: all of them)\n  code-map labels          list test cases whose intent labels are missing or stale (optional model pass)\n  code-map labels stamp    record the test version that new labels describe (--file \u003ctest>: refresh that file; stamp-all: all)\n  code-map mutate          mutation check: change the failure exits and return values of --file (and --function) in a\n                           private copy, run the tests that reach them, and report which changes no test detected.\n                           It runs the project's own tests: use it only on code that you trust.\n\nOptions:\n  --ref \u003cbranch>           map this branch or commit (complete run defaults to working tree; build/inspect/serve: latest source branch)\n  --worktree               map the working tree, including uncommitted changes\n  --force                  repeat test and mutation checks even when inputs are unchanged\n  --out \u003cfile>             where to write the page (default: ${defaults.out})\n  --descriptions \u003cfile>    descriptions file (default: ${defaults.descriptions})\n  --labels \u003cfile>          test intent labels file (default: ${defaults.testLabels})\n  --mutation \u003cfile>        mutation report to write (mutate) or to read (default: ${defaults.mutation})\n  --function \u003cname>        mutate: only this top-level function of the selected files; repeat to select several\n  --test-command \u003ccommand> mutate: run tests with this command; {files} stands for the test files\n  --max-mutants \u003cnumber>   mutation limit (targeted mutate: 25; complete run: all eligible candidates)\n  --timeout \u003cseconds>      mutate: time limit for each test run (default: three times the baseline, at least 10)\n  --json                   emit JSON instead of HTML (also the default for inspect)\n  --file \u003cpath>            inspect a mapped source file; repeat to select several (labels: a test file)\n  --change \u003cselection>     inspect latest, branch, or uncommitted changes\n  --exclude-vendors        omit primitive/vendor paths from report file details\n  --port \u003cnumber>          port for serve (default: 4477)\n`;\n\nconst { values: options, positionals } = parseArgs({ allowPositionals: true, options: {\n  ref: { type: 'string' }, worktree: { type: 'boolean', default: false }, out: { type: 'string' }, force: { type: 'boolean', default: false },\n  json: { type: 'boolean', default: false }, file: { type: 'string', multiple: true }, change: { type: 'string' },\n  'exclude-vendors': { type: 'boolean', default: false },\n  descriptions: { type: 'string' }, labels: { type: 'string' }, mutation: { type: 'string' }, function: { type: 'string', multiple: true },\n  'test-command': { type: 'string' }, 'max-mutants': { type: 'string' }, timeout: { type: 'string' },\n  history: { type: 'string' }, todo: { type: 'boolean', default: false },\n  stamp: { type: 'boolean', default: false }, 'stamp-all': { type: 'boolean', default: false },\n  serve: { type: 'boolean', default: false }, port: { type: 'string', default: '4477' }, help: { type: 'boolean', short: 'h', default: false },\n} });\n\nif (options.help) { process.stdout.write(help); process.exit(0); }\n\nlet repository;\ntry { repository = repositoryRoot(process.cwd()); } catch {\n  process.stderr.write('code-map needs to run inside a Git repository.\\n'); process.exit(1);\n}\nconst config = loadConfig(repository);\n\n// Plain-word commands (`code-map serve`) work through `npm run map serve`, which needs no `--` divider.\nconst command = positionals[0];\nif (command === 'serve') options.serve = true;\nelse if (command === 'todo') options.todo = true;\nelse if (command === 'stamp') options.stamp = true;\nelse if (command === 'stamp-all') options['stamp-all'] = true;\nelse if (command === 'help') { process.stdout.write(help); process.exit(0); }\n\nif (command === 'init') init();\nelse if (command === 'labels' && positionals.length \u003c= 2) labelsWork(positionals[1]);\nelse if (command === 'mutate' && positionals.length === 1) {\n  try { mutateWork(); } catch (error) { process.stderr.write(`code-map: ${error instanceof Error ? error.message : String(error)}\\n`); process.exitCode = 1; }\n}\nelse if (positionals.length > 1 || (command && !['serve', 'todo', 'stamp', 'stamp-all', 'inspect', 'build', 'all'].includes(command))) {\n  process.stderr.write(`Unknown command: ${positionals.join(' ')}\\n\\n${help}`); process.exit(1);\n}\nelse if (command === 'inspect' || options.json) {\n  try { inspect(); } catch (error) { process.stderr.write(`code-map: ${error instanceof Error ? error.message : String(error)}\\n`); process.exitCode = 1; }\n}\nelse if (options.todo || options.stamp || options['stamp-all']) descriptionsWork();\nelse if (options.serve) await serve();\nelse if (command === 'build') build();\nelse {\n  const controller = new AbortController();\n  const cancel = () => controller.abort();\n  process.once('SIGINT', cancel);\n  try {\n    if (options.ref === undefined) options.worktree = true;\n    for (const key of ['max-mutants', 'timeout']) if (options[key] !== undefined && (!Number.isSafeInteger(Number(options[key])) || Number(options[key]) \u003c 1)) throw new Error(`${key} must be a positive integer`);\n    await fullRun(repository, config, options, { signal: controller.signal, log: line => process.stderr.write(`  ${line}\\n`) });\n    build();\n  } catch (error) { process.stderr.write(`code-map: ${error instanceof Error ? error.message : String(error)}\\n`); process.exitCode = 1; }\n  finally { process.removeListener('SIGINT', cancel); }\n}\n\nfunction build() {\n  const facts = collect(repository, config, options);\n  const data = mapData(repository, config, facts, Number(options.history ?? config.history), options.worktree);\n  const out = resolve(repository, options.out ?? config.out);\n  writePage(out, renderPage(data, null));\n  const missing = data.files.filter((file) => file.status === 'missing').length;\n  const stale = data.files.filter((file) => file.status === 'stale').length;\n  process.stdout.write(`Code map of ${data.project} · ${data.ref} (${data.sha.slice(0, 7)}): ${data.files.length} files in `\n    + `${data.roots.join(', ')}, ${data.history.snapshots.length} snapshots, ${missing} undescribed, ${stale} stale\\n`\n    + `  -> ${relative(process.cwd(), out) || out}\\n`);\n  return { data, out };\n}\n\nfunction inspect() {\n  const facts = collect(repository, config, options);\n  const data = mapData(repository, config, facts, Number(options.history ?? config.history), options.worktree);\n  const report = createReport(data, { files: options.file ?? [], change: options.change, includeVendors: !options['exclude-vendors'] }, summarizeTests);\n  const json = JSON.stringify(report, null, 2) + '\\n';\n  if (options.out) writePage(resolve(repository, options.out), json);\n  else process.stdout.write(json);\n}\n\nfunction descriptionsWork() {\n  const facts = collect(repository, config, options);\n  if (options.todo) { process.stdout.write(todoReport(facts.descriptions, facts.files, relative(repository, facts.descriptionsPath)) + '\\n'); return; }\n  const count = stampDescriptions(facts.descriptionsPath, facts.descriptions, facts.files, options['stamp-all']);\n  process.stdout.write(`Stamped ${count} descriptions with their files' current exports.\\n`);\n}\n\n/** The optional model pass: a work list of test cases to label, or a stamp that records the labelled test files. */\nfunction labelsWork(step) {\n  const facts = collect(repository, config, options);\n  const shown = relative(repository, facts.labelsPath);\n  if (step === undefined) { process.stdout.write(labelsTodo(facts.labels, facts.testFacts, facts.texts, shown, options.file ?? []) + '\\n'); return; }\n  if (step !== 'stamp' && step !== 'stamp-all') { process.stderr.write(`Unknown command: labels ${step}\\n\\n${help}`); process.exitCode = 1; return; }\n  const count = stampTestLabels(facts.labelsPath, facts.testFacts, facts.texts, step === 'stamp-all', options.file ?? []);\n  process.stdout.write(`Stamped the labels of ${count} test files in ${shown}.\\n`);\n}\n\n/** The mutation check: writes its report, prints one line per function and lists the changes that no test detected. */\nfunction mutateWork() {\n  if (!options.file?.length) throw new Error('mutate needs --file \u003csource path>');\n  const facts = collect(repository, config, options);\n  const data = mapData(repository, config, facts, Number(options.history ?? 2), options.worktree);\n  const report = mutate({ repository, data, files: options.file, functionNames: options.function ?? [], testCommand: options['test-command'] ?? config.mutationTestCommand,\n    maxMutants: Number(options['max-mutants'] ?? 25), timeoutMs: options.timeout ? Number(options.timeout) * 1000 : undefined,\n    log: (line) => process.stderr.write(`  ${line}\\n`) });\n  const out = resolve(repository, options.out ?? options.mutation ?? config.mutation);\n  writePage(out, JSON.stringify(report, null, 2) + '\\n');\n  for (const unit of report.units) {\n    const mutants = report.files[unit.key.slice(0, unit.key.lastIndexOf('#'))].mutants.filter((item) => item.unit === unit.key);\n    const count = (status) => mutants.filter((item) => item.status === status).length;\n    process.stdout.write(`${unit.key}: ${unit.status}, ${unit.tests.length} test files, ${count('detected')} detected, ${count('survived')} not detected, `\n      + `${count('timeout')} timeouts, ${count('error') + count('invalid')} errors or invalid\\n`);\n    for (const item of mutants.filter((entry) => entry.status === 'survived')) process.stdout.write(`  line ${item.line} ${item.kind}: ${item.original} → ${item.replacement}\\n`);\n  }\n  process.stdout.write(`Report: ${relative(process.cwd(), out) || out}. A change that no test detected is a lead, not proof: it can be equivalent.\\n`);\n}\n\n/** The page is rebuilt whenever the mapped commit changes, so reloading the browser shows new code. */\nasync function serve() {\n  let cache = { key: null, data: null };\n  let place = { directory: repository, note: '' };\n  const page = ({ token }) => {\n    const key = git(repository, ['rev-parse', 'HEAD']).trim() + git(repository, ['for-each-ref', '--format=%(objectname)', 'refs/heads']);\n    if (cache.key !== key || options.worktree) {\n      const facts = collect(repository, config, options);\n      cache = { key, data: mapData(repository, config, facts, Number(options.history ?? config.history), options.worktree) };\n      place = chatWorkspace(repository, facts.reader.sha, cache.data.ref, options.worktree);\n      writePage(resolve(repository, options.out ?? config.out), renderPage(cache.data, null));\n    }\n    return renderPage(cache.data, { token });\n  };\n  page({ token: '' });\n  const port = Number(options.port);\n  const started = await startServer({ workspace: () => place, port, page });\n  const note = started.port === port ? '' : `  (port ${port} was busy, probably an older code-map; stop it with: lsof -ti tcp:${port} | xargs kill)`;\n  process.stdout.write(`Code map of ${cache.data.project}: http://127.0.0.1:${started.port}  (Ctrl+C to stop)${note}\\n`);\n}\n\nfunction init() {\n  const configPath = join(repository, '.code-map.json');\n  if (!existsSync(configPath)) {\n    writeFileSync(configPath, JSON.stringify({ descriptions: defaults.descriptions, out: defaults.out }, null, 2) + '\\n');\n    process.stdout.write('Created .code-map.json\\n');\n  }\n  const packagePath = join(repository, 'package.json');\n  if (!existsSync(packagePath)) { process.stdout.write('No package.json: run `code-map` directly.\\n'); return; }\n  const text = readFileSync(packagePath, 'utf8');\n  const parsed = JSON.parse(text);\n  if (parsed.scripts?.map) { process.stdout.write(`package.json already has \"map\": \"${parsed.scripts.map}\"\\n`); return; }\n  // Insert the line in place so the file keeps its own formatting; fall back to rewriting it.\n  const scripts = /(\"scripts\"\\s*:\\s*\\{)(\\s*)/.exec(text);\n  const hasScripts = parsed.scripts && Object.keys(parsed.scripts).length > 0;\n  const updated = scripts && hasScripts && scripts[2].includes('\\n')\n    ? text.replace(scripts[0], `${scripts[1]}${scripts[2]}\"map\": \"code-map\",${scripts[2]}`)\n    : JSON.stringify({ ...parsed, scripts: { ...parsed.scripts, map: 'code-map' } }, null, 2) + '\\n';\n  writeFileSync(packagePath, updated);\n  process.stdout.write('Added \"map\": \"code-map\" to package.json. Run: npm run map\\n');\n}\n"},{"path":"lib/analysis.mjs","lines":172,"header":"Shared structural analysis for the CLI and offline viewer. No I/O or source execution.","summary":"Builds a structural analysis of a mapped project from its file facts, with no I/O, and also turns that analysis into a report: for each file it finds importers, export usage (source, test-only, unreferenced or entry point), flattened declarations with metrics, the tests that reach it directly, transitively or by declaration, co-change partners and a hotspot score (commits times lines); for the project it finds all and value-only import cycles with an iterative Kosaraju search, shared-type candidates between files that import each other, test-quality results and a list of known limits; createReport filters this analysis to selected files or to a change set (latest commit, branch or uncommitted) and gives an error for unknown or unmapped selections.","status":"current","imports":["lib/test-quality.mjs"],"externals":[],"exports":["analyzeProject","createReport"],"edges":[{"target":"lib/test-quality.mjs","specifier":"./test-quality.mjs","kind":"value","mode":"static","line":2,"typeNames":[],"valueNames":["analyzeTests"]}],"exportDetails":[{"name":"analyzeProject","category":"value","localName":"analyzeProject","typeOnly":false,"line":8,"localReferences":0},{"name":"createReport","category":"value","localName":"createReport","typeOnly":false,"line":135,"localReferences":0}],"declarations":[{"name":"sorted","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":3,"end":3,"startOffset":141,"endOffset":196,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"runnable","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":4,"end":4,"startOffset":197,"endOffset":270,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"valueEdge","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":5,"end":5,"startOffset":271,"endOffset":352,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"analyzeProject","kind":"function","exported":true,"planned":false,"children":[],"note":"`extra.coverageLines` holds LCOV line hits for the test-quality check; they are not part of the result.","start":8,"end":37,"startOffset":465,"endOffset":2651,"metrics":{"lines":30,"internalDependencies":["lib/test-quality.mjs"],"hookCalls":[],"failureExits":[]}},{"name":"normalizedEdges","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":39,"end":45,"startOffset":2653,"endOffset":3015,"metrics":{"lines":7,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"fileAnalysis","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":47,"end":68,"startOffset":3017,"endOffset":5023,"metrics":{"lines":22,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"reachableTests","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":70,"end":82,"startOffset":5025,"endOffset":5934,"metrics":{"lines":13,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"cycleGroups","kind":"function","exported":false,"planned":false,"children":[],"note":"Iterative Kosaraju traversal also handles long chains without overflowing the JS call stack.","start":85,"end":114,"startOffset":6032,"endOffset":7403,"metrics":{"lines":30,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"sharedTypes","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":116,"end":131,"startOffset":7405,"endOffset":8459,"metrics":{"lines":16,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"createReport","kind":"function","exported":true,"planned":false,"children":[],"note":"This self-contained selector is also embedded in the offline HTML; analysis runs only in Node.\n`summarize` (summarizeTests) summarizes a scoped selection; without it a report keeps the project summary.","start":135,"end":172,"startOffset":8669,"endOffset":11952,"metrics":{"lines":38,"internalDependencies":[],"hookCalls":[],"failureExits":[{"line":137,"kind":"throw","branch":0},{"line":141,"kind":"throw","branch":0},{"line":142,"kind":"throw","branch":0},{"line":149,"kind":"throw","branch":0}]}}],"uses":{"lib/test-quality.mjs":["analyzeTests"]},"valueUses":{"lib/test-quality.mjs":["analyzeTests"]},"tests":["test/analysis.test.mjs","test/test-quality.test.mjs"],"created":"2026-10-17T18:31:40-04:00","changed":"2026-10-21T21:31:57-04:00","source":"// Shared structural analysis for the CLI and offline viewer. No I/O or source execution.\nimport { analyzeTests } from './test-quality.mjs';\nconst sorted = (values) => [...new Set(values)].sort();\nconst runnable = (path) => /\\.(test|spec|e2e)\\.[cm]?[jt]sx?$/.test(path);\nconst valueEdge = (edge) => edge.kind === 'value' || edge.kind === 'side-effect';\n\n/** `extra.coverageLines` holds LCOV line hits for the test-quality check; they are not part of the result. */\nexport function analyzeProject(data, extra = {}) {\n  const sources = new Map(data.files.map(file => [file.path, file]));\n  const all = [...data.files, ...(data.testFiles ?? [])];\n  const importers = new Map(), users = new Map();\n  for (const file of all) {\n    for (const target of file.imports) {\n      if (!importers.has(target)) importers.set(target, new Set());\n      importers.get(target).add(file.path);\n    }\n    for (const [target, names] of Object.entries(file.uses ?? {})) for (const name of names) {\n      const key = JSON.stringify([target, name]);\n      if (!users.has(key)) users.set(key, new Set());\n      users.get(key).add(file.path);\n    }\n  }\n  const edges = data.files.flatMap(file => normalizedEdges(file));\n  const internal = edges.filter(edge => sources.has(edge.target));\n  const files = data.files.map(file => fileAnalysis(file, data, sources, importers, users, edges));\n  const cycles = { all: cycleGroups([...sources.keys()], internal), value: cycleGroups([...sources.keys()], internal.filter(valueEdge)) };\n  const hotspots = files.filter(file => file.hotspotScore > 0).map(file => ({ path: file.path, lines: file.lines, commits: file.commits, score: file.hotspotScore }))\n    .sort((a, b) => b.score - a.score || a.path.localeCompare(b.path));\n  return { schemaVersion: 1, files, cycles, sharedTypes: sharedTypes(files, internal), hotspots, tests: analyzeTests(data, files, extra),\n    unclassifiedEdges: internal.filter(edge => edge.kind === 'unknown').length,\n    limits: ['Structural signals are candidates for inspection, not observed runtime defects.',\n      'Value dependencies include side effects and literal dynamic imports; calls and execution order are unproven.',\n      'Nonliteral dynamic imports and dynamic wiring are unresolved. Test imports do not prove assertions or execution.',\n      'Hook metrics count imported React hooks and useX-named custom hook candidates, including nested callbacks.',\n      'Primitive/vendor classification is a path heuristic for components/ui and components/ai-elements.',\n      'Test quality finds missing failure tests by pattern; it cannot judge whether an existing test checks the correct behavior.'] };\n}\n\nfunction normalizedEdges(file) {\n  const edges = (file.edges ?? []).map(edge => ({ source: file.path, ...edge }));\n  for (const target of file.imports) if (!edges.some(edge => edge.target === target)) edges.push({\n    source: file.path, target, specifier: null, kind: 'unknown', mode: 'unknown', line: null, typeNames: [], valueNames: [],\n  });\n  return edges;\n}\n\nfunction fileAnalysis(file, data, sources, importers, users, edges) {\n  const sourceImporters = sorted([...(importers.get(file.path) ?? [])].filter(path => sources.has(path)));\n  const exportDetails = file.exportDetails ?? file.exports.map(name => ({ name, category: 'unknown', line: null, localReferences: null }));\n  const exports = exportDetails.map(item => {\n    const consumers = sorted([...(users.get(JSON.stringify([file.path, item.name])) ?? []), ...(users.get(JSON.stringify([file.path, '*'])) ?? [])]);\n    return { ...item, consumers, usage: item.name === '*' ? 'unknown' : consumers.some(path => sources.has(path)) ? 'source' : consumers.length ? 'test-only'\n      : (importers.get(file.path)?.size ?? 0) ? 'unreferenced' : 'entry-point' };\n  });\n  // References between declarations feed the test-quality links only; reports keep the compact metrics.\n  const metricsOf = (d) => { const { references, ...metrics } = d.metrics ?? { lines: d.end - d.start + 1, internalDependencies: [], hookCalls: [], failureExits: [] }; return metrics; };\n  const flatten = (list, parent = '') => list.flatMap(d => [{ name: parent + d.name, kind: d.kind, start: d.start, end: d.end,\n    planned: d.planned, exported: d.exported, ...metricsOf(d) },\n    ...flatten(d.children ?? [], parent + d.name + '.')]);\n  const commits = data.coChanges?.changes?.[file.path] ?? 0;\n  return { path: file.path, lines: file.lines, commits, hotspotScore: commits * file.lines,\n    vendorCandidate: /(?:^|\\/)components\\/(?:ui|ai-elements)\\//.test(file.path),\n    imports: edges.filter(edge => edge.sour ctName","readAliases","readBudgets","readTestEntrypoints","selectSources","selectTests","underRoots"],"lib/mutation-report.mjs":["readMutation"],"lib/test-labels.mjs":["labelsForMap","loadTestLabels"],"lib/test-summary.mjs":["summarizeTests"]},"tests":["test/aliases.test.mjs","test/repair.test.mjs","test/test-quality.test.mjs"],"created":"2026-10-16T15:07:09-04:00","changed":"2026-10-21T22:42:29-04:00","source":"// Collects everything the map shows and renders the self-contained HTML page.\nimport { mkdirSync, readFileSync, writeFileSync } from 'node:fs';\nimport { dirname, relative, resolve } from 'node:path';\nimport { analyzeFile, createResolver } from './analyze.mjs';\nimport { analyzeProject, createReport } from './analysis.mjs';\nimport { descriptionStatus, loadDescriptions } from './descriptions.mjs';\nimport { branchesAt, growingBranch, sourceReader } from './git.mjs';\nimport { readChanges, readCoChanges, readFixCommits } from './changes.mjs';\nimport { readCoverage } from './coverage.mjs';\nimport { fileTimes, readHistory } from './history.mjs';\nimport { detectRoots, isCode, isTest, isTestScript, projectName, readAliases, readBudgets, readTestEntrypoints, selectSources, selectTests, underRoots } from './project.mjs';\nimport { readMutation } from './mutation-report.mjs';\nimport { labelsForMap, loadTestLabels } from './test-labels.mjs';\nimport { summarizeTests } from './test-summary.mjs';\n\nconst viewerPath = new URL('./viewer.html', import.meta.url);\n\n/** Reads the repository and returns the facts the page and the chat need. */\nexport function collect(repository, config, options) {\n  const ref = options.worktree ? null : (options.ref ?? growingBranch(repository, detectRoots(sourceReader(repository, 'HEAD').list(), config).filter((root) => root !== '.')));\n  const reader = sourceReader(repository, ref);\n  const all = reader.list();\n  const roots = detectRoots(all, config);\n  const sources = selectSources(all, roots);\n  const tests = selectTests(all);\n  // Include local config bases with arbitrary names as well as nested project configs.\n  const meta = [...all.filter((path) => path.endsWith('.json') || path.endsWith('.jsonc')), config.budgetsFrom]\n    .filter((path) => path && all.includes(path));\n  const texts = reader.read([...new Set([...sources, ...tests, ...meta])]);\n  const resolveImport = createResolver(new Set(all), readAliases(texts));\n  const files = sources.filter((path) => texts.has(path)).map((path) => analyzeFile(path, texts.get(path), resolveImport));\n  const testFacts = tests.filter((path) => texts.has(path)).map((path) => analyzeFile(path, texts.get(path), resolveImport, { tests: true }));\n  const sourcePaths = new Set(files.map(file => file.path));\n  const testEntrypoints = readTestEntrypoints(config.testEntrypoints, options.worktree ? sourcePaths : null,\n    options.worktree ? new Set(testFacts.map(file => file.path)) : null);\n  for (const test of testFacts) test.entrypoints = (testEntrypoints[test.path] ?? []).filter(path => sourcePaths.has(path));\n  const descriptionsPath = resolve(repository, options.descriptions ?? config.descriptions);\n  const descriptions = loadDescriptions(descriptionsPath);\n  const labelsPath = resolve(repository, options.labels ?? config.testLabels);\n  return { reader, roots, files, testFacts, texts, descriptions, descriptionsPath, labelsPath, labels: loadTestLabels(labelsPath),\n    mutation: readMutation(repository, config, options, texts),\n    unreadableTests: all.filter(isTestScript).sort(), name: projectName(texts, repository), budgets: readBudgets(config, texts) };\n}\n\nexport function mapData(repository, config, facts, historyLimit, worktree = false) {\n  const keep = (path) => isCode(path) && !isTest(path) && underRoots(path, facts.roots);\n  const snapshots = readHistory(repository, facts.reader.sha, facts.roots, keep, historyLimit);\n  const times = fileTimes(snapshots);\n  const testedBy = new Map();\n  for (const test of facts.testFa readFixCommits(repository, facts.reader.sha, keep, isTest),\n    testLabels: labelsForMap(facts.labels, facts.testFacts, facts.texts, relative(repository, facts.labelsPath)),\n    mutation: facts.mutation,\n    coChanges: readCoChanges(repository, facts.reader.sha, facts.roots, keep, known),\n    coverage: readCoverage(repository, config),\n    coverageSnapshot: worktree ? 'working-tree' : 'unbound-revision',\n    // Forbidden import directions, e.g. \"verify -> engine\" (module or folder names; \"*\" = any other module).\n    rules: Array.isArray(config.rules) ? config.rules.filter((rule) => typeof rule === 'string') : [],\n    changes: readChanges(repository, facts.reader.sha, facts.roots, keep, worktree),\n    history: { files: historyFiles, snapshots: snapshots.map((snapshot) => ({ sha: snapshot.sha.slice(0, 10), date: snapshot.date,\n      subject: snapshot.subject, sizes: [...snapshot.sizes].map(([path, size]) => [historyIndex.get(path), size]) })) },\n  };\n  data.analysis = analyzeProject(data, { coverageLines: data.coverage?.lines, coverageBranches: data.coverage?.branches });\n  // The analysis holds the compact test and link results; the raw scan and references would only make the page larger.\n  for (const test of data.testFiles) delete test.scan;\n  const strip = (list) => { for (const declaration of list) { if (declaration.metrics) delete declaration.metrics.references; strip(declaration.children ?? []); } };\n  for (const file of data.files) strip(file.declarations);\n  return data;\n}\n\nexport function renderPage(data, server) {\n  const json = (value) => JSON.stringify(value).replace(/\u003c/g, '\\\\u003c').replace(/[\\u2028\\u2029]/g, ' ');\n  return readFileSync(viewerPath, 'utf8')\n    .replace('\"__CODE_MAP_DATA__\"', () => json({ ...data, analysis: data.analysis ?? analyzeProject(data) }))\n    .replace('\"__CODE_MAP_SERVER__\"', () => json(server))\n    .replace('\"__CODE_MAP_REPORT_FN__\"', () => createReport.toString())\n    .replace('\"__C H%x09%cI%x09%s'];\n  let output = tryGit(repository, [...args.slice(0, 1), '--diff-merges=first-parent', ...args.slice(1), sha, ...pathspec]);\n  if (output === null) output = tryGit(repository, [...args, sha, ...pathspec]) ?? '';\n  return output.split('\\0').filter((chunk) => chunk.trim()).map((chunk) => {\n    const [head, ...rest] = chunk.split('\\n');\n    const [commit, date, ...subject] = head.split('\\t');\n    return { sha: commit.slice(0, 10), date, subject: subject.join('\\t'), files: [...new Set(rest.filter(Boolean).filter(keep))] };\n  }).filter((commit) => commit.files.length > 0);\n}\n\n/** Files changed since the mapped commit split from the main branch; null when there is no main branch or no split. */\nfunction baseChanges(repository, sha, pathspec, keep) {\n  for (const name of ['main', 'master', 'origin/main', 'origin/master']) {\n    const target = tryGit(repository, ['rev-parse', '--verify', '--quiet', `${name}^{commit}`])?.trim();\n    if (!target) continue;\n    if (target === sha) return null;\n    const fork = tryGit(repository, ['merge-base', target, sha])?.trim();\n    if (!fork || fork === sha) return null;\n    const count = Number(tryGit(repository, ['rev-list', '--count', '--first-parent', `${fork}..${sha}`])?.trim() || 0);\n    const files = lines(tryGit(repository, ['diff', '--name-only', fork, sha, ...pathspec])).filter(keep).sort();\n    return { name, fork: fork.slice(0, 10), commits: count, files };\n  }\n  return null;\n}\n\nfunction tryGit(repository, args) { try { return git(repository, args); } catch { return null; } }\nfunction lines(text) { return (text ?? '').split('\\n').filter(Boolean); }\n\n/**\n * How often each source file changed, and which files changed in the same commits (change coupling).\n * Bulk commits (formatting, renames, many files at once) are skipped because they couple everything with everything.\n */\nexport function readCoChanges(repository, sha, roots, keep, known) {\n  const pathspec = roots.include = hits;\n    } else if (current && line.startsWith('BRDA:')) {\n      // BRDA:\u003cline>,\u003cblock>,\u003cbranch>,\u003ctaken>; \"-\" means the block never ran, so its branches were not taken.\n      const [number, block, branch, taken] = line.slice(5).split(',');\n      const at = count(number ?? ''), id = count(block ?? ''), index = count(branch ?? ''), times = taken?.trim() === '-' ? 0 : count(taken ?? '');\n      if (at !== undefined && id !== undefined && index !== undefined && times !== undefined) (((branches[current] ??= Object.create(null))[at] ??= Object.create(null))[id] ??= [])[index] = times;\n    }\n    else if (line.trim() === 'end_of_record') finish();\n  }\n  finish();\n  const report = { file, date: statSync(resolve(repository, file)).mtime.toISOString(), files: { ...files }, revision: null, command: null };\n  // Line and branch hits stay in Node for the failure-exit check; they are not embedded in the page or the JSON.\n  Object.defineProperty(report, 'lines', { value: lines, enumerable: false });\n  Object.defineProperty(report, 'branches', { value: branches, enumerable: false });\n  return report;\n}\n"},{"path":"lib/descriptions.mjs","lines":58,"header":"Plain-language explanations of top-level folders, folders and files, and whether each one is still current.\nA file description is \"stale\" when the file's exported names changed after it was written.","summary":"Loads the plain-language descriptions of modules, folders, files and the guided tour from a JSON file, and marks each file description as missing, stale or current: a description is stale when a hash of the file's exported names no longer matches the stored one; the stamp operation writes those hashes into the file, and a Markdown work list shows the descriptions to write or review.","status":"current","imports":[],"externals":["node:crypto","node:fs","node:path"],"exports":["apiFingerprint","descriptionStatus","loadDescriptions","stampDescriptions","todoReport"],"edges":[{"target" ll(); finish(new Error('Claude enrichment failed: output exceeds 4 MB.')); }\n    });\n    child.stderr.on('data', chunk => { stderr = (stderr + chunk).slice(-4000); });\n    child.stdin.on('error', error => finish(new Error('Claude enrichment failed while sending source.', { cause: error })));\n    child.on('close', (code, killed) => {\n      if (code !== 0) { finish(new Error(`Claude enrichment failed (${killed || code}): ${stderr || 'no output'}`)); return; }\n      try {\n        finish(null, decodeEnrichment(stdout, tasks));\n      } catch (error) { finish(error); }\n    });\n    child.stdin.end(prompt);\n  });\n}\n\n/** Batches are sequential, and only complete validated responses are persisted. Completed batches survive an interruption. */\nexport async function enrich(facts, { signal, log = () => {} } = {}) {\n  const tasks = enrichmentTasks(facts);\n  if (!tasks.length) { log('Descriptions and test labels unchanged; reusing them.'); return; }\n  const batches = [];\n  let batch = [], size = 0;\n  for (const task of tasks) {\n    const bytes = JSON.stringify(task).length;\n    if (batch.length && size + bytes > 60000) { batches.push(batch); batch = []; size = 0; }\n    batch.push(task); size += bytes;\n  }\n  if (batch.length) batches.push(batch);\n  for (const [index, entries] of batches.entries()) {\n    log(`Claude enrichment batch ${index + 1}/${batches.length}: ${entries.length} files.`);\n    const results = await askModel(entries, signal);\n    for (const result of results) {\n      const task = result.task;\n      if (task.kind === 'description') {\n        const file = facts.files.find(file => file.path === task.path);\n        facts.descriptions.files[task.path] = { summary: result.summary, api: apiFingerprint(file), sourceHash: fileHash(task.source) };\n      } else facts.labels.files[task.path] = { hash: testHash(task.source), cases: result.cases };\n    }\n    writePage(facts.descriptionsPath, JSON.stringify(facts.descriptions, null, 2) + '\\n')
