) => root !== '.')));\n  const reader = sourceReader(repository, ref);\n  const all = reader.list();\n  const roots = detectRoots(all, config);\n  const sources = selectSources(all, roots);\n  const tests = selectTests(all);\n  // Include local config bases with arbitrary names as well as nested project configs.\n  const meta = [...all.filter((path) => path.endsWith('.json') || path.endsWith('.jsonc')), config.budgetsFrom]\n    .filter((path) => path && all.includes(path));\n  const texts = reader.read([...new Set([...sources, ...tests, ...meta])]);\n  const resolveImport = createResolver(new Set(all), readAliases(texts));\n  const files = sources.filter((path) => texts.has(path)).map((path) => analyzeFile(path, texts.get(path), resolveImport));\n  const testFacts = tests.filter((path) => texts.has(path)).map((path) => analyzeFile(path, texts.get(path), resolveImport));\n  const descriptionsPath = resolve(repository, options.descriptions ?? config.descriptions);\n  const descriptions = loadDescriptions(descriptionsPath);\n  return { reader, roots, files, testFacts, texts, descriptions, descriptionsPath,\n    name: projectName(texts, repository), budgets: readBudgets(config, texts) };\n}\n\nexport function mapData(repository, config, facts, historyLimit, worktree = false) {\n  const keep = (path) => isCode(path) && !isTest(path) && underRoots(path, facts.roots);\n  const snapshots = readHistory(repository, facts.reader.sha, facts.roots, keep, historyLimit);\n  const times = fileTimes(snapshots);\n  const testedBy = new Map();\n  for (const test of facts.testFacts) for (const target of test.imports) testedBy.set(target, [...(testedBy.get(target) ?? []), test.path]);\n  const historyFiles = [...new Set(snapshots.flatMap((snapshot) => [...snapshot.sizes.keys()]))].sort();\n  const historyIndex = new Map(historyFiles.map((path, index) => [path, index]));\n  const known = new Set(facts.files.map((file) => file.path));\n  const data = {\n    generatedAt: new Date().toISOString(), project: facts.name, roots: facts.roots,\n    ref: (facts.reader.label === 'working tree' ? '' : branchesAt(repository, facts.reader.sha)) || facts.reader.label,\n    sha: facts.reader.sha, budgets: facts.budgets, limits: config.limits ?? null,\n    modules: facts.descriptions.modules, folders: facts.descriptions.folders,\n    tour: facts.descriptions.tour.map((step) => ({ ...step, files: (step.files ?? []).filter((path) => known.has(path)) })),\n    files: facts.files.map((file) => {\n      const text = facts.descriptions.files[file.path];\n      const time = times.get(file.path);\n      return { path: file.path, lines: file.lines, header: file.header, summary: text?.summary ?? '',\n        status: descriptionStatus(text, file), imports: file.imports, externals: file.externals, exports: file.exports,\n        edges: file.edges, exportDetails: file.exportDetails, declarations: file.declarations, uses: file.uses, valueUses: file.valueUses, tests: testedBy.get(file.path) ?? [], created: time?.created ?? null,\n        changed: time?.changed ?? null, source: facts.texts.get(file.path) ?? '' };\n    }),\n    tests: facts.testFacts.length,\n    // Tests and their imports, so the page can find every test that reaches a file (directly or through other files).\n    testFiles: facts.testFacts.map((test) => ({ path: test.path, imports: test.imports, edges: test.edges, uses: test.uses, valueUses: test.valueUses })),\n    coChanges: readCoChanges(repository, facts.reader.sha, facts.roots, keep, known),\n    coverage: readCoverage(repository, config),\n    coverageSnapshot: worktree ? 'working-tree' : 'unbound-revision',\n    // Forbidden import directions, e.g. \"verify -> engine\" (module or folder names; \"*\" = any other module).\n    rules: Array.isArray(config.rules) ? config.rules.filter((rule) => typeof rule === 'string') : [],\n    changes: readChanges(repository, facts.reader.sha, facts.roots, keep, worktree),\n    history: { files: historyFiles, snapshots: sna it } from './git.mjs';\n\nconst maxCommits = 30;\n\n/**\n * The last commits of the mapped branch with the source files each one changed, plus (when there is one) the files\n * changed since the branch left main/master, and uncommitted changes when the working tree is mapped.\n */\nexport function readChanges(repository, sha, roots, keep, worktree) {\n  const pathspec = roots.includes('.') ? [] : ['--', ...roots];\n  const commits = recentCommits(repository, sha, pathspec, keep);\n  const base = baseChanges(repository, sha, pathspec, keep);\n  let uncommitted = null;\n  if (worktree) {\n    const tracked = lines(tryGit(repository, ['diff', '--name-only', 'HEAD', ...pathspec]));\n    const untracked = lines(tryGit(repository, ['ls-files', '--others', '--exclude-standard', ...pathspec]));\n    uncommitted = [...new Set([...tracked, ...untracked])].filter(keep).sort();\n  }\n  return { commits, base, uncommitted };\n}\n\nfunction recentCommits(repository, sha, pathspec, keep) {\n  const args = ['log', '--first-parent', '-n', String(maxCommits), '--name-only', '--format=%x00%H%x09%cI%x09%s'];\n  let output = tryGit(repository, [...args.slice(0, 1), '--diff-merges=first-parent', ...args.slice(1), sha, ...pathspec]);\n  if (output === null) output = tryGit(repository, [...args, sha, ...pathspec]) ?? '';\n  return output.split('\\0').filter((chunk) => chunk.trim()).map((chunk) => {\n    const [head, ...rest] = chunk.split('\\n');\n    const [commit, date, ...subject] = head.split('\\t');\n    return { sha: commit.slice(0, 10), date, subject: subject.join('\\t'), files: [...new Set(rest.filter(Boolean).filter(keep))] };\n  }).filter((commit) => commit.files.length > 0);\n}\n\n/** Files changed since the mapped commit split from the main branch; null when there is no main branch or no split. */\nfunction baseChanges(repository, sha, pathspec, keep) {\n  for (const name of ['main', 'master', 'origin/main', 'origin/master']) {\n    const target = tryGit(repository, ['rev-parse  / changes.get(x) \u003c 0.3) continue;\n      if (!partners.has(x)) partners.set(x, []);\n      partners.get(x).push([y, count]);\n    }\n  }\n  for (const list of partners.values()) list.sort((p, q) => q[1] - p[1]).splice(8);\n  return { changes: Object.fromEntries(changes), partners: Object.fromEntries(partners) };\n}\n"},{"path":"lib/coverage.mjs","lines":32,"header":"Test coverage, when the project's test runner has written an lcov report (Jest, Vitest, c8 and nyc all can).\nThe report is read from the working folder: it is a generated file, usually not committed.","summary":"","status":"missing","imports":[],"externals":["node:fs","node:path"],"exports":["readCoverage"],"edges":[{"target":null,"specifier":"node:fs","kind":"value","mode":"static","line":3,"typeNames":[],"valueNames":["existsSync","readFileSync","statSync"]},{"target":null,"specifier":"node:path","kind":"value","mode":"static","line":4,"typeNames":[],"valueNames":["isAbsolute","relative","resolve"]}],"exportDetails":[{"name":"readCoverage","category":"value","localName":"readCoverage","typeOnly":false,"line":8,"localReferences":0}],"declarations":[{"name":"candidates","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":6,"end":6,"startOffset":328,"endOffset":420,"metrics":{"lines":1,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"readCoverage","kind":"function","exported":true,"planned":false,"children":[],"note":"","start":8,"end":32,"startOffset":422,"endOffset":1709,"metrics":{"lines":25,"internalDependencies":[],"hookCalls":[],"failureExits":[]}}],"uses":{},"valueUses":{},"tests":["test/repair.test.mjs"],"created":"2026-10-16T15:07:09-04:00","changed":"2026-10-16T15:07:09-04:00","source":"// Test coverage, when the project's test runner has written an lcov report (Jest, Vitest, c8 and nyc all can).\n// The report is read from the working folder: it is a generated file, usually not committed.\nimport { existsSync, readFileSync, statSync } from 'node:fs';\nimport { isAbsolute, relative, resolve } from 'node:path';\n\nconst candidates = ['coverage/lcov.info', 'coverage/lcov/lcov.info', '.coverage/lcov.info'];\n\nexport function readCoverage(repository, config) {\n  const file = typeof config.coverage === 'string' ? config.coverage : candidates.find((path) => existsSync(resolve(repository, path)));\n  if (!file || !existsSync(resolve(repository, file))) return null;\n  const files = Object.create(null);\n  let current = null;\n  let found, hit;\n  const finish = () => {\n    if (current && Number.isSafeInteger(found) && Number.isSafeInteger(hit) && found >= 0 && hit >= 0 && hit \u003c= found) files[current] = [found, hit];\n    current = null;\n    found = undefined;\n    hit = undefined;\n  };\n  const count = (text) => /^\\d+$/.test(text.trim()) ? Number(text) : undefined;\n  for (const line of readFileSync(resolve(repository, file), 'utf8').split('\\n')) {\n    if (line.startsWith('SF:')) {\n      finish();\n      const path = line.slice(3).trim();\n      current = (isAbsolute(path) ? relative(repository, path) : path).replace(/\\\\/g, '/');\n    } else if (current && line.startsWith('LF:')) found = count(line.slice(3));\n    else if (current && line.startsWith('LH:')) hit = count(line.slice(3));\n    else if (line.trim() === 'end_of_record') finish();\n  }\n  finish();\n  return { file, date: statSync(resolve(repository, file)).mtime.toISOString(), files: { ...files }, revision: null, command: null };\n}\n"},{"path":"lib/descriptions.mjs","lines":58,"header":"Plain-language explanations of top-level folders, folders and files, and whether each one is still current.\nA file description is \"stale\" when the file's exported names changed after it was written.","summary":"","status":"missing","imports":[],"externals":["node:crypto","node:fs","node:path"],"exports":["apiFingerprint","descriptionStatus","loadDescriptions","stampDescriptions","todoReport"],"edges":[{"target":null,"specifier":"node:crypto","ki text.summary || text.summary.trim().length === 0) return 'missing';\n  if (text.api !== undefined && text.api !== apiFingerprint(facts)) return 'stale';\n  return 'current';\n}\n\nexport function stampDescriptions(path, descriptions, files, all) {\n  let stamped = 0;\n  for (const facts of files) {\n    const text = descriptions.files[facts.path];\n    if (!text || (text.api !== undefined && !all)) continue;\n    text.api = apiFingerprint(facts);\n    stamped += 1;\n  }\n  mkdirSync(dirname(path), { recursive: true });\n  writeFileSync(path, JSON.stringify(descriptions, null, 2) + '\\n');\n  return stamped;\n}\n\n/** A Markdown work list that a person or an agent can use to write missing descriptions. */\nexport function todoReport(descriptions, files, descriptionsPath) {\n  const lines = ['# Code map: descriptions to write or review', '',\n    `Write one plain-language sentence per file in \\`${descriptionsPath}\\` under \"files\", keyed by path,`,\n    'then run `code-map stamp`.', ''];\n  for (const facts of files) {\n    const status = descriptionStatus(descriptions.files[facts.path], facts);\n    if (status === 'current') continue;\n    lines.push(`## ${facts.path} (${status}, ${facts.lines} lines)`);\n    if (status === 'stale') lines.push(`Current description: ${descriptions.files[facts.path].summary}`);\n    if (facts.header) lines.push(`Header comment: ${facts.header.replace(/\\s+/g, ' ')}`);\n    lines.push(`Exports: ${facts.exports.join(', ') || '(none)'}`, '');\n  }\n  return lines.join('\\n');\n}\n"},{"path":"lib/git.mjs","lines":71,"header":"Read-only Git access. Nothing here writes to the repository.","summary":"","status":"missing","imports":[],"externals":["node:child_process","node:fs","node:path"],"exports":["branchesAt","git","growingBranch","lineCount","repositoryRoot","sourceReader"],"edges":[{"target":null,"specifier":"node:child_process","kind":"value","mode":"static","line":2,"typeNames":[],"valueNames":["execFileSync"]},{"target":null,"spec = posix.dirname(child);\n    }\n  }\n  const host = {\n    useCaseSensitiveFileNames: true,\n    getCurrentDirectory: () => '/',\n    fileExists: (path) => absolute.has(posix.normalize(path)),\n    readFile: (path) => absolute.get(posix.normalize(path)),\n    // TypeScript 6.0.3 uses this same matcher in sys.readDirectory. Supply snapshot\n    // directory entries so include/exclude and inherited paths stay compiler-defined.\n    readDirectory: (path, extensions, excludes, includes, depth) => ts.matchFiles(path, extensions, excludes, includes,\n      true, '/', depth, (directory) => {\n        const entries = directories.get(posix.resolve('/', directory));\n        return { files: [...(entries?.files ?? [])], directories: [...(entries?.directories ?? [])] };\n      }, (path) => path),\n    // Malformed configs have no usable project; mapping other files can continue.\n    onUnRecoverableConfigFileDiagnostic: () => undefined,\n  };\n  return { absolute, host };\n}\n\n/** Optional line budgets per top-level folder: given in the config, or read from a size-check script. */\nexport function readBudgets(config, texts) {\n  if (config.budgets && typeof config.budgets === 'object') return config.budgets;\n  const source = typeof config.budgetsFrom === 'string' ? texts.get(config.budgetsFrom) : undefined;\n  if (source === undefined) return {};\n  const budgets = {};\n  const block = /limits[^{]*\\{([^}]*)\\}/.exec(source)?.[1] ?? '';\n  for (const match of block.matchAll(/(\\w+):\\s*([\\d_]+)/g)) budgets[match[1]] = Number(match[2].replace(/_/g, ''));\n  const total = /total > ([\\d_]+)/.exec(source)?.[1];\n  if (total !== undefined) budgets.total = Number(total.replace(/_/g, ''));\n  return budgets;\n}\n"},{"path":"lib/server.mjs","lines":142,"header":"Local server for `code-map serve`: serves the map and answers chat questions with Claude Code.\nIt listens on 127.0.0.1 only, answers only requests addressed to that address, and every chat request must carry\na token that only the served page knows, so other websites open in the browser cannot use it.\nClaude Code gets read-only tools and none of the mapped repository's own settings, hooks or MCP servers.","summary":"","status":"missing","imports":[],"externals":["node:child_process","node:crypto","node:http"],"exports":["startServer"],"edges":[{"target":null,"specifier":"node:child_process","kind":"value","mode":"static","line":5,"typeNames":[],"valueNames":["spawn"]},{"target":null,"specifier":"node:crypto","kind":"value","mode":"static","line":6,"typeNames":[],"valueNames":["randomBytes"]},{"target":null,"specifier":"node:http","kind":"value","mode":"static","line":7,"typeNames":[],"valueNames":["default"]}],"exportDetails":[{"name":"startServer","category":"value","localName":"startServer","typeOnly":false,"line":17,"localReferences":0}],"declarations":[{"name":"systemPrompt","kind":"value","exported":false,"planned":false,"children":[],"note":"","start":9,"end":15,"startOffset":537,"endOffset":1063,"metrics":{"lines":7,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"startServer","kind":"function","exported":true,"planned":false,"children":[],"note":"","start":17,"end":48,"startOffset":1065,"endOffset":2807,"metrics":{"lines":32,"internalDependencies":[],"hookCalls":[],"failureExits":[{"line":30,"kind":"catch","probe":31},{"line":43,"kind":"reject"}]}},{"name":"chat","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":50,"end":62,"startOffset":2809,"endOffset":3794,"metrics":{"lines":13,"internalDependencies":[],"hookCalls":[],"failureExits":[{"line":55,"kind":"catch","probe":55}]}},{"name":"prompt","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":64,"end":75,"startOffset":3796,"endOffset":4736,"metrics":{"lines":12,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"runClaude","kind":"function","exported":false,"planned":false,"children":[],"note":"Runs `claude -p` with streamed JSON output and forwards text, tool activity and the session id.","start":78,"end":115,"startOffset":4841,"endOffset":6882,"metrics":{"lines":38,"internalDependencies":[],"hookCalls":[],"failureExits":[{"line":99,"kind":"catch","probe":99}]}},{"name":"forward","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":117,"end":135,"startOffset":6884,"endOffset":8016,"metrics":{"lines":19,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"toolLabel","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":137,"end":142,"startOffset":8018,"endOffset":8350,"metrics":{"lines":6,"internalDependencies":[],"hookCalls":[],"failureExits":[]}}],"uses":{},"valueUses":{},"tests":["test/security.test.mjs"],"created":"2026-10-16T15:07:09-04:00","changed":"2026-10-16T15:07:09-04:00","source":"// Local server for `code-map serve`: serves the map and answers chat questions with Claude Code.\n// It listens on 127.0.0.1 only, answers only requests addressed to that address, and every chat request must carry\n// a token that only the served page knows, so other websites open in the browser cannot use it.\n// Claude Code gets read-only tools and none of the mapped repository's own settings, hooks or MCP servers.\nimport { spawn } from 'node:child_process';\nimport { randomBytes } from 'node:crypto';\nimport http from 'node:http';\n\nconst systemPrompt = [\n  'You are helping the owner of this repository understand its code. They are looking at a visual code map',\n  'and asking about the part they selected. Answer in plain English and keep it short; use a few bullets when it helps.',\n  'Define each abbreviation the first time you use it. When you refer to code, give its location as path:line,',\n  'for example src/cli/server.ts:19, so the map can link to it. Read and search files as needed.',\n  'Never try to change files or run commands.',\n].join(' ');\n\nexport function startServer({ workspace, port, page }) {\n  const token = randomBytes(24).toString('hex');\n  const server = http.createServer((request, response) => {\n    // DNS rebinding: a website can point its own name at 127.0.0.1, but the browser still sends that name.\n    const own = (address) => address === `127.0.0.1:${server.address().port}` || address === `localhost:${server.address().port}`;\n    if (!own(request.headers.host)) return response.writeHead(403).end();\n    const origin = request.headers.origin;\n    if (origin !== undefined && !(origin.startsWith('http://') && own(origin.slice('http://'.length)))) return response.writeHead(403).end();\n    const url = new URL(request.url ?? '/', 'http://127.0.0.1');\n    if (request.method === 'GET' && url.pathname === '/') {\n      try {\n        response.writeHead(200, { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' });\n        response.end(page({ token }));\n      } catch (error) {\n        response.writeHead(500, { 'content-type': 'text/plain' }).end(String(error?.stack ?? error));\n      }\n      return;\n    }\n    if (request.method === 'POST' && url.pathname === '/api/chat') return chat(request, response, token, workspace());\n    response.writeHead(404).end();\n  });\n  // A port already in use (often an older code-map left running) moves on to the next free one.\n  return new Promise((resolve, reject) => {\n    let candidate = port;\n    server.on('error', (error) => {\n      if (error.code === 'EADDRINUSE' && candidate \u003c port + 20) server.listen(++candidate, '127.0.0.1');\n      else reject(error);\n    });\n    server.once('listening', () => resolve({ server, port: server.address().port }));\n    server.listen(candidate, '127.0.0.1');\n  });\n}\n\nasync function chat(request, response, token, place) {\n  if (request.headers['x-code-map-token'] !== token) return response.writeHead(403).end();\n  let body = '';\n  for await (const chunk of request) { body += chunk; if (body.length > 400_000) return response.writeHead(413).end(); }\n  let input;\n  try { input = JSON.parse(body); } catch { return response.writeHead(400).end(); }\n  if (typeof input.message !== 'string' || input.message.trim() === '') return response.writeHead(400).end();\n  response.writeHead(200, { 'content-type': 'application/x-ndjson; charset=utf-8', 'cache-control': 'no-store' });\n  const send = (event) => { if (!response.writableEnded) response.write(JSON.stringify(event) + '\\n'); };\n  const child = runClaude(place, prompt(input), typeof input.session === 'string' ? input.session : null, send);\n  response.on('close', () => { if (child.exitCode === null) child.kill('SIGTERM'); });\n  child.on('close', () => { send({ type: 'done' }); response.end(); });\n}\n\nfunction prompt(input) {\n  const context = input.context && typeof input.context === 'object' ? input.context : null;\n  if (!context?.path) return input.message;\n  const where = context.kind === 'decl' ? `${context.declKind ?? 'declaration'} ${context.name} in ${context.path}`\n    + (context.start ? ` (lines ${context.start}–${context.end})` : '') : `${context.kind ?? 'item'} ${context.path}`;\n  const about = context.summary ? `\\nIts description in the map: ${context.summary}` : '';\n  const code = typeof context.code === 'string' && context.code\n    ? `\\n\\nThe selected code (${context.path}${context.codeStart ? `, from line ${context.codeStart}` : ''}):\\n\\`\\`\\`\\n${context.code}\\n\\`\\`\\``\n    : '';\n  const contents = typeof context.contents === 'string' && context.contents ? `\\n\\nWhat it contains:\\n${context.contents}` : '';\n  return `Selected in the code map: ${where}.${about}${code}${contents}\\n\\nQuestion: ${input.message}`;\n}\n\n/** Runs `claude -p` with streamed JSON output and forwards text, tool activity and the session id. */\nfunction runClaude(place, text, session, send) {\n  const repository = place.directory;\n  const command = process.env.CODE_MAP_CLAUDE || 'claude';\n  // The mapped repository is untrusted: its .claude settings could add hooks that run commands, and its .mcp.json\n  // could add tools. Only the user's own settings load, no MCP servers start, and only the three read tools exist.\n  const args = ['-p', '--output-format', 'stream-json', '--verbose', '--include-partial-messages',\n    '--setting-sources', 'user', '--strict-mcp-config', '--tools', 'Read,Grep,Glob',\n    '--allowedTools', 'Read,Grep,Glob', '--disallowedTools', 'Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch',\n    '--append-system-prompt', `${systemPrompt} ${place.note}`, ...(session ? ['--resume', session] : [])];\n  const child = spawn(command, args, { cwd: repository, stdio: ['pipe', 'pipe', 'pipe'] });\n  child.stdin.end(text);\n  let buffer = '', errors = '', streamed = false, wrote = false;\n  child.stdout.setEncoding('utf8');\n  child.stdout.on('data', (chunk) => {\n    buffer += chunk;\n    let newline;\n    while ((newline = buffer.indexOf('\\n')) >= 0) {\n      const line = buffer.slice(0, newline).trim();\n      buffer = buffer.slice(newline + 1);\n      if (!line) continue;\n      let event;\n      try { event = JSON.parse(line); } catch { continue; }\n      const result = forward(event, send, streamed, wrote, repository);\n      streamed ||= result.streamed; wrote ||= result.wrote;\n    }\n  });\n  child.stderr.setEncoding('utf8');\n  child.stderr.on('data', (chunk) => { errors = (errors + chunk).slice(-4000); });\n  child.on('error', (error) => {\n    send({ type: 'error', message: error.code === 'ENOENT'\n      ? 'The Claude Code command (`claude`) was not found. Install Claude Code and log in, or set CODE_MAP_CLAUDE to its path.'\n      : String(error.message) });\n  });\n  child.on('close', (code) => {\n    if (code !== 0 && code !== null && !wrote) send({ type: 'error', message: errors.trim() || `Claude Code exited with code ${code}` });\n  });\n  return child;\n}\n\nfunction forward(event, send, streamed, wrote, repository) {\n  const out = { streamed: false, wrote: false };\n  if (event.session_id && ((event.type === 'system' && event.subtype === 'init') || event.type === 'result')) send({ type: 'session', id: event.session_id });\n  if (event.type === 'stream_event' && event.event?.type === 'content_block_delta' && event.event.delta?.type === 'text_delta') {\n    send({ type: 'text', text: event.event.delta.text });\n    return { streamed: true, wrote: true };\n  }\n  if (event.type === 'assistant') {\n    for (const block of event.message?.content ?? []) {\n      if (block.type === 'tool_use') send({ type: 'tool', text: toolLabel(block, repository) });\n      if (block.type === 'text' && !streamed && block.text) { send({ type: 'text', text: block.text }); out.wrote = true; }\n    }\n  }\n  if (event.type === 'result') {\n    if (event.is_error) send({ type: 'error', message: String(event.result ?? 'Claude Code reported an error') });\n    else if (!wrote && !out.wrote && typeof event.result === 'string') { send({ type: 'text', text: event.result }); out.wrote = true; }\n  }\n  return out;\n}\n\nfunction toolLabel(block, repository) {\n  const input = block.input ?? {};\n  const target = String(input.file_path ?? input.pattern ?? input.path ?? '').replace(repository + '/', '');\n  const verb = { Read: 'Reading', Grep: 'Searching for', Glob: 'Listing' }[block.name] ?? block.name;\n  return `${verb} ${String(target)}`.trim();\n}\n"},{"path":"lib/snapshot.mjs","lines":52,"header":"The chat must read the same version of the code that the map shows. When the mapped commit is not the\nchecked-out one, this exports that commit into a private, temporary folder (the repository is not touched)\nand Claude Code runs there.","summary":"","status":"missing","imports":["lib/git.mjs"],"externals":["node:child_process","node:crypto","node:fs","node:os","node:path"],"exports":["chatWorkspace","privateRoot"],"edges":[{"target":null,"specifier":"node:child_process","kind":"value","mode":"static","line":4,"typeNames":[],"valueNames":["execFileSync"]},{"target":null,"specifier":"node:crypto","kind":"value","mode":"static","line":5,"typeNames":[],"valueNames":["createHash"]},{"target":null,"specifier":"node:fs","kind":"value","mode":"static","line":6,"typeNames":[],"valueNames":["existsSync","lstatSync","mkdirSync","readdirSync","rmSync","writeFileSync"]},{"target":null,"specifier":"node:os","kind":"value","mode":"static","line":7,"typeNames":[],"valueNames":["tmpdir"]},{"target":null,"specifier":"node:path","kind":"value","mode":"static","line":8,"typeNames":[],"valueNames":["join"]},{"target":"lib/git.mjs","specifier":"./git.mjs","kind":"value","mode":"static","line":9,"typeNames":[],"valueNames":["git"]}],"exportDetails":[{"name":"chatWorkspace","category":"value","localName":"chatWorkspace","typeOnly":false,"line":11,"localReferences":0},{"name":"privateRoot","category":"value","localName":"privateRoot","typeOnly":false,"line":38,"localReferences":1}],"declarations":[{"name":"chatWorkspace","kind":"function","exported":true,"planned":false,"children":[],"note":"","start":11,"end":32,"startOffset":537,"endOffset":2168,"metrics":{"lines":22,"internalDependencies":["lib/git.mjs"],"hookCalls":[],"failureExits":[]}},{"name":"privateRoot","kind":"function","exported":true,"planned":false,"children":[],"note":"The snapshot folder has a fixed name, and on Linux the temporary folder is shared: another user could create the\nname first or swap in a symlink. So it must be a real folder that this user owns and that nobody else can open.\nAn older code-map used `code-map` and left it open to other users. That folder is never reused or deleted:\nothers could have planted symlinks in it, and they can race a recursive delete with more of them.","start":38,"end":42,"startOffset":2620,"endOffset":2837,"metrics":{"lines":5,"internalDependencies":[],"hookCalls":[],"failureExits":[]}},{"name":"requirePrivate","kind":"function","exported":false,"planned":false,"children":[],"note":"","start":44,"end":52,"startOffset":2839,"endOffset":3237,"metrics":{"lines":9,"internalDependencies":[],"hookCalls":[],"failureExits":[{"line":48,"kind":"throw"}]}}],"uses":{"lib/git.mjs":["git"]},"valueUses":{"lib/git.mjs":["git"]},"tests":["test/security.test.mjs"],"created":"2026-10-16T15:07:09-04:00","changed":"2026-10-16T15:07:09-04:00","source":"// The chat must read the same version of the code that the map shows. When the mapped commit is not the\n// checked-out one, this exports that commit into a private, temporary folder (the repository is not touched)\n// and Claude Code runs there.\nimport { execFileSync } from 'node:child_process';\nimport { createHash } from 'node:crypto';\nimport { existsSync, lstatSync, mkdirSync, readdirSync, rmSync, writeFileSync } from 'node:fs';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';\nimport { git } from './git.mjs';\n\nexport function chatWorkspace(repository, sha, label, worktree) {\n  if (worktree) return { directory: repository, note: 'The map shows the working tree, including uncommitted changes. You are in that working tree.' };\n  if (git(repository, ['rev-parse', 'HEAD']).trim() === sha) {\n    return { directory: repository, note: `The map shows ${label} at commit ${sha.slice(0, 7)}, which is the checked-out commit. You are in the repository.` };\n  }\n  const base = join(privateRoot(), createHash('sha256').update(repository).digest('hex').slice(0, 12));\n  mkdirSync(base, { recursive: true, mode: 0o700 });\n  requirePrivate(base); // its old snapshots are deleted below, so it must not be a symlink to somewhere else\n  const name = sha.slice(0, 12), directory = join(base, name), marker = join(directory, '.code-map-snapshot');\n  if (!existsSync(marker)) {\n    rmSync(directory, { recursive: true, force: true });\n    mkdirSync(directory, { recursive: true, mode: 0o700 });\n    const archive = join(base, `${name}.tar`);\n    git(repository, ['archive', '--format=tar', `--output=${archive}`, sha]);\n    execFileSync('tar', ['-xf', archive, '-C'   if (node.kind === 'decl') return { kind: 'decl', declKind: node.decl.kind, name: (node.parent.kind === 'decl' ? node.parent.name + '.' : '') + node.name,
    path: file.id, start: node.decl.start, end: node.decl.end, summary: node.decl.note || file.file?.summary || '' };
  if (node.kind === 'file') return { kind: 'file', path: node.id, summary: node.file?.summary || '' };
  return { kind: node.kind, path: node.id, summary: node.kind === 'module' ? (DATA.modules[node.name]?.summary || DATA.modules[node.name]?.title || '') : (DATA.folders[node.id] || '') };
}
/** The code and contents that travel with a question, so Claude can answer without searching first. */
const CODE_CHARACTERS = 24000;
function withMaterial(context, node) {
  const file = fileNodeOf(node)?.file;
  if (file && (node.kind === 'decl' || node.kind === 'file')) {
    const lines = file.source.split('\n');
    const from = node.kind === 'decl' ? node.decl.start : 1, to = node.kind === 'decl' ? node.decl.end : lines.length;
    let code = lines.slice(from - 1, to).join('\n');
    if (code.length > CODE_CHARACTERS) code = code.slice(0, CODE_CHARACTERS) + '\n… (cut here; read the file for the rest)';
    return { ...context, code, codeStart: from };
  }
  if (node && node.kind !== 'decl' && node.kind !== 'file') {
    const files = filesUnder(node).filter((n) => n.file).slice(0, 80);
    return { ...context, contents: files.map((n) => `- ${n.id} (${n.file.lines} lines)${n.file.summary ? ': ' + n.file.summary : ''}`).join('\n') };
  }

}
function contextLabel(c) {
  if (c.kind === 'decl') return `${c.path} › ${c.name}${c.start ? ` (lines ${c.start}–${c.end})` : ''}`;
  return c.kind === 'project' ? `the whole project` : c.path;
}
function renderChat() {
  const context = contextOf(state.selected);
  panel.innerHTML = `<div class="chat-head"><div><div class="kind">Chat about the code</div><b>Ask Claude</b></div><span class="spacer"></span>
      ${chat.messages.length ? '<button class="iconbtn" id="newchat">New chat</button>' : ''}</div>
    <div class="chat-log" id="chatlog">${SERVER ? chatLog() : `<div class="msg assistant"><p>The chat needs the local server.</p>
      <p>In the repository, run <code>code-map serve</code> (or <code>npm run map serve</code>) and open the address it prints,
      usually <code>http://127.0.0.1:4477</code>. The map is the same; the Chat tab then answers questions using Claude Code,
      which can read and search the repository but not change it.</p></div>`}</div>
    <div class="context">${chat.withContext ? `<span>About:</span><span class="chip accent" title="${esc(contextLabel(context))}">${esc(contextLabel(context))}</span><button id="nocontext" title="Ask without the selection">✕</button>`
      : '<span>Not linked to the selection.</span><button id="usecontext">Link to the selected box</button>'}</div>
    <div class="composer"><textarea id="chatinput" rows="2" placeholder="${SERVER ? 'Ask about the selected box… (Enter to send, Shift+Enter for a new line)' : 'Start code-map serve to chat'}" ${SERVER ? '' : 'disabled'}>${esc(chat.draft)}</textarea>
      <button id="send" ${!SERVER || chat.busy ? 'disabled' : ''}>${chat.busy ? 'Stop' : 'Send'}</button></div>`;
  const input = panel.querySelector('#chatinput'), send = panel.querySelector('#send');
  input.addEventListener('input', () => { chat.draft = input.value; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });
  send.addEventListener('click', () => (chat.busy ? chat.controller?.abort() : sendChat()));
  if (chat.busy) send.disabled = false;
  panel.querySelector('#newchat')?.addEventListener('click', () => { chat.controller?.abort(); Object.assign(chat, { messages: [], session: null, busy: false, sentContext: '' }); renderChat(); });
  panel.querySelector('#nocontext')?.addEventListener('click', () => { chat.withContext = false; renderChat(); });
  panel.querySelector('#usecontext')?.addEventListener('click', () => { chat.withContext = true; renderChat(); });
  const log = panel.querySelector('#chatlog'); log.scrollTop = log.scrollHeight;
}
function chatLog() {
  if (!chat.messages.length) return `<div class="msg assistant"><p>Ask anything about the code: what the selected part does, why it exists,
    how it connects to the rest. Select a box on the map first, or press <b>Ask about this</b> in the Details tab.</p>
    <p class="kind">Locations in answers are links: click one to move the map there.</p></div>`;
  return chat.messages.map((m) => m.role === 'user'
    ? `<div class="msg user">${m.about ? `<span class="about">About ${esc(m.about)}</span>` : ''}${esc(m.text)}</div>`
    : `<div class="msg ${m.error ? 'error' : 'assistant'}">${m.tools.length ? `<div class="tools">${m.tools.slice(-4).map((t) => `<div>${esc(t)}</div>`).join('')}</div>` : ''}${m.text ? markdown(m.text) : (m.error ? '' : '<span class="thinking">Thinking</span>')}${m.error ? esc(m.error) : ''}</div>`).join('');
}
function refreshLog() {
  const log = panel.querySelector('#chatlog'); if (!log || state.tab !== 'chat') return;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.innerHTML = chatLog(); if (atBottom) log.scrollTop = log.scrollHeight;
}
async function sendChat() {
  const text = chat.draft.trim(); if (!text || chat.busy || !SERVER) return;
  const context = chat.withContext ? contextOf(state.selected) : null;
  // The code is sent once per selection; follow-up questions about the same box only repeat the reference.
  const key = context ? JSON.stringify(context) : '';
  const material = context && key !== chat.sentContext ? withMaterial(context, state.selected) : context;
  chat.sentContext = key;
  const answer = { role: 'assistant', text: '', tools: [], error: '' };
  chat.messages.push({ role: 'user', text, about: context ? contextLabel(context) : '' }, answer);
  chat.draft = ''; chat.busy = true; chat.controller = new AbortController(); renderChat();
  try {
    const response = await fetch('/api/chat', { method: 'POST', signal: chat.controller.signal,
      headers: { 'content-type': 'application/json', 'x-code-map-token': SERVER.token },
      body: JSON.stringify({ message: text, session: chat.session, context: material }) });
    if (!response.ok || !response.body) throw new Error(response.status === 403 ? 'The page is out of date: reload it.' : `Server error ${response.status}`);
    const reader = response.body.getReader(), decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let newline;
      while ((newline = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, newline); buffer = buffer.slice(newline + 1);
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.type === 'text') answer.text += event.text;
        if (event.type === 'tool') { if (answer.text && !answer.text.endsWith('\n\n')) answer.text += '\n\n'; answer.tools.push(event.text); }
        if (event.type === 'session') chat.session = event.id;
        if (event.type === 'error') answer.error = event.message;
      }
      refreshLog();
    }
  } catch (error) {
    if (error.name !== 'AbortError') answer.error = error.message.includes('fetch') ? 'The code-map server is not running. Start it with code-map serve.' : error.message;
    else answer.text += answer.text ? '\n\n*(stopped)*' : '*(stopped)*';
  }
  chat.busy = false; chat.controller = null;
  if (state.tab === 'chat') renderChat();
}
/** A small Markdown renderer for answers: paragraphs, lists, code, bold, plus links for path:line locations. */
function markdown(text) {
  const blocks = text.split(/```[\w-]*\n?/);
  return blocks.map((block, i) => i % 2 ? `<pre><code>${linkify(esc(block.replace(/\n$/, '')))}</code></pre>` : prose(block)).join('');
}
function prose(text) {
  const out = []; let list = null;
  const inline = (line) => linkify(esc(line).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*([^*]+)\*(?=\W|$)/g, '$1<i>$2</i>'));
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; } };
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    const bullet = /^\s*[-*•]\s+(.*)/.exec(line), numbered = /^\s*\d+[.)]\s+(.*)/.exec(line), heading = /^#{1,6}\s+(.*)/.exec(line);
    if (bullet || numbered) { flush(); const kind = bullet ? 'ul' : 'ol'; if (list !== kind) { close(); out.push(`<${kind}>`); list = kind; } out.push(`<li>${inline((bullet || numbered)[1])}</li>`); continue; }
    close();
    if (heading) { flush(); out.push(`<p><b>${inline(heading[1])}</b></p>`); continue; }
    if (!line.trim()) { flush(); continue; }
    para.push(line);
  }
  flush(); close();
  return out.join('');
}
/** Turns "src/cli/server.ts:19" (or a bare known path) into a link that moves the map there. */
function linkify(html) {
  return html.replace(/(?<![\w/.-])((?:[\w@.$\[\]()-]+\/)*[\w@.$\[\]()-]+\.(?:[cm]?[jt]sx?))(?:(?::|#L| line )(\d+)(?:[-–](\d+))?)?/g, (match, path, line) => {
    const node = findFile(path); if (!node) return match;
    return `<a class="goto" data-goto="${esc(node.id)}" data-line="${line || ''}">${match}</a>`;
  });
}
function findFile(path) {
  const clean = path.replace(/^\.\//, '');
  if (nodes.get(clean)?.kind === 'file') return nodes.get(clean);
  const matches = [...nodes.values()].filter((n) => n.kind === 'file' && (n.id.endsWith('/' + clean)));
  return matches.length === 1 ? matches[0] : null;
}
function gotoLocation(path, line) {
  const file = nodes.get(path); if (!file) return;
  let target = file;
  if (line) for (let search = true; search;) {
    search = false;
    for (const c of target.children) if (c.decl && c.decl.start <= line && line <= c.decl.end) { target = c; search = true; break; }
  }
  travel(target);
}

/* ---------- code rendering ---------- */
const KEYWORDS = new Set('import export from const let var function return if else for while of in new class extends implements interface type async await try catch finally throw typeof instanceof void null undefined true false this super readonly declare as satisfies default switch case break continue keyof static private public protected'.split(' '));
function code(source, from, focus, to) {
  const all = source.split('\n');
  const last = to ? Math.min(all.length, to) : all.length;
  let inBlock = false, out = '';
  for (let i = 0; i < last; i++) {
    const res = highlight(all[i], inBlock); inBlock = res.inBlock;
    if (i + 1 < from) continue;
    const isFocus = focus && i + 1 >= focus[0] && i + 1 <= focus[1];
    out += `<span class="line${isFocus ? ' focus' : ''}"><span class="ln">${i + 1}</span>${res.html}</span>`;
  }
  return `<pre class="code">${out}</pre>`;
}
function highlight(line, inBlock) {
  let html = '', i = 0;
  const push = (cls, text) => { html += cls ? `<span class="${cls}">${esc(text)}</span>` : esc(text); };
  if (inBlock) { const end = line.indexOf('*/'); if (end < 0) { push('t-c', line); return { html, inBlock: true }; } push('t-c', line.slice(0, end + 2)); i = end + 2; }
  while (i < line.length) {
    const rest = line.slice(i);
    if (rest.startsWith('//')) { push('t-c', rest); break; }
    if (rest.startsWith('/*')) { const end = rest.indexOf('*/', 2); if (end < 0) { push('t-c', rest); return { html, inBlock: true }; } push('t-c', rest.slice(0, end + 2)); i += end + 2; continue; }
    const q = rest[0];
    if (q === '"' || q === "'" || q === '`') { let j = 1; while (j < rest.length && rest[j] !== q) j += rest[j] === '\\' ? 2 : 1; push('t-s', rest.slice(0, j + 1)); i += j + 1; continue; }
    const word = /^[A-Za-z_$][\w$]*/.exec(rest);
    if (word) { push(KEYWORDS.has(word[0]) ? 't-k' : '', word[0]); i += word[0].length; continue; }
    const num = /^\d[\d_.]*/.exec(rest);
    if (num) { push('t-n', num[0]); i += num[0].length; continue; }
    push('', rest[0]); i += 1;
  }
  return { html, inBlock: false };
}

/* ---------- search ---------- */
const searchEl = document.getElementById('search'), resultsEl = document.getElementById('results');
const index = [...nodes.values()].filter((n) => n.kind === 'file' && n.file || n.kind === 'decl');
let hits = [], active = 0;
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  hits = q ? index.filter((n) => n.name.toLowerCase().includes(q) || (n.kind === 'file' && n.file.summary.toLowerCase().includes(q)))
    .sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) || (a.kind === 'file' ? 0 : 1) - (b.kind === 'file' ? 0 : 1)).slice(0, 14) : [];
  active = 0; drawHits();
});
function drawHits() {
  resultsEl.style.display = hits.length ? 'block' : 'none';
  resultsEl.innerHTML = hits.map((n, i) => `<button data-i="${i}" class="${i === active ? 'active' : ''}"><b class="mono">${esc(n.name)}</b> <span class="chip">${n.kind === 'file' ? 'file' : n.decl.kind}</span><small>${esc(n.kind === 'file' ? n.id : fileNodeOf(n).id)}</small></button>`).join('');
}
function pick(n) { hits = []; drawHits(); searchEl.value = ''; searchEl.blur(); state.tab = 'details'; state.highlight = null; travel(n); }
resultsEl.addEventListener('mousedown', (e) => { const b = e.target.closest('button'); if (b) { e.preventDefault(); pick(hits[Number(b.dataset.i)]); } });
searchEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { active = Math.min(hits.length - 1, active + 1); drawHits(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { active = Math.max(0, active - 1); drawHits(); e.preventDefault(); }
  if (e.key === 'Enter' && hits[active]) pick(hits[active]);
});
searchEl.addEventListener('blur', () => setTimeout(() => { resultsEl.style.display = 'none'; }, 120));

/* ---------- helpers & start ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n) { return Number(n).toLocaleString('en-US'); }
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function day(iso) { return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' }); }
// The map measures its own height, so the rows around it (crumbs, legend, timeline) must be filled in first.
function renderAll() { renderCrumbs(); renderLegend(); renderTimeline(); renderMap(); renderPanel(); }

document.getElementById('title').textContent = `${DATA.project} code map`;
document.title = `${DATA.project} · code map`;
document.getElementById('meta').textContent = `${DATA.ref} · ${DATA.sha.slice(0, 7)} · ${fmt(DATA.files.reduce((s, f) => s + f.lines, 0))} lines`;
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('code-map-theme', document.documentElement.dataset.theme); } catch { /* storage unavailable */ }
});
try { const t = localStorage.getItem('code-map-theme'); if (t) document.documentElement.dataset.theme = t; } catch { /* storage unavailable */ }
const start = nodes.get(decodeURIComponent(location.hash.slice(1)));
if (start) { state.selected = start; state.focus = start.kind === 'decl' || visibleChildren(start).length ? start : start.parent; }
/* ---------- resizable side panel ---------- */
const PANEL_DEFAULT = 400;
function setPanelWidth(width) {
  const clamped = Math.round(Math.max(280, Math.min(width, innerWidth * 0.7)));
  document.documentElement.style.setProperty('--panel-width', clamped + 'px');
  return clamped;
}
try { const saved = Number(localStorage.getItem('code-map-panel-width')); if (saved) setPanelWidth(saved); } catch { /* storage unavailable */ }
(() => {
  const handle = document.getElementById('resizer');
  let frame = 0, width = 0;
  handle.addEventListener('pointerdown', (e) => {
    handle.setPointerCapture(e.pointerId); handle.classList.add('dragging'); document.body.classList.add('resizing');
    tileEls.forEach((el) => { el.style.transitionDuration = '0s'; });
  });
  handle.addEventListener('pointermove', (e) => {
    if (!handle.classList.contains('dragging')) return;
    width = setPanelWidth(innerWidth - e.clientX);
    cancelAnimationFrame(frame); frame = requestAnimationFrame(renderMap);
  });
  const finish = () => {
    if (!handle.classList.contains('dragging')) return;
    handle.classList.remove('dragging'); document.body.classList.remove('resizing');
    tileEls.forEach((el) => { el.style.transitionDuration = ''; });
    try { if (width) localStorage.setItem('code-map-panel-width', String(width)); } catch { /* storage unavailable */ }
    renderMap();
  };
  handle.addEventListener('pointerup', finish); handle.addEventListener('pointercancel', finish);
  handle.addEventListener('dblclick', () => {
    setPanelWidth(PANEL_DEFAULT);
    try { localStorage.removeItem('code-map-panel-width'); } catch { /* storage unavailable */ }

  });
})();
/* Instant tooltips for dots and connection boxes in the panel (the browser's own title tooltip waits seconds). */
panel.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) return;
  tip.innerHTML = `<b>${esc(t.dataset.tip)}</b><div class="muted">${esc(t.dataset.tip2 || '')}</div>`;
  tip.style.display = 'block';
});
panel.addEventListener('mousemove', (e) => {
  if (tip.style.display !== 'block' || !e.target.closest('[data-tip]')) return;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';

addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderMap, 120); });
renderAll();
